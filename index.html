<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ôn giữa kỳ Tiếng Anh 6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: sổ tay học sinh. Thanh tab dính phía trên, nội dung là các "trang vở" trên nền giấy lạnh, lề đỏ đánh dấu tiêu đề. */
:root{
  --bg:#f5f8fd; --paper:#ffffff; --ink:#18244a; --muted:#53608a; --line:#d8e0f0;
  --accent:#2346c8; --accent-ink:#ffffff; --accent-soft:#e5ebfc;
  --margin:#d63a56; --hl:#ffe46b; --on-hl:#18244a;
  --good:#10784a; --good-bg:#e0f4ea; --bad:#b52a28; --bad-bg:#fcebea; --warn:#855800; --warn-bg:#fff2cf;
  --shadow:0 1px 0 rgba(24,36,74,.05),0 10px 24px -14px rgba(24,36,74,.35);
  --f-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,'Segoe UI',sans-serif;
  --f-ipa:'Noto Sans','Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b25; --paper:#162a38; --ink:#e9f0f6; --muted:#9db0c0; --line:#2a4254;
    --accent:#8db2ff; --accent-ink:#0c1a2c; --accent-soft:#1d3550;
    --margin:#ff7b90; --hl:#f2d84c; --on-hl:#18244a;
    --good:#5fd8a3; --good-bg:#12372a; --bad:#ff8b85; --bad-bg:#40201f; --warn:#f3c456; --warn-bg:#3a3013;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b25; --paper:#162a38; --ink:#e9f0f6; --muted:#9db0c0; --line:#2a4254;
  --accent:#8db2ff; --accent-ink:#0c1a2c; --accent-soft:#1d3550;
  --margin:#ff7b90; --hl:#f2d84c; --on-hl:#18244a;
  --good:#5fd8a3; --good-bg:#12372a; --bad:#ff8b85; --bad-bg:#40201f; --warn:#f3c456; --warn-bg:#3a3013;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.65;padding-bottom:56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:var(--hl);color:var(--on-hl);padding:0 .25em;border-radius:3px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{font-family:var(--f-display);font-weight:700;background:var(--margin);color:#fff;border-radius:8px;padding:2px 9px;font-size:20.5px;letter-spacing:.02em}
.brand b{display:block;font-family:var(--f-display);font-size:19.5px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:15.5px}
.tabs{display:flex;gap:6px;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.tabs a{flex:0 0 auto}
.sign{display:block;max-width:150px;height:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
.tabs a{text-decoration:none;color:var(--ink);font-weight:800;font-size:18px;padding:7px 13px;border-radius:999px;border:2px solid transparent;white-space:nowrap}
.tabs a:hover{background:var(--accent-soft)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

main{padding-block:22px}
.pane>*+*{margin-top:18px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
h2.sec{border-left:5px solid var(--margin);padding-left:12px;font-size:28.5px}
h3{font-size:23px}
h4{font-size:19.5px;margin:16px 0 6px;color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:10px;padding:8px 16px;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 11px;min-height:34px;font-size:17.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-weight:700;font-size:17.5px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:19px}
th,td{border:1.5px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-family:var(--f-display);font-weight:600}
td.n,th.n{text-align:center;white-space:nowrap}

/* start */
.hero{padding:26px 22px;background:var(--paper);border:1.5px solid var(--line);border-left:7px solid var(--margin);border-radius:14px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(30px,6vw,45.5px)}
.hero p{max-width:60ch;margin-top:8px;font-size:19.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.step:hover{border-color:var(--accent)}
.step b{font-family:var(--f-display);font-size:23px}
.step span{color:var(--muted);font-size:19px}
.step .big{font-family:var(--f-display);font-size:36.5px;font-weight:700;color:var(--accent);line-height:1}
.plan{margin:0;padding-left:22px}
.plan li{margin:6px 0}

/* vocab */
.filters{display:flex;flex-direction:column;gap:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vcard{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile{position:relative;height:212px;perspective:900px;cursor:pointer;border-radius:14px}
.tile-in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.tile.flipped .tile-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);justify-content:flex-start;padding-top:12px}
.tile.known .face.front{border-color:var(--good)}
.en{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15;word-break:break-word}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:19px}
.pos{font-size:15px;font-weight:800;color:var(--margin);text-transform:uppercase;letter-spacing:.08em}
.hint{font-size:15.5px;color:var(--muted)}
.vi{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.2}
.exen{font-size:18px;font-style:italic}
.exvi{font-size:17px;color:var(--muted)}
.vtools{display:flex;gap:6px}
.vtools .btn{flex:1}
.vtools .btn.on{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.topic{font-size:22px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.topic::after{content:"";flex:1;height:2px;background:var(--line)}
.qz-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.qz-opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;min-height:48px}
.qz-opt:hover:not([disabled]){border-color:var(--accent)}
.qz-opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.qz-opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* grammar */
.gwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.gnav{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
.gnav button{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;line-height:1.3}
.gnav button small{display:block;font-weight:600;color:var(--muted);font-size:15px}
.gnav button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gart h3{font-size:30px}
.lead{font-size:19.5px;margin-top:8px}
.rule{background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:8px;padding:10px 14px;margin:10px 0}
.rule b.f{font-family:var(--f-display);font-size:20.5px}
.tip{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:8px;padding:10px 14px;margin:10px 0}
.warn{background:var(--bad-bg);border-left:5px solid var(--bad);border-radius:8px;padding:10px 14px;margin:10px 0}
.ok{color:var(--good);font-weight:800}
.no{color:var(--bad);font-weight:800}
.exs{margin:6px 0;padding-left:20px}
.exs li{margin:3px 0}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.scenes figure{margin:0;border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--paper);text-align:center}
.scenes svg{width:100%;height:auto;display:block}
.scenes figcaption{font-size:17.5px;line-height:1.3}
.sp{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:2px 10px;font-weight:700;cursor:pointer;margin:2px;font-family:var(--f-body)}
.sp:hover{border-color:var(--accent)}
.sp i{font-style:normal;font-family:var(--f-ipa);color:var(--muted);font-weight:400;font-size:16px;margin-left:4px}
.nextprev{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}

/* practice */
.pnav{display:flex;gap:8px;flex-wrap:wrap}
.pnav button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer;text-align:left;line-height:1.25}
.pnav button small{display:block;font-weight:600;color:var(--muted);font-size:15px}
.pnav button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pnav button.done small{color:var(--good)}
.summary{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.summary .score{font-family:var(--f-display);font-size:36.5px;font-weight:700;line-height:1}
.group{margin-top:22px}
.group>h3{font-size:20.5px;color:var(--accent);margin-bottom:10px}
.q{display:flex;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:10px}
.q .num{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;display:flex;align-items:center;justify-content:center}
.q-body{flex:1;min-width:0}
.q-text{margin-bottom:8px}
.q.ok2{border-color:var(--good);background:var(--good-bg)}
.q.bad2{border-color:var(--bad);background:var(--bad-bg)}
.q.part2{border-color:var(--warn);background:var(--warn-bg)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{position:relative;display:block;cursor:pointer}
.choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choice span{display:block;border:2px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--paper);min-height:42px}
.choice:hover span{border-color:var(--accent)}
.choice input:checked+span{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.choice input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.choice input:disabled{cursor:default}
.tfs{display:flex;gap:8px}
.tfs .choice{min-width:92px}
input.txt,textarea.txt,select.gap,input.mini{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:7px 11px;min-height:42px}
input.txt,textarea.txt{width:100%}
textarea.txt{min-height:70px;resize:vertical}
input.mini{width:130px;display:inline-block;min-height:34px;padding:2px 8px;margin:0 3px}
select.gap{min-height:34px;padding:2px 6px;margin:0 2px;max-width:100%}
input.txt:focus,textarea.txt:focus,select.gap:focus,input.mini:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.passage{border:1.5px solid var(--line);border-left:5px solid var(--margin);background:var(--paper);border-radius:12px;padding:14px 16px;line-height:2}
.box{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.box span{border:2px solid var(--ink);border-radius:8px;padding:1px 12px;font-weight:800;background:var(--paper)}
.fb{margin-top:10px;font-size:19px;border-top:1.5px dashed var(--line);padding-top:8px}
.fb .st{font-weight:800}
.fb .st.g{color:var(--good)} .fb .st.b{color:var(--bad)} .fb .st.p{color:var(--warn)}
.fb .ans{margin:2px 0}
.fb .why{color:var(--ink)}
.fb a,.fb button.lnk{color:var(--accent);font-weight:800;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-size:19px}
.chk{list-style:none;padding:0;margin:6px 0}
.chk li::before{content:"✓ ";color:var(--good);font-weight:800}
.chk li.x::before{content:"✗ ";color:var(--bad)}
.note{border:1.5px dashed var(--warn);background:var(--warn-bg);border-radius:12px;padding:12px 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

@media (max-width:760px){
  .gwrap{grid-template-columns:minmax(0,1fr)}
  .gnav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .gnav button{flex:none;min-width:150px}
  .brand small{display:none}
  .tabs a{padding:6px 11px;font-size:17.5px}
}
@media (prefers-reduced-motion: reduce){
  .tile-in,.bar>i{transition:none}
}

/* ===== v2: giao diện "sticker" – viền đậm, bóng cứng, thẻ từ hiện sẵn nghĩa ===== */
:root{--edge:#18244a;--dot:#d6deef;--hard:4px 4px 0 var(--edge);--hard-s:2px 2px 0 var(--edge);
  --u1:#2346c8;--u1s:#e5ebfc;--u2:#0b7a6f;--u2s:#dcf3ef;--u3:#c22f4a;--u3s:#fde6ea;--onc:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--edge:#6e90a8;--dot:#1d3140;
  --u1:#8db2ff;--u1s:#1d3550;--u2:#5fd8c4;--u2s:#123a37;--u3:#ff8aa0;--u3s:#40222b;--onc:#0c1a2c}}
:root[data-theme="dark"]{--edge:#6e90a8;--dot:#1d3140;
  --u1:#8db2ff;--u1s:#1d3550;--u2:#5fd8c4;--u2s:#123a37;--u3:#ff8aa0;--u3s:#40222b;--onc:#0c1a2c}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px}
.top{border-bottom:2px solid var(--edge)}
.brand-mark{border:2px solid var(--edge);box-shadow:var(--hard-s)}
.tabs a{border:2px solid transparent}
.tabs a:hover{border-color:var(--edge);background:var(--paper)}
.tabs a[aria-current="page"]{border-color:var(--edge);box-shadow:var(--hard-s)}
.card,.hero,.step,.summary,.passage,.note{border:2px solid var(--edge);box-shadow:var(--hard)}
.hero{border-left:10px solid var(--margin);padding:28px 24px}
.hero h1{font-size:clamp(34.5px,7vw,56px)}
.hero mark{padding:0 .18em;border-radius:6px}
.step{transition:transform .1s,box-shadow .1s}
.step:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--edge);border-color:var(--edge)}
.step .big{font-size:47.5px}
.step:nth-child(1) .big{color:var(--u1)}.step:nth-child(2) .big{color:var(--u2)}.step:nth-child(3) .big{color:var(--u3)}
.btn{border:2px solid var(--edge);box-shadow:3px 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:none;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.small{box-shadow:2px 2px 0 var(--edge)}
.chip{border-color:var(--edge);box-shadow:2px 2px 0 var(--edge)}
.chip[aria-pressed="true"]{box-shadow:none;transform:translate(2px,2px)}
.pnav button,.gnav button{border-color:var(--edge);box-shadow:var(--hard-s)}
.pnav button[aria-current="true"],.gnav button[aria-current="true"]{background:var(--hl);color:var(--on-hl);box-shadow:none;transform:translate(2px,2px)}
.pnav button[aria-current="true"] small,.gnav button[aria-current="true"] small{color:var(--on-hl)}
h2.sec{font-size:clamp(30px,5vw,36.5px);border-left:8px solid var(--margin)}
.q{border:2px solid var(--edge);box-shadow:var(--hard-s)}
.q .num{background:var(--hl);color:var(--on-hl);border:2px solid var(--edge)}
.q.ok2{border-color:var(--good);box-shadow:2px 2px 0 var(--good)}
.q.bad2{border-color:var(--bad);box-shadow:2px 2px 0 var(--bad)}
.q.part2{border-color:var(--warn);box-shadow:2px 2px 0 var(--warn)}
.choice span{border-color:var(--line)}
.choice input:checked+span{border-color:var(--edge);background:var(--hl);color:var(--on-hl)}
input.txt,textarea.txt,select.gap,input.mini{border-color:var(--edge)}
th{border-color:var(--edge);background:var(--hl);color:var(--on-hl)}
td{border-color:var(--line)}
table.vt td.ipa{font-family:var(--f-ipa);color:var(--muted)}
table.vt td{vertical-align:middle}
.gart{overflow:hidden}
.gart h3{font-size:32.5px}
.rule{border-left-width:6px}
.qz-opt{border-color:var(--edge);box-shadow:var(--hard-s)}
.qz-opt.ok{box-shadow:2px 2px 0 var(--good)}.qz-opt.no{box-shadow:2px 2px 0 var(--bad)}

/* thẻ từ vựng: nghĩa + ví dụ hiện sẵn, loa to */
.vgrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.wcard{--c:var(--u1);--cs:var(--u1s);display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--paper);border:2px solid var(--edge);border-radius:16px;box-shadow:var(--hard);padding-bottom:14px;overflow:hidden}
.wcard.u2{--c:var(--u2);--cs:var(--u2s)}
.wcard.u3{--c:var(--u3);--cs:var(--u3s)}
.wcard.known{box-shadow:4px 4px 0 var(--good)}

function scene(kind){
  const S='stroke="var(--accent)" stroke-width="2"';
  const box='fill="var(--accent-soft)"';
  const ball=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--margin)" stroke="var(--ink)" stroke-width="1.5"/>`;
  const floor='<line x1="8" y1="104" x2="172" y2="104" stroke="var(--muted)" stroke-width="2"/>';
  let g='';
  if(kind==='in'){g=`<path d="M52 44 L52 100 L128 100 L128 44" fill="none" ${S}/>`+ball(90,88,11);}
  if(kind==='on'){g=`<rect x="52" y="62" width="76" height="42" ${box} ${S}/>`+ball(90,51,11);}
  if(kind==='under'){g=`<rect x="44" y="42" width="92" height="10" ${box} ${S}/><line x1="52" y1="52" x2="52" y2="104" ${S}/><line x1="128" y1="52" x2="128" y2="104" ${S}/>`+ball(90,92,11);}
  if(kind==='above'){g=`<rect x="52" y="70" width="76" height="34" ${box} ${S}/>`+ball(90,32,11);}
  if(kind==='front'){g=`<rect x="64" y="40" width="80" height="64" ${box} ${S}/>`+ball(50,90,14);}
  if(kind==='behind'){g=ball(100,48,12)+`<rect x="56" y="54" width="80" height="50" ${box} ${S}/>`;}
  if(kind==='next'){g=`<rect x="30" y="58" width="56" height="46" ${box} ${S}/>`+ball(114,92,12);}
  if(kind==='between'){g=`<rect x="14" y="58" width="48" height="46" ${box} ${S}/><rect x="118" y="58" width="48" height="46" ${box} ${S}/>`+ball(90,92,12);}
  if(kind==='middle'){g=`<rect x="22" y="22" width="136" height="82" fill="none" ${S} stroke-dasharray="6 4"/>`+ball(90,63,12);}
  return `<svg viewBox="0 0 180 120" role="img" aria-hidden="true">${kind==='middle'?'':floor}${g}</svg>`;
}
const SC=(kind,en,vi)=>`<figure>${scene(kind)}<figcaption><b>${en}</b><br>${vi}</figcaption></figure>`;
const SP=(w,ipa)=>`<button type="button" class="sp" data-act="speak" data-t="${w}">${w}${ipa?`<i>${ipa}</i>`:''}</button>`;

{id:'g-present-simple',title:'Hiện tại đơn',unit:'Unit 1',ex:'verb',html:`
<p class="lead">Dùng để nói về <mark>thói quen</mark>, <mark>việc lặp đi lặp lại</mark> và <mark>sự thật hiển nhiên</mark>. Ví dụ: Linh học tiếng Anh mỗi ngày.</p>
<h4>1. Động từ thường</h4>
<div class="tbl"><table>
<tr><th>Loại câu</th><th>Công thức</th><th>Ví dụ</th></tr>
<tr><td>Khẳng định</td><td>S + V(s/es)</td><td>Linh <b>studies</b> English every day.</td></tr>
<tr><td>Phủ định</td><td>S + <b>don't / doesn't</b> + V (nguyên mẫu)</td><td>Nam <b>doesn't have</b> breakfast at home.</td></tr>
<tr><td>Nghi vấn</td><td><b>Do / Does</b> + S + V (nguyên mẫu)?</td><td><b>Does</b> your school <b>have</b> a swimming pool?</td></tr>
<tr><td>Trả lời</td><td>Yes, S + do/does. &nbsp; No, S + don't/doesn't.</td><td>Yes, it <b>does</b>. / No, it <b>doesn't</b>.</td></tr>
</table></div>
<div class="rule"><b class="f">Chọn do hay does?</b><br>I, you, we, they, danh từ số nhiều (my grandparents, the students) → <b>do / don't</b>.<br>He, she, it, danh từ số ít (Nam, my mother, the cat) → <b>does / doesn't</b>.</div>
<div class="warn"><b>Lỗi hay gặp:</b> đã có does/doesn't thì động từ chính <b>trở về nguyên mẫu</b>, không thêm -s.<br><span class="no">✗ Does she studies English?</span> &nbsp; <span class="ok">✓ Does she study English?</span></div>
<h4>2. Cách thêm -s / -es cho he, she, it</h4>
<div class="tbl"><table>
<tr><th>Quy tắc</th><th>Ví dụ</th></tr>
<tr><td>Phần lớn động từ: thêm <b>-s</b></td><td>play → plays, live → lives, sit → sits</td></tr>
<tr><td>Tận cùng <b>s, x, z, ch, sh, o</b>: thêm <b>-es</b></td><td>watch → watches, go → goes, do → does, wash → washes</td></tr>
<tr><td>Phụ âm + <b>y</b>: đổi y thành <b>-ies</b></td><td>study → studies, fly → flies (nhưng play → plays vì trước y là nguyên âm)</td></tr>
<tr><td>Đặc biệt</td><td>have → <b>has</b></td></tr>
</table></div>
<h4>3. Động từ to be (am / is / are)</h4>
<ul class="exs"><li>I <b>am</b> excited. &nbsp; He/She/It <b>is</b> shy. &nbsp; We/You/They <b>are</b> friendly.</li>
<li>Phủ định: thêm <b>not</b> (isn't, aren't). Nghi vấn: đưa be lên đầu: <b>Is</b> she shy? → Yes, she <b>is</b>. / No, she <b>isn't</b>.</li></ul>
<h4>4. Dấu hiệu nhận biết</h4>
<p>every day / every week, usually, often, sometimes, always, never, on weekdays, at weekends, after school, on Monday.</p>
<div class="tip"><b>Trong đề cương:</b> câu 2 (<i>every day</i>), 3 (<i>usually</i>), 5 (<i>on weekdays</i>), 7 và 9 là hiện tại đơn. Câu có <i>Look!</i>, <i>now</i>, <i>at the moment</i>, <i>right now</i> là hiện tại tiếp diễn (xem bài sau).</div>
`},
{id:'g-adv',title:'Trạng từ chỉ tần suất',unit:'Unit 1',ex:'write',html:`
<p class="lead">Trạng từ chỉ tần suất cho biết việc đó xảy ra <mark>thường xuyên đến mức nào</mark>.</p>
<div class="tbl"><table>
<tr><th>Trạng từ</th><th>Nghĩa</th><th>Mức độ</th></tr>
<tr><td><b>always</b></td><td>luôn luôn</td><td>100%</td></tr>
<tr><td><b>usually</b></td><td>thường thường</td><td>khoảng 80%</td></tr>
<tr><td><b>often</b></td><td>thường</td><td>khoảng 60–70%</td></tr>
<tr><td><b>sometimes</b></td><td>thỉnh thoảng</td><td>khoảng 30–40%</td></tr>
<tr><td><b>rarely</b></td><td>hiếm khi</td><td>khoảng 10%</td></tr>
<tr><td><b>never</b></td><td>không bao giờ</td><td>0%</td></tr>
</table></div>
<h4>Vị trí trong câu: nhớ "sau BE, trước V"</h4>
<div class="rule">
<b class="f">1) Sau to be (am/is/are):</b> My brother is <mark>never</mark> late for school.<br>
<b class="f">2) Trước động từ thường:</b> Nam <mark>usually</mark> does judo in the gym.<br>
<b class="f">3) sometimes</b> (và often, usually) còn có thể đứng đầu câu: <i>Sometimes</i> Linh is shy with strangers.
</div>
<div class="warn"><b>Lỗi hay gặp:</b><br><span class="no">✗ Nam does usually judo.</span> &nbsp; <span class="ok">✓ Nam usually does judo.</span><br><span class="no">✗ My brother never is late.</span> &nbsp; <span class="ok">✓ My brother is never late.</span><br>Never đã mang nghĩa phủ định, nên <b>không</b> dùng thêm don't/doesn't: <span class="no">✗ He doesn't never play.</span></div>
<h4>Hỏi về tần suất</h4>
<p><b>How often</b> do you play football? — I <b>often</b> play football. / Twice a week.</p>
`},
{id:'g-possessive',title:'Sở hữu cách',unit:'Unit 2',ex:'write',html:`
<p class="lead">Sở hữu cách dùng để nói <mark>ai là chủ của vật gì</mark>, rất hay dùng cho người và con vật.</p>
<div class="tbl"><table>
<tr><th>Chủ sở hữu</th><th>Cách viết</th><th>Ví dụ</th></tr>
<tr><td>Danh từ số ít</td><td>thêm <b>'s</b></td><td>my brother<b>'s</b> bag, Lan<b>'s</b> room</td></tr>
<tr><td>Danh từ số nhiều có -s</td><td>chỉ thêm dấu <b>'</b></td><td>the students<b>'</b> books, my grandparents<b>'</b> house</td></tr>
<tr><td>Số nhiều bất quy tắc (children, men, women, people)</td><td>thêm <b>'s</b></td><td>the children<b>'s</b> toys</td></tr>
</table></div>
<h4>Đổi từ "the ... of ..." sang sở hữu cách trong 3 bước</h4>
<ol class="exs">
<li>Tìm chủ sở hữu, thường đứng sau <b>of</b>: <i>the bag of <u>my brother</u></i>.</li>
<li>Đưa chủ sở hữu lên trước và thêm <b>'s</b> hoặc <b>'</b>: <i>my brother's</i>.</li>
<li>Viết vật sở hữu sau đó, bỏ <b>the</b> và <b>of</b>: <i>my brother's bag</i>.</li>
</ol>
<div class="tbl"><table>
<tr><th>Câu gốc</th><th>Sở hữu cách</th></tr>
<tr><td>The room of Lan is on the second floor.</td><td><b>Lan's room</b> is on the second floor.</td></tr>
<tr><td>These are the books of the students.</td><td>These are <b>the students' books</b>.</td></tr>
<tr><td>The toys of the children are on the sofa.</td><td><b>The children's toys</b> are on the sofa.</td></tr>
<tr><td>The house of my grandparents is a stilt house.</td><td><b>My grandparents' house</b> is a stilt house.</td></tr>
</table></div>
<div class="warn"><b>Lỗi hay gặp:</b><br><span class="no">✗ grandparents's &nbsp; ✗ childrens' &nbsp; ✗ brothers bag</span><br>Với đồ vật thì dùng <b>of</b>, không dùng 's: <i>the door of the room</i>.</div>
`},
{id:'g-prep',title:'Giới từ chỉ vị trí',unit:'Unit 2',ex:'write',html:`
<p class="lead">Giới từ chỉ vị trí cho biết <mark>vật ở đâu</mark>. Quả bóng đỏ là vật cần tìm.</p>
<div class="scenes">
${SC('in','in','ở trong')}${SC('on','on','ở trên (chạm mặt)')}${SC('under','under','ở dưới')}${SC('above','above','ở phía trên (không chạm)')}
${SC('front','in front of','ở phía trước')}${SC('behind','behind','ở phía sau')}${SC('next','next to','ở cạnh')}${SC('between','between','ở giữa hai vật')}${SC('middle','in the middle of','ở chính giữa')}
</div>
<h4>Cách đổi câu mà nghĩa không đổi</h4>
<div class="tbl"><table>
<tr><th>Câu gốc</th><th>Đổi thành</th><th>Quy tắc</th></tr>
<tr><td>The hall is next to the living room.</td><td>The living room is next to the hall.</td><td>next to: đổi chỗ hai vật, giữ nguyên giới từ</td></tr>
<tr><td>The sofa is behind the table.</td><td>The table is in front of the sofa.</td><td>behind ↔ in front of</td></tr>
<tr><td>The bookshelf is in front of the wardrobe.</td><td>The wardrobe is behind the bookshelf.</td><td>in front of ↔ behind</td></tr>
<tr><td>The post office is on the left of my house and the hospital is on the right.</td><td>My house is between the post office and the hospital.</td><td>một vật nằm giữa hai vật: between ... and ...</td></tr>
<tr><td>The table is above the ball.</td><td>The ball is under the table.</td><td>above ↔ under</td></tr>
</table></div>
<div class="tip"><b>Mẹo:</b> dùng <b>on</b> khi vật chạm vào mặt phẳng (on the floor, on the wall, on the sofa), dùng <b>above</b> khi ở cao hơn nhưng không chạm.</div>
`},
{id:'g-havehas',title:'There is/are → have/has',unit:'Unit 2',ex:'write',html:`
<p class="lead">Hai câu có thể cùng nghĩa: <i>There are two bedrooms in my house</i> = <i>My house has two bedrooms</i>.</p>
<div class="rule"><b class="f">There is/are + vật + in + nơi chốn</b> &nbsp;→&nbsp; <b class="f">Nơi chốn + has/have + vật</b></div>
<h4>Làm theo 3 bước</h4>
<ol class="exs">
<li>Lấy <b>nơi chốn</b> (sau "in") làm chủ ngữ mới: <i>my house</i>.</li>
<li>Chọn <b>has</b> nếu nơi chốn là số ít (my house, our school, my bedroom, the living room), chọn <b>have</b> nếu là số nhiều (the rooms).</li>
<li>Viết phần "vật" ở sau, giữ nguyên số lượng và mạo từ.</li>
</ol>
<div class="tbl"><table>
<tr><th>There is/are</th><th>have/has</th></tr>
<tr><td>There are two bedrooms in my house.</td><td>My house <b>has</b> two bedrooms.</td></tr>
<tr><td>There is a swimming pool in our school.</td><td>Our school <b>has</b> a swimming pool.</td></tr>
<tr><td>There is a big wardrobe in my bedroom.</td><td>My bedroom <b>has</b> a big wardrobe.</td></tr>
<tr><td>There is a sofa and a TV in the living room.</td><td>The living room <b>has</b> a sofa and a TV.</td></tr>
</table></div>
<div class="warn"><b>Lỗi hay gặp:</b> chủ ngữ là một nơi chốn số ít thì dùng <b>has</b> chứ không phải have.<br><span class="no">✗ My house have two bedrooms.</span> &nbsp; <span class="ok">✓ My house has two bedrooms.</span></div>
`},
{id:'g-continuous',title:'Hiện tại tiếp diễn',unit:'Unit 3',ex:'verb',html:`
<p class="lead">Dùng cho việc <mark>đang xảy ra ngay lúc nói</mark>. Dấu hiệu: <b>now, right now, at the moment, Look!, Listen!</b></p>
<div class="tbl"><table>
<tr><th>Loại câu</th><th>Công thức</th><th>Ví dụ</th></tr>
<tr><td>Khẳng định</td><td>S + am/is/are + V-ing</td><td>My mother <b>is cooking</b> in the kitchen now.</td></tr>
<tr><td>Phủ định</td><td>S + am/is/are + <b>not</b> + V-ing</td><td>Quang and Nam <b>aren't playing</b> football.</td></tr>
<tr><td>Nghi vấn</td><td>Am/Is/Are + S + V-ing?</td><td><b>Is</b> Mr Hung <b>interviewing</b> a student?</td></tr>
<tr><td>Trả lời</td><td>Yes, S + am/is/are. / No, S + am/is/are + not.</td><td>Yes, he <b>is</b>. / No, he <b>isn't</b>.</td></tr>
</table></div>
<h4>Cách thêm -ing</h4>
<div class="tbl"><table>
<tr><th>Quy tắc</th><th>Ví dụ</th></tr>
<tr><td>Thường: thêm <b>-ing</b></td><td>play → playing, cook → cooking, study → studying</td></tr>
<tr><td>Tận cùng <b>e</b> (không đọc): bỏ e rồi thêm -ing</td><td>make → making, write → writing, have → having</td></tr>
<tr><td>1 nguyên âm + 1 phụ âm: gấp đôi phụ âm</td><td>sit → <b>sitting</b>, skip → <b>skipping</b>, run → running, swim → swimming, put → putting</td></tr>
<tr><td>Tận cùng <b>ie</b>: đổi thành <b>ying</b></td><td>lie → lying</td></tr>
</table></div>
<h4>Hiện tại đơn hay hiện tại tiếp diễn?</h4>
<div class="tbl"><table>
<tr><th></th><th>Hiện tại đơn</th><th>Hiện tại tiếp diễn</th></tr>
<tr><td>Nghĩa</td><td>thói quen, sự thật</td><td>đang diễn ra lúc này</td></tr>
<tr><td>Dấu hiệu</td><td>every day, usually, on weekdays</td><td>now, at the moment, Look!</td></tr>
<tr><td>Ví dụ</td><td>The cat <b>sits</b> on the sofa every day.</td><td>The cat <b>is sitting</b> on the sofa right now.</td></tr>
</table></div>
<div class="warn"><b>Lỗi hay gặp:</b> quên <b>am/is/are</b>: <span class="no">✗ Mary skipping.</span> → <span class="ok">✓ Mary is skipping.</span></div>
`},
{id:'g-wordform',title:'Từ loại (Word form)',unit:'Unit 1–3',ex:'word',html:`
<p class="lead">Để điền đúng dạng từ, hãy tự hỏi: <mark>chỗ trống cần danh từ hay tính từ?</mark></p>
<div class="rule">
<b class="f">Cần DANH TỪ</b> khi đứng sau a / an / the, my / her / his, many / some, hoặc sau tính từ (strong, modern).<br>
<b class="f">Cần TÍNH TỪ</b> khi đứng sau to be, very, hoặc đứng trước danh từ.
</div>
<div class="tbl"><table>
<tr><th>Từ gốc</th><th>Đáp án trong đề</th><th>Loại từ</th><th>Gợi ý nhận biết</th></tr>
<tr><td>PERSON</td><td><b>personality</b></td><td>danh từ</td><td>a strong ___ (sau a + tính từ)</td></tr>
<tr><td>CARE</td><td><b>careful</b></td><td>tính từ</td><td>Be ___ (sau be)</td></tr>
<tr><td>NATION</td><td><b>international</b></td><td>tính từ</td><td>an ___ school (trước danh từ)</td></tr>
<tr><td>ACT</td><td><b>activities</b></td><td>danh từ số nhiều</td><td>many ___ (sau many)</td></tr>
<tr><td>EXCITE</td><td><b>excited</b></td><td>tính từ</td><td>very ___ about (sau very)</td></tr>
<tr><td>APPEAR</td><td><b>appearance</b></td><td>danh từ</td><td>their ___ (sau their)</td></tr>
<tr><td>CREATE</td><td><b>creativity</b></td><td>danh từ</td><td>her ___ (sau her)</td></tr>
<tr><td>FRIEND</td><td><b>friendly</b></td><td>tính từ</td><td>funny and ___ (song song với tính từ funny)</td></tr>
<tr><td>EQUIP</td><td><b>equipment</b></td><td>danh từ</td><td>modern ___ (sau tính từ)</td></tr>
<tr><td>SPORT</td><td><b>sporty</b></td><td>tính từ</td><td>Susan is ___ (sau be)</td></tr>
</table></div>
<h4>Đuôi từ thường gặp</h4>
<ul class="exs">
<li>Đuôi danh từ: <b>-ity</b> (personality, creativity), <b>-ment</b> (equipment), <b>-ance</b> (appearance), <b>-ity/-ies</b> (activity → activities).</li>
<li>Đuôi tính từ: <b>-ful</b> (careful), <b>-al</b> (international), <b>-ed</b> (excited), <b>-y</b> (sporty), <b>-ly</b> (friendly).</li>
</ul>
<div class="tip"><b>Chú ý:</b> <i>friendly</i> tận cùng bằng -ly nhưng vẫn là <b>tính từ</b> (danh từ: friend + ly). Còn <i>excited</i> (cảm thấy háo hức) khác <i>exciting</i> (gây hào hứng).</div>
`},
{id:'g-sound',title:'Phát âm /ɑː/ và /ʌ/',unit:'Unit 1–3',ex:'mcq',html:`
<p class="lead">Hai âm này hay xuất hiện ở phần <b>Choose the word whose underlined part is pronounced differently</b>. Bấm vào từ để nghe.</p>
<div class="tbl"><table>
<tr><th>Âm</th><th>Cách đọc</th><th>Từ trong đề cương</th></tr>
<tr><td><b>/ɑː/</b></td><td>mở miệng rộng, đọc <b>dài</b> như "aaa"</td><td>${SP('art','/ɑːt/')}${SP('car','/kɑː/')}${SP('far','/fɑː/')}${SP('star','/stɑː/')}${SP('smart','/smɑːt/')}${SP('sharpener','/ˈʃɑːpnə/')}${SP('father','/ˈfɑːðə/')}${SP('fast','/fɑːst/')}</td></tr>
<tr><td><b>/ʌ/</b></td><td>miệng mở nhẹ, đọc <b>ngắn</b> và dứt khoát như "ơ"</td><td>${SP('study','/ˈstʌdi/')}${SP('lunch','/lʌntʃ/')}${SP('subject','/ˈsʌbdʒɪkt/')}${SP('mum','/mʌm/')}${SP('cup','/kʌp/')}${SP('brother','/ˈbrʌðə/')}${SP('Monday','/ˈmʌndeɪ/')}${SP('rubber','/ˈrʌbə/')}</td></tr>
</table></div>
<h4>Mẹo đoán âm</h4>
<ul class="exs">
<li>Chữ <b>ar</b> thường đọc /ɑː/: art, car, far, star, smart, sharpener.</li>
<li>Chữ <b>u</b> thường đọc /ʌ/: study, lunch, subject, mum, cup, rubber.</li>
<li>Chữ <b>o</b> trong brother, Monday, mother, son, love cũng đọc /ʌ/.</li>
<li>Chữ <b>a</b> trong father, fast, class, path đọc /ɑː/ (giọng Anh).</li>
</ul>
<div class="tip"><b>Cách làm bài:</b> đọc nhẩm từng từ, xếp vào nhóm /ɑː/ hay /ʌ/. Từ nào lạc nhóm thì chọn từ đó. Ví dụ: <i>art</i> /ɑː/ khác <i>study, lunch, subject</i> đều /ʌ/.</div>
`},
{id:'g-comm',title:'Giao tiếp',unit:'Unit 1–3',ex:'mcq',html:`
<p class="lead">Câu giao tiếp thường là cặp <mark>hỏi – đáp</mark>. Hãy đọc kỹ câu đã cho để biết câu còn lại cần nói gì.</p>
<div class="tbl"><table>
<tr><th>Tình huống</th><th>Câu nói</th><th>Đáp lại</th></tr>
<tr><td>Giới thiệu người</td><td>This is my cousin, Peter.</td><td>Nice to meet you.</td></tr>
<tr><td>Hỏi thăm</td><td>How are you today?</td><td>I'm fine, thank you. And you?</td></tr>
<tr><td>Rủ rê, gợi ý</td><td>How about having lunch at a restaurant this weekend?</td><td>That's a great idea. / Sorry, I can't.</td></tr>
<tr><td>Hẹn gặp</td><td>Let's meet after school.</td><td>OK. See you later.</td></tr>
</table></div>
<h4>Ba câu hỏi dễ nhầm</h4>
<div class="tbl"><table>
<tr><th>Câu hỏi</th><th>Hỏi về</th><th>Trả lời</th></tr>
<tr><td><b>What is</b> your best friend <b>like</b>?</td><td>tính cách</td><td>She is kind and funny.</td></tr>
<tr><td>What does your best friend <b>look like</b>?</td><td>ngoại hình</td><td>She has curly brown hair.</td></tr>
<tr><td>What does your best friend <b>like</b>?</td><td>sở thích</td><td>She likes reading books.</td></tr>
</table></div>
<div class="tip"><b>Mẹo:</b> nhìn câu trả lời trước. "She has curly brown hair" tả ngoại hình nên chọn <b>look like</b>.</div>
`},
{id:'g-skills',title:'Mẹo làm bài Reading và Writing',unit:'Reading',ex:'read',html:`
<h4>1. Điền từ vào đoạn văn (Cloze test)</h4>
<ul class="exs">
<li>Đọc cả đoạn một lần trước để hiểu ý chính.</li>
<li>Xem chỗ trống cần danh từ hay tính từ (sau <i>a</i>, <i>the</i> → danh từ; sau <i>very</i>, <i>is</i> → tính từ).</li>
<li>Điền những chỗ chắc chắn trước, gạch từ đã dùng, từ còn lại sẽ rõ dần.</li>
</ul>
<h4>2. Đúng / Sai (True / False)</h4>
<ul class="exs">
<li>Tìm câu trong bài có <b>từ khóa</b> của câu hỏi.</li>
<li>Câu sai thường chỉ <b>đổi một chi tiết</b>: boarding → international, football → basketball, Sunday → Monday.</li>
<li>Chú ý <b>every week</b> (thói quen) và <b>now</b> (đang làm).</li>
</ul>
<h4>3. Trả lời câu hỏi</h4>
<div class="tbl"><table>
<tr><th>Từ để hỏi</th><th>Hỏi về</th><th>Ví dụ trả lời</th></tr>
<tr><td>Where</td><td>nơi chốn</td><td>He studies at a boarding school in Da Lat.</td></tr>
<tr><td>What</td><td>sự vật, việc làm</td><td>He usually plays football.</td></tr>
<tr><td>Who</td><td>người</td><td>She is helping a new student.</td></tr>
<tr><td>How many</td><td>số lượng</td><td>It has two bedrooms.</td></tr>
</table></div>
<ul class="exs">
<li>Viết <b>câu đầy đủ</b>, đổi tên riêng thành he / she / they, giữ nguyên thì của câu hỏi.</li>
<li>Câu hỏi <b>Yes/No</b>: dùng chính trợ động từ trong câu hỏi để trả lời. <i>Does Nam go home?</i> → Yes, he <b>does</b>. &nbsp; <i>Is Nam at school?</i> → No, he <b>isn't</b>. &nbsp; <i>Is there a garden?</i> → Yes, there <b>is</b>.</li>
</ul>
<h4>4. Hoàn thành câu từ từ gợi ý</h4>
<ol class="exs">
<li>Tìm chủ ngữ, động từ, tân ngữ. Có <i>Look!</i> hoặc <i>now</i> → hiện tại tiếp diễn. Có <i>every day</i> → hiện tại đơn.</li>
<li>Chia động từ, thêm mạo từ (a, the) và giới từ (by, in, on) còn thiếu.</li>
<li>Viết hoa chữ đầu câu, thêm dấu chấm hoặc dấu hỏi cuối câu.</li>
</ol>
<h4>5. Trả lời về bản thân (Answer about yourself)</h4>
<p>Dùng mẫu: <i>I usually ...</i>, <i>There is / There are ... in my ...</i>, <i>My bed is next to ...</i>, <i>She is kind and funny. She has long black hair.</i></p>
`}
];

  M('36d','Choose the word whose underlined part is pronounced differently from the others.',['sm<u>ar</u>t','sh<u>ar</u>pener','r<u>u</u>bber','st<u>ar</u>'],2,'<b>rubber</b> đọc /ʌ/. Smart, sharpener, star đều đọc /ɑː/.','g-sound')
 ]},
 {h:'Câu 37–39 · Giao tiếp',items:[
  M(37,'Army: "________________" - Jack: "Nice to meet you."',['See you later, Peter.','This is my cousin, Peter.','How are you today, Peter?',"Let's meet after school, Peter."],1,'"Nice to meet you" là lời đáp khi được <b>giới thiệu</b> với ai đó → "This is my cousin, Peter."','g-comm'),
  M(38,'Ashley: "How about having lunch at a restaurant this weekend?" - Ben: "______________"',["That's a great idea.","Yes, I'll have some.",'Not at all.',"I'm doing that soon."],0,'"How about ...?" là lời <b>gợi ý</b>. Đồng ý thì nói "That\'s a great idea."','g-comm'),
  M(39,'Arthur: "__________________________" - Sam: "She has curly brown hair."',['What is your best friend like?','What does your best friend like?','What does your best friend look like?','What is your best friend liking?'],2,'"She has curly brown hair" tả <b>ngoại hình</b> → câu hỏi là <b>What does ... look like?</b>','g-comm')
 ]}
 ]},

{id:'word',name:'II. Word form',short:'Dạng từ',tag:'Language Focus',
 intro:'Viết dạng đúng của từ trong ngoặc (PERSON, CARE, ...). Nhớ: sau a/the/her/many cần danh từ, sau be/very cần tính từ.',
 groups:[{h:'Give the correct form of the words in brackets.',items:[
  X('1. My best friend has a strong ____________ . (PERSON)',['personality'],'Sau "a strong" cần <b>danh từ</b>: personality (tính cách).','g-wordform'),
  X('2. Be ____________ when you use the compass. It is sharp. (CARE)',['careful'],'Sau "Be" cần <b>tính từ</b>: careful (cẩn thận).','g-wordform'),
  X('3. Her daughter studies at an ____________ school in town. (NATION)',['international'],'Trước danh từ "school" cần <b>tính từ</b>: international (quốc tế).','g-wordform'),
  X('4. We do many ____________ at break time. (ACT)',['activities'],'Sau "many" cần danh từ <b>số nhiều</b>: activity → activities.','g-wordform'),
  X('5. The students are very ____________ about the first day of school. (EXCITE)',['excited'],'Sau "are very" cần tính từ: <b>excited</b> (háo hức), vì học sinh là người cảm thấy.','g-wordform'),
  X('6. You shouldn\'t judge people by their ____________ . (APPEAR)',['appearance'],'Sau "their" cần danh từ: <b>appearance</b> (ngoại hình).','g-wordform'),
  X('7. She is famous for her ____________ : she writes poetry and paints. (CREATE)',['creativity'],'Sau "her" cần danh từ: <b>creativity</b> (sự sáng tạo).','g-wordform'),
  X('8. Most students in my school are funny and ____________ . (FRIEND)',['friendly'],'"funny and ..." cần tính từ cùng loại: <b>friendly</b> (thân thiện).','g-wordform'),
  X('9. My new school has large classrooms and modern ____________ . (EQUIP)',['equipment'],'Sau tính từ "modern" cần danh từ: <b>equipment</b> (thiết bị).','g-wordform'),
  X('10. Susan is ____________ and plays tennis very skillfully. (SPORT)',['sporty'],'Sau "is" cần tính từ: <b>sporty</b> (giỏi thể thao).','g-wordform')
 ]}]},

{id:'verb',name:'III. Verb tense',short:'Chia động từ',tag:'Language Focus',
 intro:'Chia động từ trong ngoặc ở hiện tại đơn hoặc hiện tại tiếp diễn. Tìm dấu hiệu: every day, usually, on weekdays (đơn) hoặc Look!, now, at the moment (tiếp diễn).',
 groups:[{h:'Put the verbs in brackets in the correct tense.',items:[
  X('1. Look! Mary (skip) ____________ with her classmates in the schoolyard.',['is skipping',"'s skipping"],'Có <b>Look!</b> → hiện tại tiếp diễn. Skip gấp đôi p: <b>is skipping</b>.','g-continuous'),
  X('2. Linh (study) ____________ English and Maths every day.',['studies'],'<b>every day</b> → hiện tại đơn. Chủ ngữ Linh (số ít), study → <b>studies</b>.','g-present-simple'),
  X('3. They usually (do) ____________ judo in the gym after school.',['do'],'<b>usually</b> → hiện tại đơn. They → động từ giữ nguyên: <b>do</b>.','g-present-simple'),
  X('4. My mother (cook) ____________ in the kitchen now.',['is cooking',"'s cooking"],'<b>now</b> → hiện tại tiếp diễn: <b>is cooking</b>.','g-continuous'),
  X('5. Nam (not have) ____________ breakfast at home on weekdays.',["doesn't have",'does not have'],'<b>on weekdays</b> → hiện tại đơn, phủ định, chủ ngữ Nam: <b>doesn\'t have</b>.','g-present-simple'),
  X('6. Quang and Nam (not play) ____________ football at the moment.',["aren't playing",'are not playing'],'<b>at the moment</b> → hiện tại tiếp diễn, phủ định, chủ ngữ số nhiều: <b>aren\'t playing</b>.','g-continuous'),
  X('7. My grandparents (live) ____________ in a stilt house.',['live'],'Nói về sự thật, chỗ ở → hiện tại đơn. My grandparents (số nhiều) → <b>live</b>.','g-present-simple'),
  X('8. The cat (sit) ____________ on the sofa right now.',['is sitting',"'s sitting"],'<b>right now</b> → hiện tại tiếp diễn. Sit gấp đôi t: <b>is sitting</b>.','g-continuous'),
  X('9. (your school / have) ____________ a swimming pool?',['does your school have'],'Hỏi về sự thật → hiện tại đơn. Chủ ngữ your school (số ít): <b>Does your school have</b> ...?','g-present-simple'),
  X('10. Mr Hung (interview) ____________ a student at the moment.',['is interviewing',"'s interviewing"],'<b>at the moment</b> → hiện tại tiếp diễn: <b>is interviewing</b>.','g-continuous')
 ]}]},

{id:'gap',name:'IV. Reading · Task 1',short:'Điền từ vào đoạn văn',tag:'Reading',
 intro:'Chọn từ trong khung để điền vào mỗi chỗ trống. Mỗi từ chỉ dùng một lần.',
 groups:[
  {h:'Passage 1 (Unit 1): Lan\'s new school',box:['judo','uniform','classmates','equipment'],
   passage:'Lan is a new student at an international school. Every day, she wears a blue [[1]] and goes to school by bike. Her school has large classrooms and modern [[2]]. She has many [[3]] in her class and they are very friendly. After school, she usually does [[4]] in the gym. She is very excited about her new school.',
   items:[GAP('uniform','Wears a blue ... → <b>uniform</b> (đồng phục).'),GAP('equipment','Modern ... → <b>equipment</b> (thiết bị hiện đại).'),GAP('classmates','many ... in her class → <b>classmates</b> (bạn cùng lớp).'),GAP('judo','does ... in the gym → <b>judo</b> (do judo).')]},
  {h:'Passage 2 (Unit 2): Tom\'s apartment',box:['wardrobe','kitchen','next to','sofa'],
   passage:'Tom lives in a small apartment in Ha Noi. There are two bedrooms, a bathroom, a [[1]] and a living room. There is a big [[2]] in the living room, and Tom often watches TV there. His bedroom is [[3]] the bathroom. In his bedroom, there is a [[4]] for his clothes.',
   items:[GAP('kitchen','Các phòng: bedrooms, bathroom, ..., living room → <b>kitchen</b>.'),GAP('sofa','Big ... in the living room, xem TV ở đó → <b>sofa</b>.'),GAP('next to','His bedroom is ... the bathroom → <b>next to</b> (cạnh).'),GAP('wardrobe','A ... for his clothes → <b>wardrobe</b> (tủ quần áo).')]},
  {h:'Passage 3 (Unit 3): My best friend',box:['patient','shy','funny','confident'],
   passage:'My friend Nga is a [[1]] girl. She often tells jokes and everybody laughs. She is also very [[2]] because she isn\'t afraid of speaking in front of the class. Nga is very [[3]] with her younger brother. She never shouts at him. But I am different. I am [[4]] with strangers and I don\'t talk much.',
   items:[GAP('funny','Hay kể chuyện cười, mọi người cười → <b>funny</b>.'),GAP('confident','Không sợ nói trước lớp → <b>confident</b>.'),GAP('patient','Không quát em trai → <b>patient</b> (kiên nhẫn).'),GAP('shy','Khác Nga: ít nói với người lạ → <b>shy</b>.')]}
 ]},

{id:'read',name:'IV. Reading · Task 2',short:'Đọc hiểu, Đúng/Sai',tag:'Reading',
 intro:'Đọc đoạn văn, quyết định câu Đúng (T) hay Sai (F), rồi trả lời câu hỏi bằng câu đầy đủ.',
 groups:[
  {h:'Passage 1 (Unit 1): Nam\'s school life',
   passage:'Nam studies at a boarding school in Da Lat. He lives and studies there from Monday to Friday. His favourite subjects are Maths and Art. At break time, he usually plays football with his classmates in the schoolyard. Sometimes he goes to the school greenhouse and looks after the plants. At weekends, Nam goes home. Now it is Sunday evening. Nam is at home and he is packing his school bag. He is putting his compass, calculator and pencil case into it.',
   sub:[
   {h:'Decide whether the statements are True (T) or False (F).',items:[
    TF('1. Nam studies at an international school.',false,'Bài viết: "a <b>boarding</b> school in Da Lat", không phải international school → <b>F</b>.'),
    TF('2. Nam lives at school from Monday to Friday.',true,'"He lives and studies there from Monday to Friday" → <b>T</b>.'),
    TF("3. Art is one of Nam's favourite subjects.",true,'"His favourite subjects are Maths and Art" → <b>T</b>.'),
    TF('4. Nam usually plays basketball at break time.',false,'Bài viết: "usually plays <b>football</b>", không phải basketball → <b>F</b>.'),
    TF('5. Nam is packing his school bag at home now.',true,'"Nam is at home and he is packing his school bag" → <b>T</b>.')]},
   {h:'Answer the questions.',items:[
    X('1. Where does Nam study?',['He studies at a boarding school in Da Lat.','At a boarding school in Da Lat.','A boarding school in Da Lat.','He studies at a boarding school.'],'Where hỏi nơi chốn. Đáp án: <b>He studies at a boarding school in Da Lat.</b>','g-skills',[['boarding school']]),
    X('2. What does Nam usually do at break time?',['He usually plays football with his classmates in the schoolyard.','He usually plays football with his classmates.','He usually plays football.','He plays football with his classmates.'],'Đáp án: <b>He usually plays football with his classmates in the schoolyard.</b>','g-skills',[['football']]),
    X('3. What is Nam putting into his school bag?',['He is putting his compass, calculator and pencil case into it.','He is putting his compass, calculator and pencil case into his school bag.','His compass, calculator and pencil case.'],'Đáp án: <b>He is putting his compass, calculator and pencil case into it.</b> (giữ hiện tại tiếp diễn)','g-skills',[['compass'],['calculator'],['pencil case']]),
    X('4. Does Nam go home at weekends?',["Yes, he does."],'Câu hỏi bắt đầu bằng Does → trả lời <b>Yes, he does.</b> ("At weekends, Nam goes home.")','g-skills',[['yes']]),
    X('5. Is Nam at school now?',["No, he isn't.",'No, he is not.'],'Câu hỏi bắt đầu bằng Is → trả lời <b>No, he isn\'t.</b> (Nam đang ở nhà.)','g-skills',[['no']])]}
   ]},
  {h:'Passage 2 (Unit 2): Hoa\'s grandparents\' house',
   passage:'Hoa\'s grandparents live in a stilt house in a village in Sa Pa. The house has a living room, two bedrooms and a small kitchen. In front of the house, there is a small garden. There isn\'t a dishwasher in the kitchen, but there is a big cupboard next to the window. In the living room, there is an old sofa in front of the TV. A chest of drawers is behind the sofa.',
   sub:[
   {h:'Decide whether the statements are True (T) or False (F).',items:[
    TF("1. Hoa's grandparents live in an apartment in Sa Pa.",false,'Bài viết: "live in a <b>stilt house</b>", không phải apartment → <b>F</b>.'),
    TF('2. The house has two bedrooms.',true,'"The house has a living room, <b>two bedrooms</b> and a small kitchen" → <b>T</b>.'),
    TF('3. There is a dishwasher in the kitchen.',false,'"There <b>isn\'t</b> a dishwasher in the kitchen" → <b>F</b>.'),
    TF('4. The cupboard is next to the window.',true,'"a big cupboard next to the window" → <b>T</b>.'),
    TF('5. The chest of drawers is behind the sofa.',true,'"A chest of drawers is behind the sofa" → <b>T</b>.')]},
   {h:'Answer the questions.',items:[
    X("1. Where do Hoa's grandparents live?",['They live in a stilt house in a village in Sa Pa.','In a stilt house in a village in Sa Pa.','They live in a stilt house.','A stilt house in a village in Sa Pa.'],'Where hỏi nơi chốn. Đáp án: <b>They live in a stilt house in a village in Sa Pa.</b>','g-skills',[['stilt house']]),
    X('2. How many bedrooms does the house have?',['It has two bedrooms.','The house has two bedrooms.','Two bedrooms.','Two.','It has 2 bedrooms.'],'How many hỏi số lượng. Đáp án: <b>It has two bedrooms.</b>','g-skills',[['two','2']]),
    X('3. What is behind the sofa?',['A chest of drawers is behind the sofa.','A chest of drawers.','The chest of drawers is behind the sofa.'],'Đáp án: <b>A chest of drawers is behind the sofa.</b>','g-skills',[['chest of drawers']]),
    X('4. Is there a garden in front of the house?',['Yes, there is.'],'Câu hỏi Is there ... → trả lời <b>Yes, there is.</b> ("In front of the house, there is a small garden.")','g-skills',[['yes']]),
    X('5. Is there a dishwasher in the kitchen?',["No, there isn't.",'No, there is not.'],'Bài viết: "There isn\'t a dishwasher" → trả lời <b>No, there isn\'t.</b>','g-skills',[['no']])]}
   ]},
  {h:'Passage 3 (Unit 3): My classmate Linh',
   passage:'Linh is my classmate. She is a sporty and active girl. She plays badminton and volleyball every week. Linh is also kind and caring. She often helps her classmates with their homework. She is hard-working, too. Look! Linh is helping a new student with her Maths homework.',
   sub:[
   {h:'Decide whether the statements are True (T) or False (F).',items:[
    TF('1. Linh is a boring girl.',false,'Bài viết: "a <b>sporty and active</b> girl" → <b>F</b>.'),
    TF('2. She plays badminton and volleyball every week.',true,'"She plays badminton and volleyball every week" → <b>T</b>.'),
    TF('3. Linh often helps her classmates with their homework.',true,'"She often helps her classmates with their homework" → <b>T</b>.'),
    TF('4. Linh is hard-working.',true,'"She is hard-working, too" → <b>T</b>.'),
    TF('5. Linh is talking to her teacher now.',false,'"Look! Linh is helping <b>a new student</b>", không phải nói chuyện với giáo viên → <b>F</b>.')]},
   {h:'Answer the questions.',items:[
    X('1. What does Linh play every week?',['She plays badminton and volleyball every week.','She plays badminton and volleyball.','Badminton and volleyball.'],'Đáp án: <b>She plays badminton and volleyball every week.</b>','g-skills',[['badminton'],['volleyball']]),
    X('2. What does Linh often do for her classmates?',['She often helps her classmates with their homework.','She often helps them with their homework.','She helps her classmates with their homework.'],'Đáp án: <b>She often helps her classmates with their homework.</b>','g-skills',[['help'],['homework']]),
    X('3. Who is Linh helping now?',['She is helping a new student.','She is helping a new student with her Maths homework.','A new student.'],'Who hỏi người. Đáp án: <b>She is helping a new student.</b> (hiện tại tiếp diễn vì có now)','g-skills',[['new student']]),
    X('4. Is Linh sporty?',["Yes, she is."],'Bài viết: "a sporty and active girl" → trả lời <b>Yes, she is.</b>','g-skills',[['yes']]),
    X('5. Does Linh play tennis?',["No, she doesn't.",'No, she does not.'],'Linh chơi badminton và volleyball, không nhắc đến tennis → <b>No, she doesn\'t.</b>','g-skills',[['no']])]}
   ]}
 ]},

{id:'write',name:'V. Writing',short:'Viết lại câu',tag:'Writing',
 intro:'Viết lại câu theo yêu cầu. Máy chấm không phân biệt chữ hoa, chữ thường và dấu chấm, nhưng dấu nháy (\') và từ vẫn phải đúng.',
 groups:[
  {h:'Task 1. Rewrite the sentences using the possessive case.',items:[
   X("1. This is the bag of my brother.  →  This ______________________",["this is my brother's bag"],"Chủ sở hữu: my brother (số ít) → <b>my brother's bag</b>.",'g-possessive'),
   X("2. The room of Lan is on the second floor.  →  The ______________________",["lan's room is on the second floor"],"Lan (số ít) → <b>Lan's room</b> is on the second floor.",'g-possessive'),
   X("3. These are the books of the students.  →  These ______________________",["these are the students' books"],"students là số nhiều có -s → chỉ thêm ': <b>the students' books</b>.",'g-possessive'),
   X("4. The toys of the children are on the sofa.  →  The ______________________",["the children's toys are on the sofa"],"children là số nhiều bất quy tắc → <b>the children's toys</b>.",'g-possessive'),
   X("5. The house of my grandparents is a stilt house.  →  The ______________________",["my grandparents' house is a stilt house","the my grandparents' house is a stilt house"],"grandparents là số nhiều có -s → <b>My grandparents' house</b> is a stilt house.",'g-possessive')
  ]},
  {h:'Task 2. Rewrite the sentences using have/has.',items:[
   X('1. There are two bedrooms in my house.  →  My ______________________',['my house has two bedrooms'],'Nơi chốn (my house) làm chủ ngữ, số ít → <b>has</b>: My house has two bedrooms.','g-havehas'),
   X('2. There is a swimming pool in our school.  →  Our ______________________',['our school has a swimming pool'],'Our school (số ít) → <b>has</b>: Our school has a swimming pool.','g-havehas'),
   X('3. There is a big wardrobe in my bedroom.  →  My ______________________',['my bedroom has a big wardrobe'],'My bedroom (số ít) → <b>has</b>: My bedroom has a big wardrobe.','g-havehas'),
   X('4. There is a sofa and a TV in the living room.  →  The ______________________',['the living room has a sofa and a tv'],'The living room (số ít) → <b>has</b>: The living room has a sofa and a TV.','g-havehas')
  ]},
  {h:'Task 3. Put the adverbs of frequency in the correct position.',items:[
   X('1. Nam does judo in the gym after school. (usually)  →  Nam ______________________',['nam usually does judo in the gym after school'],'Trạng từ đứng <b>trước động từ thường</b> (does): Nam usually does judo ...','g-adv'),
   X('2. My brother is late for school. (never)  →  My ______________________',['my brother is never late for school'],'Trạng từ đứng <b>sau to be</b> (is): My brother is never late ...','g-adv'),
   X('3. We play games in the schoolyard at break time. (often)  →  We ______________________',['we often play games in the schoolyard at break time','often we play games in the schoolyard at break time'],'Often đứng trước động từ thường (play): We often play games ... (đứng đầu câu cũng được).','g-adv'),
   X('4. Mai helps her classmates with their homework. (always)  →  Mai ______________________',['mai always helps her classmates with their homework'],'Always đứng trước động từ thường (helps): Mai always helps ...','g-adv'),
   X('5. Linh is shy with strangers. (sometimes)  →  Linh ______________________',['linh is sometimes shy with strangers','sometimes linh is shy with strangers'],'Sometimes đứng sau to be (is) hoặc đầu câu: Linh is sometimes shy ... / Sometimes Linh is shy ...','g-adv')
  ]},
  {h:'Task 4. Rewrite the sentences using prepositions of place.',items:[
   X('1. The hall is next to the living room.  →  The living room ______________________',['the living room is next to the hall'],'Next to: đổi chỗ hai vật → The living room is next to the hall.','g-prep'),
   X('2. The sofa is behind the table.  →  The table ______________________',['the table is in front of the sofa'],'Behind ↔ in front of → The table is <b>in front of</b> the sofa.','g-prep'),
   X('3. The bookshelf is in front of the wardrobe.  →  The wardrobe ______________________',['the wardrobe is behind the bookshelf'],'In front of ↔ behind → The wardrobe is <b>behind</b> the bookshelf.','g-prep'),
   X('4. The post office is on the left of my house and the hospital is on the right of my house.  →  My house ______________________',['my house is between the post office and the hospital','my house is between the hospital and the post office'],'Hai bên là hai nơi → My house is <b>between</b> the post office <b>and</b> the hospital.','g-prep'),
   X('5. The ball is on the floor. The table is above the ball.  →  The ball ______________________',['the ball is under the table'],'Above ↔ under → The ball is <b>under</b> the table.','g-prep')
  ]},
  {h:'Task 5. Use the cues to write complete sentences. Add words and change the verb forms where necessary.',items:[
   X('1. Look! / the boys / play / football / and / the girls / skip / in the schoolyard.',['look the boys are playing football and the girls are skipping in the schoolyard'],'<b>Look!</b> → hiện tại tiếp diễn: Look! The boys <b>are playing</b> football and the girls <b>are skipping</b> in the schoolyard.','g-continuous',[['are playing'],['are skipping']]),
   X('2. Nam / go / to / school / bicycle / every day.',['nam goes to school by bicycle every day','nam goes to school by bike every day'],'<b>every day</b> → hiện tại đơn, Nam số ít nên go → goes; thêm <b>by</b>: Nam goes to school by bicycle every day.','g-present-simple',[['goes'],['by']]),
   X('3. How many / pictures / there / wall?',['how many pictures are there on the wall'],'Hỏi số lượng danh từ số nhiều: How many pictures <b>are there on</b> the wall?','g-havehas',[['are there'],['on the wall']]),
   X('4. Our grandparents / watch / TV / in / living room / now.',['our grandparents are watching tv in the living room now','our grandparents are watching tv in the living room'],'<b>now</b> → hiện tại tiếp diễn: Our grandparents <b>are watching</b> TV in the living room now.','g-continuous',[['are watching']])
  ]}
 ]},

{id:'open',name:'V. Writing · Task 6',short:'Trả lời về bản thân',tag:'Writing',selfCheck:true,
 intro:'Phần này trả lời về chính em nên không có một đáp án duy nhất. Hãy viết câu đầy đủ, bấm "Kiểm tra" để máy soi các lỗi cơ bản và xem câu mẫu.',
 groups:[{h:'Task 6. Answer the questions about yourself.',items:[
  {t:'open',q:'1. What do you usually do at break time?',re:/\b(usually|often|always|sometimes)\b/i,reHint:'có trạng từ chỉ tần suất (usually, often...)',model:'I usually play games with my classmates in the schoolyard.'},

,"q":"___ school is very big and modern. (Mai)","a":[["Mai's"]]},{"t":"fill","n":2,"q":"Where is ___ new computer? (Minh)","a":[["Minh's"]]},{"t":"fill","n":3,"q":"My ___ car is red. (father)","a":[["father's"]]},{"t":"fill","n":4,"q":"___ book is on the desk. (Peter)","a":[["Peter's"]]},{"t":"fill","n":5,"q":"Is that ___ bicycle? (Huy)","a":[["Huy's"]]},{"t":"fill","n":6,"q":"Our ___ name is Mrs. Brown. (teacher)","a":[["teacher's"]]},{"t":"fill","n":7,"q":"___ room is clean and tidy. (Linh)","a":[["Linh's"]]},{"t":"fill","n":8,"q":"My ___ hobby is reading books. (sister)","a":[["sister's"]]},{"t":"fill","n":9,"q":"Listen! ___ voice sounds so sweet. (Mary)","a":[["Mary's"]]},{"t":"fill","n":10,"q":"Look at ___ dog! It is playing with a ball. (John)","a":[["John's"]]}]},{"h":"IV. Complete the sentences using the present simple.","items":[{"t":"fill","n":1,"q":"She always ___ (play) the piano in the evening.","a":[["plays"]]},{"t":"fill","n":2,"q":"___ (Mr. Brown, live) in this quiet neighborhood?","a":[["Does Mr. Brown live"]]},{"t":"fill","n":3,"q":"Tom ___ (not like) eating vegetables for dinner.","a":[["doesn't like"]]},{"t":"fill","n":4,"q":"Our school library ___ (open) at 7 a.m. every day.","a":[["opens"]]},{"t":"fill","n":5,"q":"The children ___ (play) football in the school yard on Fridays.","a":[["play"]]},{"t":"fill","n":6,"q":"On Mondays, Linh ___ (have) an English class.","a":[["has"]]},{"t":"fill","n":7,"q":"___ (you, wash) the dishes after dinner?","a":[["Do you wash"]]},{"t":"fill","n":8,"q":"My parents ___ (not watch) TV late at night.","a":[["don't watch"]]},{"t":"fill","n":9,"q":"Nam and Hoa ___ (not speak) French.","a":[["don't speak"]]},{"t":"fill","n":10,"q":"Water ___ (boil) at 100 degrees Celsius and ___ (freeze) at 0 degrees Celsius.","a":[["boils"],["freezes"]]}]},{"h":"V. Write the correct form of the verbs in brackets in the present continuous.","items":[{"t":"fill","n":1,"q":"Look! The little boy ___ (ride) his new bike in the yard.","a":[["is riding"]]},{"t":"fill","n":2,"q":"My friends and I ___ (organize) a party next weekend.","a":[["are organizing","are organising"]]},{"t":"fill","n":3,"q":"Listen! Someone ___ (knock) at the front door.","a":[["is knocking"]]},{"t":"fill","n":4,"q":"___ (your sister, practice) the guitar right now?","a":[["Is your sister practicing","Is your sister practising"]]},{"t":"fill","n":5,"q":"Mr. Pike ___ (not teach) us history this semester. He is on leave.","a":[["isn't teaching"]]},{"t":"fill","n":6,"q":"We ___ (prepare) for our English presentation at the moment.","a":[["are preparing"]]},{"t":"fill","n":7,"q":"___ (they, move) to a new apartment next month?","a":[["Are they moving"]]},{"t":"fill","n":8,"q":"The children ___ (sleep) upstairs, so please keep quiet.","a":[["are sleeping"]]},{"t":"fill","n":9,"q":"Anna ___ (not wear) a uniform today because it’s a holiday.","a":[["isn't wearing"]]},{"t":"fill","n":10,"q":"Look at the dark clouds! It ___ (rain) soon.","a":[["is raining","is going to rain"]]}]},{"h":"VI. Put the verbs in present simple or present continuous tense.","items":[{"t":"fill","n":1,"q":"Where (your father/ work) ___? – He (work) ___ in a hospital.","a":[["does your father work"],["works"]]},{"t":"fill","n":2,"q":"Listen! The birds (sing) ___ in the tall trees.","a":[["are singing"]]},{"t":"fill","n":3,"q":"My sister usually (cook) ___ dinner for the family.","a":[["cooks"]]},{"t":"fill","n":4,"q":"Look! The children (play) ___ football in the rain.","a":[["are playing"]]},{"t":"fill","n":5,"q":"We (not/ have) ___ English classes on Sundays.","a":[["don't have"]]},{"t":"fill","n":6,"q":"What (your mother/ do) ___ at the moment?","a":[["is your mother doing"]]},{"t":"fill","n":7,"q":"Water (boil) ___ at 100 degrees Celsius.","a":[["boils"]]},{"t":"fill","n":8,"q":"Be quiet! The baby (sleep) ___ in the bedroom.","a":[["is sleeping"]]},{"t":"fill","n":9,"q":"Tom (not/ read) ___ books right now.","a":[["isn't reading"]]},{"t":"fill","n":10,"q":"The train to Hanoi (leave) ___ at 8 a.m. every day.","a":[["leaves"]]}]},{"h":"VII. Supply the correct form of the words in brackets.","items":[{"t":"fill","n":1,"q":"Ella is very ___ and gets along well with everyone. (friend)","a":[["friendly"]]},{"t":"fill","n":2,"q":"Please be ___ with those vases. Don’t break them. (care)","a":[["careful"]]},{"t":"fill","n":3,"q":"My brother is very ___. He always has great ideas for our class projects. (create)","a":[["creative"]]},{"t":"fill","n":4,"q":"The classroom is very ___ because all the students are talking loudly. (noise)","a":[["noisy"]]},{"t":"fill","n":5,"q":"Playing sports every day helps children stay healthy and ___. (act)","a":[["active"]]}]}]},{"id":"d1_rewrite","name":"VIII. Complete the second sentence","short":"Viết lại câu","tag":"Đề cương 1","intro":"Đề giữ nguyên nội dung file đề cương. Em viết câu trả lời, bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Câu mẫu do máy soạn thêm (file gốc không có đáp án), một câu có thể có nhiều cách viết đúng.","groups":[{"h":"VIII. Complete the second sentence so that it means the same as the first.","items":[{"t":"self","n":1,"q":"Her eyes are brown and big.<br>⇒ She ___","model":"She has big brown eyes."},{"t":"self","n":2,"q":"My house has two living rooms, 2 kitchens and two bedrooms.<br>⇒ There ___","model":"There are two living rooms, two kitchens and two bedrooms in my house."},{"t":"self","n":3,"q":"Phong likes Maths most.<br>⇒ Phong’s ___","model":"Phong’s favourite subject is Maths."},{"t":"self","n":4,"q":"James is hard-working and smart.<br>⇒ James isn’t ___","model":"James isn’t lazy or stupid."},{"t":"self","n":5,"q":"What is your address?<br>⇒ Where ___","model":"Where do you live?"},{"t":"self","n":6,"q":"Do you want to go for a drink?<br>⇒ Would ___","model":"Would you like to go for a drink?"},{"t":"self","n":7,"q":"There aren’t any students in this room.<br>⇒ This room ___","model":"This room has no students."},{"t":"self","n":8,"q":"Does your brother go to school by bike?<br>⇒ Does your brother ___","model":"Does your brother ride a bike to school?"},{"t":"self","n":9,"q":"Her mother has short hair.<br>⇒ Her mother’s hair ___","model":"Her mother’s hair is short."},{"t":"self","n":10,"q":"Are there 20 rooms in your school?<br>⇒ Does ___","model":"Does your school have 20 rooms?"}]}],"selfCheck":true},{"id":"d1_read","name":"IX–X. Reading","short":"Đọc hiểu","tag":"Đề cương 1","intro":"Đề giữ nguyên nội dung file đề cương. Làm hết rồi bấm \"Nộp bài\" để máy chấm. File gốc không có đáp án nên đáp án do máy soạn thêm, nhờ cô đối chiếu lại.","groups":[{"h":"IX. Read then choose the best answer to complete the passage.","passage":"This is a small room. There is some (1) ______________ in the room. There is a bed on the right of the picture. It is a bed for one person. (2) ______________ the bed there are some pictures on the wall. Next to the door, on the left, there is a (3) ______________. There is another chair (4) ______________ the table and the bed. The table and chair are below the window. On the table (5) ______________ some objects – a jug, a glass and a bowl. Next to the door on the right there is a (6) ______________ on a peg. Behind the bed there are some more things on the wall but (7) ______________ aren’t easy to see. Of course, (8) ______________ any modern things in the room and it isn’t very comfortable.","sub":[{"h":"Câu 1–8","items":[{"t":"mcq","n":1,"q":"","o":["furniture","picture","people","tool"],"a":0},{"t":"mcq","n":2,"q":"","o":["On","Under","above","Behind"],"a":2},{"t":"mcq","n":3,"q":"","o":["bed","chair","window","table"],"a":1},{"t":"mcq","n":4,"q":"","o":["between","next to","beside","in front of"],"a":0},{"t":"mcq","n":5,"q":"","o":["there is","there isn’t","there aren’t","there are"],"a":3},{"t":"mcq","n":6,"q":"","o":["mirror","towel","chair","picture"],"a":1},{"t":"mcq","n":7,"q":"","o":["there","it","they","that"],"a":2},{"t":"mcq","n":8,"q":"","o":["there are","there aren’t","there is","there isn’t"],"a":1}]}]},{"h":"X. Read the passage. Circle the best answer A, B, C or D to each of the questions.","passage":"At Hill Bilingual School, students learn many subjects. For example, they learn Math in both Vietnamese and English, and they also study Science in English. Because of this, students spend their mornings and afternoons studying at school. Here, they only need to wear uniforms on Tuesdays and Thursdays. Besides studying, students also play sports and join many clubs. For sports, there are swimming, basketball, Frisbee, football, badminton to choose from. Once a week, students go to their favourite club to have some fun time.","sub":[{"h":"Câu 1–5","items":[{"t":"mcq","n":1,"q":"What is the passage about?","o":["Some sports at a school.","Some subjects at Hill school.","Student life at Hill school.","Some schools."],"a":2},{"t":"mcq","n":2,"q":"What does the word ‘they’ in line 2 mean?","o":["The subjects.","The students.","The sports.","The clubs"],"a":1},{"t":"mcq","n":3,"q":"What sports do students play at Hill school?","o":["Judo","Frisbee","Baseball","Volleyball"],"a":1},{"t":"mcq","n":4,"q":"Why do the students join the clubs?","o":["Because they want to have fun.","Because they don’t like studying other subjects.","Because they can play sports there.","Because they need to go there."],"a":0},{"t":"mcq","n":5,"q":"Why do students go to their favourite club?","o":["To have some fun","To have lunch","To have dinner","To enjoy food"],"a":0}]}]}]}];

 doesn’t like to meet new people.","o":["clever","careful","hard-working","shy"],"a":3},{"t":"mcq","n":5,"q":"John: ________? – Alex: He’s short and fat with spiky hair.","o":["Are you short and fat","What does he like","What does Bill look like","Do you like James"],"a":2},{"t":"mcq","n":6,"q":"A: What does your mom look like? B: She is very ________. She goes to the gym regularly.","o":["slim","thin","skinny","overweight"],"a":0},{"t":"mcq","n":7,"q":"Of course, I’m very ________! I got an A+ on all of my exams!","o":["funny","smart","kind","active"],"a":1},{"t":"mcq","n":8,"q":"My uncle loves to tell jokes to make us laugh. He’s ________.","o":["funny","smart","kind","active"],"a":0}]},{"h":"V. Prepositions","items":[{"t":"mcq","n":1,"q":"Peter is ________ his father and his mother.","o":["in front of","behind","opposite","between"],"a":3},{"t":"mcq","n":2,"q":"Don’t stand ________ the TV. I’m trying to watch this programme.","o":["behind","next to","under","in front of"],"a":3},{"t":"mcq","n":3,"q":"Her birthday is ________ Friday, September 20th.","o":["in","on","by","out"],"a":1},{"t":"mcq","n":4,"q":"On a bus, passengers sit ________ the driver.","o":["in front of","between","behind","down"],"a":2},{"t":"mcq","n":5,"q":"We usually talk with friends ________ break time.","o":["at","on","off","beside"],"a":0},{"t":"mcq","n":6,"q":"I sit ________ Sarah at school.","o":["on","next to","between","under"],"a":1},{"t":"mcq","n":7,"q":"There are four students at each table. My friend Justine sits ________ me.","o":["in front of","near to","opposite with","between"],"a":0},{"t":"mcq","n":8,"q":"The clock is ________ the teacher’s desk.","o":["in","above","next to","behind"],"a":1}]},{"h":"VI. Adverbs of frequency","items":[{"t":"mcq","n":1,"q":"Andrea lives next door, so we ________ see her.","o":["never","often","rarely","seldom"],"a":1},{"t":"mcq","n":2,"q":"I ________ do my homework after school. Every day!","o":["never","always","often","sometime"],"a":1},{"t":"mc Làm hết rồi bấm \"Nộp bài\" để máy chấm. File gốc không có đáp án nên đáp án do máy soạn thêm, nhờ cô đối chiếu lại.","groups":[{"h":"Part 1. Read the text carefully then choose the correct words.","passage":"My (1) ________ is Nguyen Trai Secondary school. It (2) ________ a new school. There are about one thousand five hundred students and more than forty teachers in my school. Our teachers (3) ________ very hard so that we can understand the lessons well. My school’s library is very big. You can read all kinds of (4) ________ there. We also have a very large and clean (5) ________. Students play all kinds of games during their break time. My school is not big, but I (6) ________ it very much.","sub":[{"h":"Câu 1–6","items":[{"t":"mcq","n":1,"q":"","o":["school’s name","school’ name","schools’ name","school name"],"a":0},{"t":"mcq","n":2,"q":"","o":["are","am","has","is"],"a":3},{"t":"mcq","n":3,"q":"","o":["do","work","play","have"],"a":1},{"t":"mcq","n":4,"q":"","o":["pencil sharpeners","school bags","books","pencil cases"],"a":2},{"t":"mcq","n":5,"q":"","o":["garden","library","classroom","schoolyard"],"a":3},{"t":"mcq","n":6,"q":"","o":["likes","loves","don’t love","love"],"a":1}]}]},{"h":"Part 2. Read the text carefully then choose the correct words.","passage":"<b>My dream house</b><br>My dream house is (1) ________ the countryside. It has lots of rooms and windows. There is a big (2) ________ in the living room. Everyone in my family can read their favourite (3) ________ in this room. There is a kitchen in my dream house. There my mum and I can (4) ________ together. There is a fridge and it has drinks and snacks. There (5) ________ extra bedrooms, so my friends can sleep over. My dream house also (6) ________ a big garden. I can plant flowers and vegetables there.","sub":[{"h":"Câu 1–6","items":[{"t":"mcq","n":1,"q":"","o":["on","in","at","for"],"a":1},{"t":"mcq","n":2,"q":"","o":["bookshelf","cupboard","sink","wardrobe"],"a":0},{"t":"mcq","n":3,"q":"","o": }

function gradeText(it,val){
  const v=norm(val);
  if(!v)return {s:0,blank:true};
  const acc=it.acc.map(norm);
  if(acc.indexOf(v)>=0)return {s:1};
  if(it.kw&&it.kw.every(g=>g.some(k=>v.indexOf(norm(k))>=0)))return {s:.5};
  return {s:0};
}
function feedback(box,res,it,ansText){
  const st=res.blank?['b','Chưa trả lời']:res.s===1?['g','Chính xác!']:res.s>0?['p','Gần đúng (được 0,5 điểm)']:['b','Chưa đúng'];
  let h=`<div class="st ${st[0]}">${res.s===1?'✓':res.s>0?'~':'✗'} ${st[1]}</div>`;
  if(res.s<1&&ansText)h+=`<div class="ans"><b>Đáp án:</b> ${ansText}</div>`;
  if(res.s>0&&res.s<1)h+=`<div class="ans">Đúng ý rồi, nhưng chưa đủ câu hoặc chưa đúng dạng đáp án mẫu.</div>`;
  if(it.e)h+=`<div class="why"><b>Giải thích:</b> ${it.e}</div>`;
  if(it.g&&res.s<1){const gg=GRAMMAR.find(x=>x.id===it.g);if(gg)h+=`<div><button type="button" class="lnk" data-act="gopick" data-id="${gg.id}">Xem lại bài: ${gg.title}</button></div>`}
  box.innerHTML=h;box.hidden=false;
}
function markQ(q,res){q.classList.remove('ok2','bad2','part2');q.classList.add(res.s===1?'ok2':res.s>0?'part2':'bad2')}
function lockPane(pane){$$('input,select,textarea',pane).forEach(x=>{x.disabled=true})}

function checkSec(id){
  const sec=SECBY[id];const pane=$(`.sec-pane[data-pane="${id}"]`);
  if(pane.dataset.locked)return;
  let score=0,total=0;const wrongG={};
  const tally=(res,it)=>{total++;score+=res.s;if(res.s<1&&it.g)wrongG[it.g]=1};
  const doItem=(key,it)=>{
    const q=$('#q-'+key,pane);if(!q)return;const box=$('.fb',q);let res,ans='';
    if(it.t==='mcq'){
      const r=$(`input[name="${key}"]:checked`,q);const v=r?+r.value:-1;
      res={s:v===it.a?1:0,blank:v<0};ans=`${'ABCD'[it.a]}. ${strip(it.o[it.a])}`;
    }else if(it.t==='tf'){
      const r=$(`input[name="${key}"]:checked`,q);const v=r?r.value:'';
      res={s:(v==='T')===it.a&&v?1:0,blank:!v};ans=it.a?'T (True)':'F (False)';
    }else if(it.t==='fill'){
      const ins=$$('input[data-b]',q);let ok=0,any=false;
      ins.forEach((inp,i)=>{const v=norm(inp.value);if(v)any=true;const good=it.a[i].map(norm).indexOf(v)>=0;if(good)ok++;inp.style.borderColor=good?'var(--good)':'var(--bad)';inp.style.background=good?'var(--good-bg)':'var(--bad-bg)'});
      res={s:ok/ins.length,blank:!any};ans=esc(it.a.map(x=>x[0]).join(' · ').replace(/'/g,'’'));
    }else if(it.t==='text'){
      res=gradeText(it,$('#'+key,q).value);
      ans=esc(sec.id==='write'?pretty(it.acc[0]):it.acc[0]);
    }
    markQ(q,res);feedback(box,res,it,ans);tally(res,it);
  };
  sec.groups.forEach((g,gi)=>{
    const key0=`${sec.id}_${gi}`;
    if(g.sub){g.sub.forEach((sg,si)=>sg.items.forEach((it,ii)=>doItem(`${key0}_${si}_${ii}`,it)))}
    else if(g.items[0].t==='gap'){

      g.items.forEach((it,ii)=>{
        const sel=$('#'+key0+'_'+ii,pane);const v=sel?sel.value:'';const ok=v===it.a;
        const res={s:ok?1:0,blank:!v};tally(res,it);
        if(sel){sel.style.borderColor=ok?'var(--good)':'var(--bad)';sel.style.background=ok?'var(--good-bg)':'var(--bad-bg)'}
        html+=`<li><span class="${ok?'ok':'no'}">(${ii+1}) ${ok?'✓ Chính xác':(v?'✗ Chưa đúng':'✗ Chưa trả lời')}</span>${ok?'':` · Đáp án: <b>${it.a}</b>`} · ${it.e}</li>`;
      });
      wrap.innerHTML=html+'</ul>';
    }else g.items.forEach((it,ii)=>doItem(`${key0}_${ii}`,it));
  });
  lockPane(pane);pane.dataset.locked='1';
  const pct=total?Math.round(score/total*100):0;
  const msg=pct>=90?'Xuất sắc! Em nắm rất chắc phần này.':pct>=70?'Khá tốt! Xem lại vài câu sai là hoàn hảo.':pct>=50?'Tạm ổn. Đọc lại bài giảng rồi làm lại nhé.':'Đừng nản. Xem bài giảng bên dưới rồi bấm "Làm lại".';
  const links=Object.keys(wrongG).map(k=>{const gg=GRAMMAR.find(x=>x.id===k);return gg?`<button type="button" class="chip" data-act="gopick" data-id="${gg.id}">Ôn lại: ${gg.title}</button>`:''}).join('');
  const sm=$('[data-summary]',pane);
  sm.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="score">${String(score).replace('.',',')}/${total}</div><div class="sub">${pct}% · quy đổi ${(Math.round(score/total*100)/10).toFixed(1).replace('.',',')} điểm</div></div><div style="max-width:40ch"><b>${msg}</b></div></div>${links?`<div class="row" style="margin-top:10px">${links}</div>`:''}`;
  sm.hidden=false;

  sset('best',best);updatePnav();
  try{sm.scrollIntoView({behavior:reduce()?'auto':'smooth',block:'start'})}catch(e){}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function pretty(s){
  s=s.replace(/\b(nam|lan|linh|mai)\b/g,m=>m[0].toUpperCase()+m.slice(1)).replace(/\btv\b/g,'TV');
  s=s.replace(/^look /,'Look! ');
  s=s.replace(/^./,c=>c.toUpperCase()).replace(/^(Look! )(.)/,(m,a,b)=>a+b.toUpperCase());
  return s+(/^how many/i.test(s)?'?':'.');
}

}
function checkSelf(id){

  }));
  const sm=$('[data-summary]',pane);
  sm.innerHTML=`<b>Em đã viết ${filled}/${n} câu.</b> So câu của em với câu mẫu. Một ý có thể diễn đạt đúng bằng nhiều cách, nên nhờ cô giáo xem thêm nhé.`;sm.hidden=false;
  try{sm.scrollIntoView({behavior:reduce()?'auto':'smooth',block:'start'})}catch(e){}
}
function resetSec(id){
  const pane=$(`.sec-pane[data-pane="${id}"]`);const sec=SECBY[id];
  pane.innerHTML=secHTML(sec);delete pane.dataset.locked;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go]');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  const a=t.dataset.act;
  if(a==='speak'){e.stopPropagation();speak(t.dataset.t);return}
  if(a==='flip'){const on=t.classList.toggle('flipped');t.setAttribute('aria-pressed',on);return}
  if(a==='known'){e.stopPropagation();const en=t.dataset.en;setKnown(en,!isKnown(en));
    if(V.only&&isKnown(en)){renderVocab();return}
    const card=t.closest('.wcard');const k=isKnown(en);
    t.classList.toggle('on',k);t.textContent=k?'✓ Đã thuộc':'Đánh dấu đã thuộc';t.setAttribute('aria-pressed',k);
    if(card)card.classList.toggle('known',k);
    const done=FLAT.filter(w=>isKnown(w.en)).length;const sp=$('#tab-tu-vung .filters .sub');if(sp)sp.textContent=`Đã thuộc ${done}/${FLAT.length} từ`;const bar=$('#tab-tu-vung .filters .bar>i');if(bar)bar.style.width=Math.round(done/FLAT.length*100)+'%';
    return}
  if(a==='unit'){V.unit=t.dataset.v;V.topic='all';V.quiz=null;renderVocab();return}
  if(a==='topic'){V.topic=t.dataset.v;V.quiz=null;renderVocab();return}
  if(a==='only'){V.only=!V.only;V.quiz=null;renderVocab();return}
  if(a==='mode'){V.mode=t.dataset.v;V.quiz=null;renderVocab();return}
  if(a==='dir'){V.dir=t.dataset.v;renderVocab();return}
  if(a==='qpick'){const cur=V.quiz.list[V.quiz.i];if(cur.picked>=0)return;cur.picked=+t.dataset.k;
    const ok=cur.opts[cur.picked].en===cur.w.en;if(ok)V.quiz.score++;else{V.quiz.wrong.push(cur.w);setKnown(cur.w.en,false)}
    renderVocab();return}
  if(a==='qnext'){if(V.quiz.i+1<V.quiz.list.length)V.quiz.i++;else V.quiz.done=true;renderVocab();return}
  if(a==='qrestart'){V.quiz=null;renderVocab();return}
  if(a==='qreview'){V.mode='cards';V.only=true;V.quiz=null;renderVocab();return}
  if(a==='gpick'){curG=t.dataset.id;sset('gcur',curG);renderGrammar();try{window.scrollTo(0,0)}catch(x){}return}
  if(a==='gopick'){curG=t.dataset.id;sset('gcur',curG);renderGrammar();go('ngu-phap');return}
  if(a==='gopractice'){const id=t.dataset.sec;if(SECBY[id])setSec(id);go(SETOF[id]||'lam-bai');return}
  if(a==='sec'){setSec(t.dataset.sec);return}
  if(a==='check'){const id=t.dataset.sec;const sc=SECBY[id];if(id==='open')checkOpen();else if(sc.groups[0].items&&sc.groups[0].items[0].t==='self')checkSelf(id);else checkSec(id);return}
  if(a==='reset'){resetSec(t.dataset.sec);return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.tile[data-act="flip"]')){e.preventDefault();e.target.click()}
});
window.addEventListener('hashchange',route);

renderStart();renderVocab();renderGrammar();renderPractice();route();
})();
</script>
