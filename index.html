[["is riding"]]},{"t":"fill","n":2,"q":"My friends and I ___ (organize) a party next weekend.","a":[["are organizing","are organising"]]},{"t":"fill","n":3,"q":"Listen! Someone ___ (knock) at the front door.","a":[["is knocking"]]},{"t":"fill","n":4,"q":"___ (your sister, practice) the guitar right now?","a":[["Is your sister practicing","Is your sister practising"]]},{"t":"fill","n":5,"q":"Mr. Pike ___ (not teach) us history this semester. He is on leave.","a":[["isn't teaching"]]},{"t":"fill","n":6,"q":"We ___ (prepare) for our English presentation at the moment.","a":[["are preparing"]]},{"t":"fill","n":7,"q":"___ (they, move) to a new apartment next month?","a":[["Are they moving"]]},{"t":"fill","n":8,"q":"The children ___ (sleep) upstairs, so please keep quiet.","a":[["are sleeping"]]},{"t":"fill","n":9,"q":"Anna ___ (not wear) a uniform today because it’s a holiday.","a":[["isn't wearing"]]},{"t":"fill","n":10,"q":"Look at the dark clouds! It ___ (rain) soon.","a":[["is raining","is going to rain"]]}]},{"h":"VI. Put the verbs in present simple or present continuous tense.","items":[{"t":"fill","n":1,"q":"Where (your father/ work) ___? – He (work) ___ in a hospital.","a":[["does your father work"],["works"]]},{"t":"fill","n":2,"q":"Listen! The birds (sing) ___ in the tall trees.","a":[["are singing"]]},{"t":"fill","n":3,"q":"My sister usually (cook) ___ dinner for the family.","a":[["cooks"]]},{"t":"fill","n":4,"q":"Look! The children (play) ___ football in the rain.","a":[["are playing"]]},{"t":"fill","n":5,"q":"We (not/ have) ___ English classes on Sundays.","a":[["don't have"]]},{"t":"fill","n":6,"q":"What (your mother/ do) ___ at the moment?","a":[["is your mother doing"]]},{"t":"fill","n":7,"q":"Water (boil) ___ at 100 degrees Celsius.","a":[["boils"]]},{"t":"fill","n":8,"q":"Be quiet! The baby (sleep) ___ in the bedroom.","a":[["is sleeping"]]},{"t":"fill","n":9,"q":"Tom (not/ read) ___ books right now.","a":[["isn't reading"]]},{"t":"fill","n":10,"q":"The train to Hanoi (leave) ___ at 8 a.m. every day.","a":[["leaves"]]}]},{"h":"VII. Supply the correct form of the words in brackets.","items":[{"t":"fill","n":1,"q":"Ella is very ___ and gets along well with everyone. (friend)","a":[["friendly"]]},{"t":"fill","n":2,"q":"Please be ___ with those vases. Don’t break them. (care)","a":[["careful"]]},{"t":"fill","n":3,"q":"My brother is very ___. He always has great ideas for our class projects. (create)","a":[["creative"]]},{"t":"fill","n":4,"q":"The classroom is very ___ because all the students are talking loudly. (noise)","a":[["noisy"]]},{"t":"fill","n":5,"q":"Playing sports every day helps children stay healthy and ___. (act)","a":[["active"]]}]}]},{"id":"d1_rewrite","name":"VIII. Complete the second sentence","short":"Viết lại câu","tag":"Đề cương 1","intro":"Đề giữ nguyên nội dung file đề cương. Em viết câu trả lời, bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Câu mẫu do máy soạn thêm (file gốc không có đáp án), một câu có thể có nhiều cách viết đúng.","groups":[{"h":"VIII. Complete the second sentence so that it means the same as the first.","items":[{"t":"self","n":1,"q":"Her eyes are brown and big.<br>⇒ She ___","model":"She has big brown eyes."},{"t":"self","n":2,"q":"My house has two living rooms, 2 kitchens and two bedrooms.<br>⇒ There ___","model":"There are two living rooms, two kitchens and two bedrooms in my house."},{"t":"self","n":3,"q":"Phong likes Maths most.<br>⇒ Phong’s ___","model":"Phong’s favourite subject is Maths."},{"t":"self","n":4,"q":"James is hard-working and smart.<br>⇒ James isn’t ___","model":"James isn’t lazy or stupid."},{"t":"self","n":5,"q":"What is your address?<br>⇒ Where ___","model":"Where do you live?"},{"t":"self","n":6,"q":"Do you want to go for a drink?<br>⇒ Would ___","model":"Would you like to go for a drink?"},{"t":"self","n":7,"q":"There aren’t any students in this room.<br>⇒ This room ___","model":"This room has no students."},{"t":"self","n":8,"q":"Does your brother go to school by bike?<br>⇒ Does your brother ___","model":"Does your brother ride a bike to school?"},{"t":"self","n":9,"q":"Her mother has short hair.<br>⇒ Her mother’s hair ___","model":"Her mother’s hair is short."},{"t":"self","n":10,"q":"Are there 20 rooms in your school?<br>⇒ Does ___","model":"Does your school have 20 rooms?"}]}],"selfCheck":true},{"id":"d1_read","name":"IX–X. Reading","short":"Đọc hiểu","tag":"Đề cương 1","intro":"Đề giữ nguyên nội dung file đề cương. Làm hết rồi bấm \"Nộp bài\" để máy chấm. File gốc không có đáp án nên đáp án do máy soạn thêm, nhờ cô đối chiếu lại.","groups":[{"h":"IX. Read then choose the best answer to complete the passage.","passage":"This is a small room. There is some (1) ______________ in the room. There is a bed on the right of the picture. It is a bed for one person. (2) ______________ the bed there are some pictures on the wall. Next to the door, on the left, there is a (3) ______________. There is another chair (4) ______________ the table and the bed. The table and chair are below the window. On the table (5) ______________ some objects – a jug, a glass and a bowl. Next to the door on the right there is a (6) ______________ on a peg. Behind the bed there are some more things on the wall but (7) ______________ aren’t easy to see. Of course, (8) ______________ any modern things in the room and it isn’t very comfortable.","sub":[{"h":"Câu 1–8","items":[{"t":"mcq","n":1,"q":"","o":["furniture","picture","people","tool"],"a":0},{"t":"mcq","n":2,"q":"","o":["On","Under","above","Behind"],"a":2},{"t":"mcq","n":3,"q":"","o":["bed","chair","window","table"],"a":1},{"t":"mcq","n":4,"q":"","o":["between","next to","beside","in front of"],"a":0},{"t":"mcq","n":5,"q":"","o":["there is","there isn’t","there aren’t","there are"],"a":3},{"t":"mcq","n":6,"q":"","o":["mirror","towel","chair","picture"],"a":1},{"t":"mcq","n":7,"q":"","o":["there","it","they","that"],"a":2},{"t":"mcq","n":8,"q":"","o":["there are","there aren’t","there is","there isn’t"],"a":1}]}]},{"h":"X. Read the passage. Circle the best answer A, B, C or D to each of the questions.","passage":"At Hill Bilingual School, students learn many subjects. For example, they learn Math in both Vietnamese and English, and they also study Science in English. Because of this, students spend their mornings and afternoons studying at school. Here, they only need to wear uniforms on Tuesdays and Thursdays. Besides studying, students also play sports and join many clubs. For sports, there are swimming, basketball, Frisbee, football, badminton to choose from. Once a week, students go to their favourite club to have some fun time.","sub":[{"h":"Câu 1–5","items":[{"t":"mcq","n":1,"q":"What is the passage about?","o":["Some sports at a school.","Some subjects at Hill school.","Student life at Hill school.","Some schools."],"a":2},{"t":"mcq","n":2,"q":"What does the word ‘they’ in line 2 mean?","o":["The subjects.","The students.","The sports.","The clubs"],"a":1},{"t":"mcq","n":3,"q":"What sports do students play at Hill school?","o":["Judo","Frisbee","Baseball","Volleyball"],"a":1},{"t":"mcq","n":4,"q":"Why do the students join the clubs?","o":["Because they want to have fun.","Because they don’t like studying other subjects.","Because they can play sports there.","Because they need to go there."],"a":0},{"t":"mcq","n":5,"q":"Why do students go to their favourite club?","o":["To have some fun","To have lunch","To have dinner","To enjoy food"],"a":0}]}]}]}];

ag":"Đề cương 2","intro":"Đề giữ nguyên nội dung file đề cương. Làm hết rồi bấm \"Nộp bài\" để máy chấm. File gốc không có đáp án nên đáp án do máy soạn thêm, nhờ cô đối chiếu lại.","groups":[{"h":"III. Vocabularies","items":[{"t":"mcq","n":1,"q":"Students will get to live away from home if they study in a ________.","o":["boarding school","greenhouse","neighbourhood","surround"],"a":0},{"t":"mcq","n":2,"q":"A ________ is a room in the house where people sit together, watch TV, etc.","o":["living room","bedroom","hall","kitchen"],"a":0},{"t":"mcq","n":3,"q":"Mona is very ________. She always has new ideas.","o":["reliable","creative","outgoing","friendly"],"a":1},{"t":"mcq","n":4,"q":"We live in a town house, but our grandparents live in a ________ house.","o":["city","villa","country","apartment"],"a":2},{"t":"mcq","n":5,"q":"She has short hair and big blue ________.","o":["mouth","hand","cheek","eyes"],"a":3},{"t":"mcq","n":6,"q":"In order to draw a circle, we need a ________.","o":["share","compass","poems","pencil sharpener"],"a":1},{"t":"mcq","n":7,"q":"My brother is having a ________ in the bathroom.","o":["meal","shower","towel","chair"],"a":1},{"t":"mcq","n":8,"q":"I love my bedroom because it’s ________.","o":["comfortable","uncomfortable","comfort","uncomfort"],"a":0}]},{"h":"IV. Asking about appearance and personality","items":[{"t":"mcq","n":1,"q":"What does your sister look like?","o":["She’s very loving and kind.","She’s pretty caring and funny.","She’s very tall with long black hair.","She’s hard-working and careful."],"a":2},{"t":"mcq","n":2,"q":"What does your brother look like?","o":["He’s so confident and active.","He has a big mouth and short black hair.","He’s very loving and kind.","He’s hard-working and careful."],"a":1},{"t":"mcq","n":3,"q":"A: Is he a lazy person? – B: No, in fact, he’s very ________.","o":["clever","careful","hard-working","shy"],"a":2},{"t":"mcq","n":4,"q":"A: Is your sister ________? – B: Yes. She’s always unconfident and doesn’t like to meet new people.","o":["clever","careful","hard-working","shy"],"a":3},{"t":"mcq","n":5,"q":"John: ________? – Alex: He’s short and fat with spiky hair.","o":["Are you short and fat","What does he like","What does Bill look like","Do you like James"],"a":2},{"t":"mcq","n":6,"q":"A: What does your mom look like? B: She is very ________. She goes to the gym regularly.","o":["slim","thin","skinny","overweight"],"a":0},{"t":"mcq","n":7,"q":"Of course, I’m very ________! I got an A+ on all of my exams!","o":["funny","smart","kind","active"],"a":1},{"t":"mcq","n":8,"q":"My uncle loves to tell jokes to make us laugh. He’s ________.","o":["funny","smart","kind","active"],"a":0}]},{"h":"V. Prepositions","items":[{"t":"mcq","n":1,"q":"Peter is ________ his father and his mother.","o":["in front of","behind","opposite","between"],"a":3},{"t":"mcq","n":2,"q":"Don’t stand ________ the TV. I’m trying to watch this programme.","o":["behind","next to","under","in front of"],"a":3},{"t":"mcq","n":3,"q":"Her birthday is ________ Friday, September 20th.","o":["in","on","by","out"],"a":1},{"t":"mcq","n":4,"q":"On a bus, passengers sit ________ the driver.","o":["in front of","between","behind","down"],"a":2},{"t":"mcq","n":5,"q":"We usually talk with friends ________ break time.","o":["at","on","off","beside"],"a":0},{"t":"mcq","n":6,"q":"I sit ________ Sarah at school.","o":["on","next to","between","under"],"a":1},{"t":"mcq","n":7,"q":"There are four students at each table. My friend Justine sits ________ me.","o":["in front of","near to","opposite with","between"],"a":0},{"t":"mcq","n":8,"q":"The clock is ________ the teacher’s desk.","o":["in","above","next to","behind"],"a":1}]},{"h":"VI. Adverbs of frequency","items":[{"t":"mcq","n":1,"q":"Andrea lives next door, so we ________ see her.","o":["never","often","rarely","seldom"],"a":1},{"t":"mcq","n":2,"q":"I ________ do my homework after school. Every day!","o":["never","always","often","sometime"],"a":1},{"t":"mcq","n":3,"q":"He ________ goes swimming. He can’t swim!","o":["sometimes","always","usually","never"],"a":3},{"t":"mcq","n":4,"q":"We ________ have pizza for dinner. Just once a week!","o":["always","sometimes","usually","never"],"a":1},{"t":"mcq","n":5,"q":"They ________ watch TV in English. They love it!","o":["never","sometimes","usually","rarely"],"a":2},{"t":"mcq","n":6,"q":"Dan ________ early on weekdays.","o":["doesn’t get always up","doesn’t always gets up","always get up","always gets up"],"a":3},{"t":"mcq","n":7,"q":"Susan ________ early for class.","o":["often is","are often","often are","is often"],"a":3},{"t":"mcq","n":8,"q":"When do you ________ go on vacation each year?","o":["always","never","usually","ever"],"a":2}]},{"h":"VII. Possessive case","items":[{"t":"mcq","n":1,"q":"This is the ________ book that won the award last year.","o":["author","authors","author’s","authors’"],"a":2},{"t":"mcq","n":2,"q":"I went to ________ house for dinner last night.","o":["Michael’s","Michaels’","Michael","Michaels"],"a":0},{"t":"mcq","n":3,"q":"I can’t meet you on Saturday because there’s ________.","o":["the wedding of my aunt","my aunt’s wedding","my aunts’ wedding","the wedding of my aunts"],"a":1},{"t":"mcq","n":4,"q":"The ________ bark was loud enough to wake the neighbourhood.","o":["dog’s","dogs’s","dogs","dog"],"a":0},{"t":"mcq","n":5,"q":"One car belongs to Tom and another car belongs to Jenny. These are ________.","o":["Tom’s and Jenny’s cars","the cars of Tom and Jenny","Tom and Jenny’s cars","Tom’s and Jenny’s car"],"a":0},{"t":"mcq","n":6,"q":"The king lives in a very beautiful palace. The ________ is very beautiful.","o":["palace of the king","palace of the king","king’s palace","kings’ palace"],"a":2},{"t":"mcq","n":7,"q":"________ will be renewed.","o":["Our roof’s house","Our house’s roof","The house of our roof","The roof of our house"],"a":3},{"t":"mcq","n":8,"q":"He knows my brother Tim very well because he is in ________.","o":["the class of ["toys","pens","notebooks","books"],"a":3},{"t":"mcq","n":4,"q":"","o":["do","make","cook","have"],"a":2},{"t":"mcq","n":5,"q":"","o":["is","are","give","be"],"a":1},{"t":"mcq","n":6,"q":"","o":["has","is","gets","needs"],"a":0}]}]},{"h":"Part 3. Read the text carefully then choose the correct words.","passage":"My (1) ________ room is our living room. It is rather big and warm. There is a big window with lots of pot plants and green and yellow curtains. In our living room, (2) ________ a green sofa and two green armchairs. There is a big yellow rug on the floor. A modern floor lamp (3) ________ in the right corner of the room. (4) ________ to the sofa there is a small coffee table with a vase of flowers. By the wall there is a big table with six (5) ________. We have a television and a bookshelf with a lot of books and pictures. We also have a CD player on the shelf. I often watch TV, listen to (6) ________ or read books there. I really like my living room.","sub":[{"h":"Câu 1–6","items":[{"t":"mcq","n":1,"q":"","o":["favourite","like","wonderful","beautiful"],"a":0},{"t":"mcq","n":2,"q":"","o":["There are","There is","There isn’t","There aren’t"],"a":1},{"t":"mcq","n":3,"q":"","o":["stand","standes","stands","standing"],"a":2},{"t":"mcq","n":4,"q":"","o":["Near","On","In","Next"],"a":3},{"t":"mcq","n":5,"q":"","o":["brown chair","chairs brown","brown chairs","chair"],"a":2},{"t":"mcq","n":6,"q":"","o":["sports","magazine","TV","music"],"a":3}]}]},{"h":"Part 4. Read the passage and choose the best answer.","passage":"<b>My best friend</b><br>I’m Julie and my best friend is Janet. We’re 12 years old and we’re in the same class. Both of us are tall and slim. I’m a bit quiet and shy, and Janet is kind and friendly. We like to spend our free time together. At break time, we sometimes play skipping or we just sit and chat. We live in the same building, so we always walk home together and talk about our homework. Janet is very helpful to me. When I’m doing my homework and I don’t understand a question, I often call her for help. At weekends, Janet usually wants to go skating in the park or to the cinema, but I like staying at home and reading comic books. However, we often plan our day together.","sub":[{"h":"Câu 1–6","items":[{"t":"mcq","n":1,"q":"What does Janet look like?","o":["She is tall and fat.","She is tall and slim.","She is short and slim.","She is tall and ____."],"a":1},{"t":"mcq","n":2,"q":"What is Julie like?","o":["She is very helpful and quiet","She is very helpful and kind.","She is helpful and friendly.","She is quiet and shy."],"a":3},{"t":"mcq","n":3,"q":"What do Julie and Janet do at break time?","o":["Sometimes they play skipping.","Sometimes they just sit and talk.","Sometimes they talk about our homework","Both A and B."],"a":3},{"t":"mcq","n":4,"q":"Why do Julie and Janet walk home together after school each day?","o":["Because they live in the same building.","Because they are classmates.","Because they learn in the same school.","Because we often plan our day together."],"a":0},{"t":"mcq","n":5,"q":"What does Julie do when she has a difficult question in her homework?","o":["She tries her best to answer it.","She just talks to Janet about it.","She asks Janet for help.","She wants to go skating in the park"],"a":2},{"t":"mcq","n":6,"q":"What does Janet usually want to do at weekends?","o":["She wants to stay at home and read comic books.","She wants to go skating or go to the cinema.","She wants to do her homework with Julie.","She wants to play skipping at school."],"a":1}]}]},{"h":"Part 5. Read the passage and choose the best answer.","passage":"Nam’s grandparents live in a nice, small house in the countryside. There isn’t a school, a bookshop, a hotel, a hospital, a restaurant near it but there is a long river. There is a rice paddy behind the house. There is a rice paddy in front of it, too. To the left of the house is a small market. To the right of the house is a big garden. His grandparents grow a lot of vegetables and flowers in the garden. He loves them and their house very much. It is quiet and peaceful. He visits it every summer.","sub":[{"h":"Câu 1–6","items":[{"t":"mcq","n":1,"q":"How is Nam’s grandparents’ house?","o":["It is noisy and big.","It is nice and small.","It is modern and large.","It is old and dirty."],"a":1},{"t":"mcq","n":2,"q":"Near Nam’s grandparents’ house, there is ________.","o":["a school","a bookshop","a restaurant","a long river"],"a":3},{"t":"mcq","n":3,"q":"What is behind the house?","o":["A big garden","a rice paddy","a long river","a small market"],"a":1},{"t":"mcq","n":4,"q":"Is there a rice paddy in front of the house?","o":["No, there’s","No, there isn’t","Yes, there is","Yes, there isn’t"],"a":2},{"t":"mcq","n":5,"q":"What’s to the right of the house?","o":["a big garden","a rice paddy","a long river","a small market"],"a":0},{"t":"mcq","n":6,"q":"Why does he visit the house every summer? – Because ________.","o":["he loves that house.","his parents live in that house.","he doesn’t like his house.","he loves his grandparents and that house."],"a":3}]}]},{"h":"Part 6. Read the passage and choose the best answer.","passage":"Hi! My name’s Lilly Browns. I’m eleven years old. I’m now in grade 6 at Dream School. I like it here because I like to study in an international school. The teachers in my school are nice and very helpful, and my favourite teacher is Mr. Oily. He teaches us physics. I have three hours to study Vietnamese in the afternoon. Usually, I read books in the library and do my homework at break time. We wear our uniforms every day, but today we aren’t, as we’re going to have an outing to the National Park.","sub":[{"h":"Câu 1–6","items":[{"t":"mcq","n":1,"q":"How old is Lilly?","o":["Ten years old","Eleven years old","Twelve years old","Thirteen years old"],"a":1},{"t":"mcq","n":2,"q":"Which grade is Lilly in?","o":["Grade 5","Grade 7","Grade 6","Grade 8"],"a":2},{"t":"mcq","n":3,"q":"Why does Lilly like her school?","o":["Because it is near her house.","Because she has many friends there.","Because it is an international school.","Because she doesn’t have much homework."],"a":2},{"t":"mcq","n":4,"q":"Who is Lilly’s favourite teacher?","o":["Mr. John","Mr. Oily","Mrs. Anna","Ms. Brown"],"a":1},{"t":"mcq","n":5,"q":"What does Lilly usually do at break time?","o":["She reads books and does her homework.","She plays football.","She eats lunch with friends.","She talks on the phone."],"a":0},{"t":"mcq","n":6,"q":"Why aren’t the students wearing their uniforms today?","o":["Because they have a party.","Because they’re going to have an outing to the National Park.","Because it’s Sunday.","Because they don’t like uniforms."],"a":1}]}]}]},{"id":"d2_wfill","name":"WRITING · Part 1: Word form","short":"Viết: Word form","tag":"Đề cương 2","intro":"Đề giữ nguyên nội dung file đề cương. Làm hết rồi bấm \"Nộp bài\" để máy chấm. File gốc không có đáp án nên đáp án do máy soạn thêm, nhờ cô đối chiếu lại.","groups":[{"h":"Part 1: Word form:","items":[{"t":"fill","n":1,"q":"Vietnam has a lot of ___ places. (beauty)","a":[["beautiful"]]},{"t":"fill","n":2,"q":"They have a lot of ___ in the summer. (act)","a":[["activities"]]},{"t":"fill","n":3,"q":"Students of our school are ___ with one another. (friend)","a":[["friendly"]]},{"t":"fill","n":4,"q":"His ___ are long and thin. (foot)","a":[["feet"]]},{"t":"fill","n":5,"q":"My mother’s so ___. She looks after me when I’m sick. (care)","a":[["careful"]]},{"t":"fill","n":6,"q":"My brother is very ___. He has a lot of interesting ideas. (create)","a":[["creative"]]},{"t":"fill","n":7,"q":"I keep my socks in the chest of ___. (draw)","a":[["drawers"]]},{"t":"fill","n":8,"q":"Messi is a famous football ___. (play)","a":[["player"]]}]}]},{"id":"d2_wself","name":"WRITING · Part 2–4","short":"Viết câu (tự luyện)","tag":"Đề cương 2","intro":"Đề giữ nguyên nội dung file đề cương. Em viết câu trả lời, bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Câu mẫu do máy soạn thêm (file gốc không có đáp án), một câu có thể có nhiều cách viết đúng.","groups":[{"h":"Part 2: Make question for the underlined part","items":[{"t":"self","n":1,"q":"My brother is <u>tall with short black hair</u>.","model":"What does your brother look like?"},{"t":"self","n":2,"q":"Rose is <u>active and hard-working</u>.","model":"What is Rose like?"},{"t":"self","n":3,"q":"My best friend is <u>a clever student</u>.","model":"What is your best friend?"},{"t":"self","n":4,"q":"Nick has <u>blonde hair and a big nose</u>.","model":"What does Nick look like?"},{"t":"self","n":5,"q":"My sister is <u>pretty and she has brown eyes</u>","model":"What does your sister look like?"},{"t":"self","n":6,"q":"Lisa’s father is <u>funny and kind</u>","model":"What is Lisa’s father like?"},{"t":"self","n":7,"q":"My classmates are <u>friendly and confident</u>.","model":"What are your classmates like?"},{"t":"self","n":8,"q":"Their grandparents have <u>curly hair</u>.","model":"What do their grandparents look like?"}]},{"h":"Part 3: Sentence transformation","items":[{"t":"self","n":1,"q":"There are some trees in front of my school.","model":"My school is behind some trees."},{"t":"self","n":2,"q":"The tall tree is behind my house.","model":"My house is in front of the tall tree."},{"t":"self","n":3,"q":"The notebook is on the book.","model":"The book is under the notebook."},{"t":"self","n":4,"q":"The cat is in front of the computer.","model":"The computer is behind the cat."},{"t":"self","n":5,"q":"Many flowers are behind the hotel.","model":"The hotel is in front of many flowers."},{"t":"self","n":6,"q":"There are some rulers under the calculator.","model":"The calculator is above some rulers."},{"t":"self","n":7,"q":"There is a smart phone on the book.","model":"The book is under the smart phone."},{"t":"self","n":8,"q":"The smart watch is under the pencil case.","model":"The pencil case is above the smart watch."}]},{"h":"Part 4: Rewrite using suggestion","items":[{"t":"self","n":1,"q":"Let’s go to the zoo this weekend.","model":"How about going to the zoo this weekend?"},{"t":"self","n":2,"q":"Let’s have a party on Sunday.","model":"How about having a party on Sunday?"},{"t":"self","n":3,"q":"Let’s help our mother with the housework.","model":"How about helping our mother with the housework?"},{"t":"self","n":4,"q":"Let’s buy some English books.","model":"How about buying some English books?"},{"t":"self","n":5,"q":"How about putting a picture on the wall?","model":"Let’s put a picture on the wall."},{"t":"self","n":6,"q":"How about making a birthday cake for Anna?","model":"Let’s make a birthday cake for Anna."},{"t":"self","n":7,"q":"How about visiting grandmother this Saturday?","model":"Let’s visit grandmother this Saturday."},{"t":"self","n":8,"q":"How about playing volleyball after school?","model":"Let’s play volleyball after school."}]}],"selfCheck":true}];

ee languages.","o":["is speaking","speaks","not speak","speak"],"a":1,"e":""},{"t":"mcq","n":3,"q":"We need to buy an electric cooker. The old one is broken so we can't ______ food.","o":["making","made","makes","make"],"a":3,"e":""},{"t":"mcq","n":4,"q":"“______ is it to the bookshop, please?”","o":["How often","How far","How long","How much"],"a":1,"e":""},{"t":"mcq","n":5,"q":"Nam is ______ for the broken glass window in his bedroom.","o":["responsible","accusing","shy","confident"],"a":0,"e":""},{"t":"mcq","n":6,"q":"I'm busy. I'm ______ the exercise at the end of the chapter.","o":["learning","making","doing","studying"],"a":2,"e":""},{"t":"mcq","n":7,"q":"Mai is ______ best friend. I like her a lot.","o":["her","mine","hers","my"],"a":3,"e":""},{"t":"mcq","n":8,"q":"Sue ______ works very hard. She is at the top of the class.","o":["never","seldom","often","sometimes"],"a":2,"e":""},{"t":"mcq","n":9,"q":"She does ______ every day. It is good for her health.","o":["yoga","soccer","volleyball","table tennis"],"a":0,"e":""},{"t":"mcq","n":10,"q":"There are some books ______ the floor.","o":["on","next to","in","behind"],"a":0,"e":""},{"t":"mcq","n":11,"q":"David is ______ the kitchen.","o":["in","between","in front of","at"],"a":0,"e":""},{"t":"mcq","n":12,"q":"My friend, Elisa is very ______. She spends most of her time studying.","o":["lazy","hard-working","sociable","confident"],"a":1,"e":""},{"t":"mcq","n":13,"q":"My younger brother is kind and funny. He often make me ______.","o":["angry","bored","cry","laugh"],"a":3,"e":""},{"t":"mcq","n":14,"q":"Look! Our teachers ______ badminton with the students.","o":["play","are playing","plays","is playing"],"a":1,"e":""},{"t":"mcq","n":15,"q":"- “Look! Why ______?” - “Well, they are nearly late for school.”","o":["do the children run","did the children run","are the children running","were the children running"],"a":2,"e":""},{"t":"mcq","n":16,"q":"Please be quiet! I ______.","o":["worked","am working","working","wor Tell me about your house in your next e-mail.<br><i>Love, Mimi</i>","box":["to","are","because","listen","at","a","on","and"],"items":[{"t":"gap","a":"to","e":"move to: chuyển đến."},{"t":"gap","a":"are","e":"<i>seven rooms</i> số nhiều."},{"t":"gap","a":"because","e":"Chỉ lí do."},{"t":"gap","a":"listen","e":"listen to music."},{"t":"gap","a":"at","e":"at school."},{"t":"gap","a":"a","e":"a big bookshelf."},{"t":"gap","a":"on","e":"on the shelf."},{"t":"gap","a":"and","e":"clean and tidy."}]}]},{"id":"d3_read","name":"Ex 8–9 · Đọc hiểu","short":"Đọc hiểu T/F, trắc nghiệm","tag":"Đề cương 3","intro":"File gốc là \"GV_Review Unit 1-2-3\" (có đáp án tô xanh). Làm hết rồi bấm \"Nộp bài\" để máy chấm.","groups":[{"h":"Exercise 8. Read the following passage and decide True or False.","passage":"Every day, Julia gets up at half past six. First, she goes to the bathroom and brushes her teeth. After that, she gets dressed and combs her hair. Then, she has a glass of milk and some sandwiches for breakfast. At seven she goes to school. She takes the bus to get there. It is a long way from home. Her classes start at half past eight and end at eleven o'clock. Then she goes home and has lunch at half past twelve. In the afternoon, she stays at home and she does her homework. After that she plays badminton or listens to music. At seven o'clock she has dinner with her family and then she watches television. At ten o'clock she goes to bed.","items":[{"t":"tf","n":1,"q":"Julia always gets up at 6.00 in the morning.","a":false,"e":"Bạn ấy dậy lúc <i>half past six</i> (6:30)."},{"t":"tf","n":2,"q":"She drinks milk and eats sandwiches before going to school.","a":true,"e":"<i>a glass of milk and some sandwiches for breakfast</i>."},{"t":"tf","n":3,"q":"Julia goes to school by bus.","a":true,"e":"<i>She takes the bus</i>."},{"t":"tf","n":4,"q":"She studies from 8.00 to 11.00 at school.","a":false,"e":"Lớp học bắt đầu lúc 8:30 (<i>half past eight</i>)."},{"t":"tf","n":5,"q":"Julia often listens to music after having dinner.","a":false,"e":"Nghe nhạc là sau bữa chiều (buổi chiều); sau bữa tối bạn ấy xem tivi."}]},{"h":"Exercise 9. Read the following passages and choose the correct answer. (1)","passage":"<b>Passage 1</b><br>I live in a small white house near the sea. It's an old house, about 70 years old. There are two bedrooms upstairs and a small bathroom. There is a living room downstairs next to the kitchen. There is a garden in front of the house. It has many beautiful flowers in spring and summer. I live with my parents and my little brother, and we have a lot of visitors. My best friend often comes to my house at the weekend. We go swimming and fly kites on the beach. It is really fun. I love my house a lot and the best thing is the sea view from my bedroom window.","sub":[{"h":"Passage 1","items":[{"t":"mcq","n":1,"q":"Where is the house located?","o":["In the city","In the forest","Near the sea","Near the mountains"],"a":2,"e":""},{"t":"mcq","n":2,"q":"Where is the bathroom in the house?","o":["Downstairs","Upstairs","Next to the kitchen","In the garden"],"a":1,"e":""},{"t":"mcq","n":3,"q":"What is in front of the house?","o":["A big tree","A garage","A garden with flowers","A swimming pool"],"a":2,"e":""},{"t":"mcq","n":4,"q":"What do the friends do at the beach?","o":["Go sailing and sunbathing","Go fishing and surfing","Go swimming and fly kites","Play football and volleyball"],"a":2,"e":""},{"t":"mcq","n":5,"q":"What does the writer like best about the house?","o":["The sea view","The old style","The garden","The living room"],"a":0,"e":""}]}]},{"h":"Exercise 9 (tiếp). (2)","passage":"<b>Passage 2</b> · Subject: My friends at the Happy Camp<br>Hi mom and dad,<br>Here I am happy at the Happy Camp. Everything has gone very well and I've made some friends. In the picture, there are three of my new friends, Nora, Jimmy and Rose. Nora, from Germany, is a tall girl with long blonde hair and green eyes. She's very kind, funny and clever. She likes singing and dancing. Jimmy is in the middle. He's from Canada. He has short red hair and big ears. He wears glasses. He likes playing video games. He says he wants to be a pilot. Rose is standing next to me. She has long curly brown hair. She's from England. She's very kind and creative. She loves to talk with people and make them laugh. I think she's beautiful.<br>We're having so much fun. I really like the camp and my friends from all over the world. Please write soon.<br>Love,<br>Mai","sub":[{"h":"Passage 2","items":[{"t":"mcq","n":1,"q":"Where is Mai writing the email from?","o":["From her school","From the Happy Camp","From her home","From the library"],"a":1,"e":""},{"t":"mcq","n":2,"q":"What does Nora look like?","o":["Short with black hair and blue eyes","Tall with long blonde hair and green eyes","Medium height with brown curly hair","Short with red hair and glasses"],"a":1,"e":""},{"t":"mcq","n":3,"q":"What does Jimmy want to be?","o":["A singer","A teacher","A pilot","A dancer"],"a":2,"e":""},{"t":"mcq","n":4,"q":"Where is Rose from?","o":["Germany","Canada","England","America"],"a":2,"e":""},{"t":"mcq","n":5,"q":"What does Rose love to do?","o":["Talk with people and make them laugh","Fly kites","Play video games","Sing and dance"],"a":0,"e":""}]}]}]},{"id":"d3_rest","name":"Ex 11–12 · Câu bị bỏ, hội thoại","short":"Ghép câu, hội thoại","tag":"Đề cương 3","intro":"File gốc là \"GV_Review Unit 1-2-3\" (có đáp án tô xanh). Làm hết rồi bấm \"Nộp bài\" để máy chấm.","groups":[{"h":"Exercise 11. Four phrases/sentences have been removed from the text below. Choose the option that best fits each blank. (1)","passage":"Every day, Julia gets up at half past six. (1)____. After that, she gets dressed and combs her hair. Then, she has a glass of milk and some sandwiches for breakfast. (2)____. She takes the bus to get there. It is a long way from home. Her classes start at half past eight and end at eleven o'clock. Then she goes home and has lunch at half past twelve. (3)____. After that she plays badminton or listens to music. At seven o'clock, she has dinner with her family and then she watches television. (4)____.<br><b>A.</b> At ten o'clock she goes to bed &nbsp; <b>B.</b> First, she goes to the bathroom and brushes her teeth &nbsp; <b>C.</b> At seven she goes to school &nbsp; <b>D.</b> In the afternoon, she stays at home and does her homework","sub":[{"h":"Text 1","items":[{"t":"mcq","n":1,"q":"Blank (1)","o":["At ten o'clock she goes to bed","First, she goes to the bathroom and brushes her teeth","At seven she goes to school","In the afternoon, she stays at home and does her homework"],"a":1,"e":""},{"t":"mcq","n":2,"q":"Blank (2)","o":["At ten o'clock she goes to bed","First, she goes to the bathroom and brushes her teeth","At seven she goes to school","In the afternoon, she stays at home and does her homework"],"a":2,"e":""},{"t":"mcq","n":3,"q":"Blank (3)","o":["At ten o'clock she goes to bed","First, she goes to the bathroom and brushes her teeth","At seven she goes to school","In the afternoon, she stays at home and does her homework"],"a":3,"e":""},{"t":"mcq","n":4,"q":"Blank (4)","o":["At ten o'clock she goes to bed","First, she goes to the bathroom and brushes her teeth","At seven she goes to school","In the afternoon, she stays at home and does her homework"],"a":0,"e":""}]}]},{"h":"Exercise 11 (tiếp). (2)","passage":"We can choose our friends, (1)____. That does not mean that members of our family cannot also be our friends. Many children have a very good relationship with their parents, and they see them as friends. Of course, (2)____, or they can get angry with you. That's only natural. There are times when you want to be independent and decide things by yourself. After all, nobody is perfect, and we all make mistakes. (3)____. (4)____, you will see that you have many things in common with your mum and dad, and you will become closer to them.<br><b>A.</b> when you are a teenager, there are times when you do not get on very well with your parents &nbsp; <b>B.</b> But your parents understand that &nbsp; <b>C.</b> When you grow up &nbsp; <b>D.</b> but we cannot choose our relatives","sub":[{"h":"Text 2","items":[{"t":"mcq","n":1,"q":"Blank (1)","o":["when you are a teenager, there are times when you do not get on very well with your parents","But your parents understand that","When you grow up","but we cannot choose our relatives"],"a":3,"e":""},{"t":"mcq","n":2,"q":"Blank (2)","o":["when you are a teenager, there are times when you do not get on very well with your parents","But your parents understand that","When you grow up","but we cannot choose our relatives"],"a":0,"e":""},{"t":"mcq","n":3,"q":"Blank (3)","o":["when you are a teenager, there are times when you do not get on very well with your parents","But your parents understand that","When you grow up","but we cannot choose our relatives"],"a":1,"e":""},{"t":"mcq","n":4,"q":"Blank (4)","o":["when you are a teenager, there are times when you do not get on very well with your parents","But your parents understand that","When you grow up","but we cannot choose our relatives"],"a":2,"e":""}]}]},{"h":"Exercise 12. Choose A–E to complete the conversation between Jack and Cody.","passage":"<b>Options:</b><br>A - I am having a piano lesson at the music club.<br>B - Then I am going shopping with my mother.<br>C - What are you doing this weekend, Cody?<br>D - Yes, I usually stay at home and watch TV.<br>E - Do you go to English class, every Saturday?<br><br><b>Jack:</b> (1)____<br><b>Cody:</b> On Saturday morning I am going to my English class.<br><b>Jack:</b> (2)____<br><b>Cody:</b> Yes, I do.<br><b>Jack:</b> What are you doing on Saturday afternoon?<br><b>Cody:</b> (3)____<br><b>Jack:</b> And on Sunday?<br><b>Cody:</b> I am playing basketball with my team. (4)____<br><b>Jack:</b> Do you ever watch TV on Sunday?<br><b>Cody:</b> (5)____","items":[{"t":"mcq","n":1,"q":"Blank (1)","o":["I am having a piano lesson at the music club.","Then I am going shopping with my mother.","What are you doing this weekend, Cody?","Yes, I usually stay at home and watch TV.","Do you go to English class, every Saturday?"],"a":2,"e":""},{"t":"mcq","n":2,"q":"Blank (2)","o":["I am having a piano lesson at the music club.","Then I am going shopping with my mother.","What are you doing this weekend, Cody?","Yes, I usually stay at home and watch TV.","Do you go to English class, every Saturday?"],"a":4,"e":""},{"t":"mcq","n":3,"q":"Blank (3)","o":["I am having a piano lesson at the music club.","Then I am going shopping with my mother.","What are you doing this weekend, Cody?","Yes, I usually stay at home and watch TV.","Do you go to English class, every Saturday?"],"a":0,"e":""},{"t":"mcq","n":4,"q":"Blank (4)","o":["I am having a piano lesson at the music club.","Then I am going shopping with my mother.","What are you doing this weekend, Cody?","Yes, I usually stay at home and watch TV.","Do you go to English class, every Saturday?"],"a":1,"e":""},{"t":"mcq","n":5,"q":"Blank (5)","o":["I am having a piano lesson at the music club.","Then I am going shopping with my mother.","What are you doing this weekend, Cody?","Yes, I usually stay at home and watch TV.","Do you go to English class, every Saturday?"],"a":3,"e":""}]}]},{"id":"d3_write","name":"Ex 13–15 · Viết câu","short":"Viết lại câu (tự luyện)","tag":"Đề cương 3","intro":"Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem đáp án mẫu trong file gốc và tự đối chiếu. Một ý có thể viết đúng bằng nhiều cách, nhờ cô xem thêm nhé.","groups":[{"h":"Exercise 13. Rewrite the sentences, so that their meaning stays the same, using the beginning given for each.","items":[{"t":"self","n":1,"q":"Phuong always gets to school on time.<br>→ Phuong never ___","model":"Phuong never gets to school late."},{"t":"self","n":2,"q":"Next to our school there is a local museum.<br>→ The local museum ___","model":"The local museum is next to our school."},{"t":"self","n":3,"q":"Our English teacher has a new beautiful bag.<br>→ The bag ___","model":"The bag of our English teacher is new and beautiful."},{"t":"self","n":4,"q":"There is a living room, a bathroom, a kitchen and two bedrooms in my house.<br>→ My house ___","model":"My house has a living room, a bathroom, a kitchen and two bedrooms."},{"t":"self","n":5,"q":"Where do you live, Ngoc?<br>→ What ___","model":"What is your address, Ngoc?"}]},{"h":"Exercise 14. Write full sentences to make a paragraph, using the suggested words/phrases given. Make necessary changes and add some words.","items":[{"t":"self","n":1,"q":"Tom / short black hair / blue eyes.","model":"Tom has short black hair and blue eyes."},{"t":"self","n":2,"q":"My friend / I / often / ride / bicycles / school / together.","model":"My friend and I often ride our bicycles to school together."},{"t":"self","n":3,"q":"There / table / and / four / chairs / my / living room.","model":"There is a table and four chairs in my living room."},{"t":"self","n":4,"q":"The children / like / Doraemon! because / it / funny.","model":"The children like Doraemon because it is funny."},{"t":"self","n":5,"q":"Nick / go / the / judo / club / on / Monday / Wednesday / ?","model":"Does Nick go to the judo club on Monday and Wednesday?"}]},{"h":"Exercise 15. Finish each of the following sentences so that its meaning stays the same.","items":[{"t":"self","n":1,"q":"Max's house is near the theater. (FAR)","model":"Max's house isn't far from the theater."},{"t":"self","n":2,"q":"There is a desk, a bookshelf and a bed in my bedroom. (HAS)","model":"My bedroom has a desk, a bookshelf and a bed."},{"t":"self","n":3,"q":"Tony likes chemistry most. (FAVOURITE)","model":"Tony's favourite subject is chemistry."},{"t":"self","n":4,"q":"Let's play volleyball on the beach. (HOW ABOUT)","model":"How about playing volleyball on the beach?"},{"t":"self","n":5,"q":"I don't have a dishwasher in my kitchen. (THERE)","model":"There isn't a dishwasher in my kitchen."}]}],"selfCheck":true},{"id":"d3_test1","name":"Test for Unit 1, 2, 3 · Câu 1–24","short":"Đề kiểm tra 1–24","tag":"Đề cương 3","intro":"File gốc là \"GV_Review Unit 1-2-3\" (có đáp án tô xanh). Làm hết rồi bấm \"Nộp bài\" để máy chấm.","groups":[{"h":"Câu 1–12. Pronunciation, stress and multiple choice.","items":[{"t":"mcq","n":1,"q":"Pronunciation: underlined part differs.","o":["c<u>o</u>mpass","sm<u>a</u>rt","cl<u>a</u>ssmate","f<u>a</u>st"],"a":0,"e":""},{"t":"mcq","n":2,"q":"Pronunciation: underlined part differs.","o":["phone<u>s</u>","street<u>s</u>","map<u>s</u>","make<u>s</u>"],"a":0,"e":""},{"t":"mcq","n":3,"q":"Stress: different from the others.","o":["music","picture","newspaper","computer"],"a":3,"e":""},{"t":"mcq","n":4,"q":"Stress: different from the others.","o":["garden","explain","happen","handbag"],"a":1,"e":""},{"t":"mcq","n":5,"q":"There is a garden ____________ the house.","o":["in front of","between","under","on"],"a":0,"e":""},{"t":"mcq","n":6,"q":"Patrick is very ________. He always does well in tests.","o":["loving","funny","short","clever"],"a":3,"e":""},{"t":"mcq","n":7,"q":"Look! These pupils are in grade 6. They ____ tall and strong. They ____ basketball on the school ground.","o":["are/ are playing","is/ is playing","are/ play","is/ plays"],"a":0,"e":""},{"t":"mcq","n":8,"q":"My sister always has a lot of new ideas. She's a ____________ person.","o":["creative","creation","creator","create"],"a":0,"e":""},{"t":"mcq","n":9,"q":"The ________ is the place for you to prepare your family meals.","o":["living room","bedroom","bathroom","kitchen"],"a":3,"e":""},{"t":"mcq","n":10,"q":"“I'm ____________ a party next weekend. Would you like to come?”","o":["having","have","has","to have"],"a":0,"e":""},{"t":"mcq","n":11,"q":"Our class is going to have a picnic at the zoo on ________. Would you like to come with us?","o":["weekend","Saturday","next week","April 5th"],"a":1,"e":""},{"t":"mcq","n":12,"q":"- “______ to come to the cinema tonight?” - “Oh, I'd love to!”","o":["Could you please","Do you like","Can you","Would you like"],"a":3,"e":""}]},{"h":"Câu 13–16. Read the following announcement and choose the correct option.","passage":"<b>Meet my classmate</b><br>This is Minh, my classmate. He is tall and has short black (13)______. He is very (14)______ and tells funny stories. Minh likes playing football and (15)______ comics. We often play (16)______ after school.","sub":[{"h":"Câu 13–16","items":[{"t":"mcq","n":13,"q":"Blank (13)","o":["nose","hair","eyes","mouth"],"a":1,"e":""},{"t":"mcq","n":14,"q":"Blank (14)","o":["boring","lazy","funny","shy"],"a":2,"e":""},{"t":"mcq","n":15,"q":"Blank (15)","o":["reading","read","reads","to reading"],"a":0,"e":""},{"t":"mcq","n":16,"q":"Blank (16)","o":["gather","alone","together","lonely"],"a":2,"e":""}]}]},{"h":"Câu 17–18. Sắp xếp câu và chọn câu kết.","passage":"My neighbourhood is a great place to live. It's not big, but it has everything I need. ______.<br><b>a.</b> I can buy fresh food from the market every morning.<br><b>b.</b> I often go there to exercise with my dad.<br><b>c.</b> There is a gym near my house, too.","items":[{"t":"mcq","n":17,"q":"Put the sentences (a-c) in the correct order, then choose the option that correctly orders them to form a coherent text.","o":["b - a - c","a - c - b","c - b - a","b - c - a"],"a":1,"e":""},{"t":"mcq","n":18,"q":"Choose the sentence that can END the text (in Question 17) most appropriately.","o":["To sum up, I am happy to live here.","I want to live in a bigger house.","I will move to a different neighborhood.","My parents also like the gym."],"a":0,"e":""}]},{"h":"Câu 19–24. Read the following passage and choose the correct option.","passage":"My best friend's name is Nhi. We are studying in the same class. She is my good (19)____ and always helps me. She also understands me well. I like her very much. She lives (20)____ to my house and we often walk to school in the morning. On Sundays she comes to my house. We both (21)____ to eat ice-cream, to draw and to write stories in our free time. Nhi is an active girl and never feels (22)____. She often tells me her interesting jokes. She has a round (23)____ with long black hair. At the moment, Nhi is at an English camp in Da Nang. I (24)____ her a lot.","sub":[{"h":"Câu 19–24","items":[{"t":"mcq","n":19,"q":"Blank (19)","o":["friends","classmates","friend","roomate"],"a":2,"e":""},{"t":"mcq","n":20,"q":"Blank (20)","o":["far","next","near","behind"],"a":1,"e":""},{"t":"mcq","n":21,"q":"Blank (21)","o":["fancy","hate","interested in","love"],"a":3,"e":""},{"t":"mcq","n":22,"q":"Blank (22)","o":["sad","happy","pleased","boring"],"a":0,"e":""},{"t":"mcq","n":23,"q":"Blank (23)","o":["mind","head","face","mouth"],"a":2,"e":""},{"t":"mcq","n":24,"q":"Blank (24)","o":["forget","remember","regret","miss"],"a":3,"e":""}]}]}]},{"id":"d3_test2","name":"Test for Unit 1, 2, 3 · Câu 25–40","short":"Đề kiểm tra 25–40","tag":"Đề cương 3","intro":"File gốc là \"GV_Review Unit 1-2-3\" (có đáp án tô xanh). Làm hết rồi bấm \"Nộp bài\" để máy chấm.","groups":[{"h":"Câu 25–30. Câu đồng nghĩa, câu từ gợi ý, biển báo.","items":[{"t":"mcq","n":25,"q":"How about going camping on Mount Everest?","o":["What about go camping on Mount Everest?","Let's going camping on Mount Everest.","Why don't we go camping on Mount Everest?","Why don't we going camping on Mount Everest?"],"a":2,"e":""},{"t":"mcq","n":26,"q":"There are 150 students and 10 teachers in my school.","o":["My school have 150 students and 10 teachers.","My school have 150 students or 10 teachers.","My school has 150 students or 10 teachers.","My school has 150 students and 10 teachers."],"a":3,"e":""},{"t":"mcq","n":27,"q":"There / be / some posters / my favourite TV star / the wall.","o":["There are some posters of my favourite TV star on the wall.","There is some poster of my favourite TV star on the wall.","There be some posters about my favourite TV star on wall.","There are some posters about my favourite TV star on the wall."],"a":0,"e":""},{"t":"mcq","n":28,"q":"My dad / usually / drink / coffee / morning.","o":["My dad usually drink coffee in the morning.","My dad usually drinking coffee in the morning.","My dad usually drinks coffee in the morning.","My dad usually drank coffee in the morning."],"a":2,"e":""},{"t":"mcq","n":29,"q":"Biển báo STOP có hình trẻ em qua đường. What does the sign say?","o":["You should slow down and be careful of children on the sidewalk.","You can continue driving but be careful of the children crossing the sidewalk.","Children are not allowed to cross the sidewalk here.","You must stop and allow children to cross the sidewalk."],"a":3,"e":"Biển STOP (có hình trẻ em qua đường) nghĩa là xe phải dừng lại cho trẻ em đi qua."},{"t":"mcq","n":30,"q":"Thông báo có hình burger: “TODAY ONLY – FREE CHIPS WITH EVERY BURGER!”. What does the notice say?","o":["Burgers are free today only.","If you buy a burger, you will get chips for free.","Chips and burgers are free on Saturday only.","Every burger costs the same as chips in this restaurant."],"a":1,"e":"Đáp án đúng theo file gốc là B. Các lựa chọn A, C, D bị che một phần trong ảnh nên đã được soạn lại, nhờ cô đối chiếu."}]},{"h":"Câu 31–36. Read the following passage and choose the correct answer.","passage":"<b>My best friend</b><br>I'm Julie and my best friend is Janet. We're 12 years old and we're in the same class. Both of us are tall and slim. I'm a bit quiet and shy, and Janet is kind and friendly. We like to spend our free time together. At break time, we sometimes play skipping or we just sit and chat. We live in the same building, so we always walk home together and talk about our homework. Janet is very helpful to me. When I'm doing my homework and I don't understand a question, I often call her for help. At weekends, Janet usually wants to go skating in the park or go to the cinema, but I like staying at home and reading comic books. However, we often plan our day together.","sub":[{"h":"Câu 31–36","items":[{"t":"mcq","n":31,"q":"How old are Julie and Janet?","o":["ten","eleven","twelve","thirteen"],"a":2,"e":""},{"t":"mcq","n":32,"q":"What is Janet like?","o":["She is quiet and shy.","She is kind and friendly.","She is serious and strict.","She is funny and lazy."],"a":1,"e":""},{"t":"mcq","n":33,"q":"The word “slim” is OPPOSITE in meaning to ____.","o":["short","fat","thin","heavy"],"a":1,"e":""},{"t":"mcq","n":34,"q":"What do Julie and Janet sometimes do at break time?","o":["Play skipping or sit and chat.","Go skating in the park.","Watch TV together.","Read comic books."],"a":0,"e":""},{"t":"mcq","n":35,"q":"What does Janet usually want to do at weekends?","o":["Stay at home and read.","Go skating or go to the cinema.","Do homework together.","Visit friends in the neighborhood."],"a":1,"e":""},{"t":"mcq","n":36,"q":"What do Julie and Janet often do when walking home?","o":["Sing songs","Talk about their homework","Play games","Go shopping"],"a":1,"e":""}]}]},{"h":"Câu 37–40. Four phrases/sentences have been removed from the text. Choose the option that best fits each blank.","passage":"Jack is my best friend. He is a teacher. (37)____. Every morning, he gets up about 7 o'clock, has breakfast and a cup of coffee. (38)____. The school is far from his home, so he can't walk there. He must go by bus. (39)____. In the afternoon he works until 5 or 5.30 and then he goes home. (40)____. He goes to the cinema or theatre. He is married and he has a son. He loves his family. They are very happy.<br><b>A.</b> He doesn't work on Saturdays or Sundays &nbsp; <b>B.</b> He is teaching in a school in London &nbsp; <b>C.</b> Then he leaves for work &nbsp; <b>D.</b> He has lunch at a restaurant nearby","sub":[{"h":"Câu 37–40","items":[{"t":"mcq","n":37,"q":"Blank (37)","o":["He doesn't work on Saturdays or Sundays","He is teaching in a school in London","Then he leaves for work","He has lunch at a restaurant nearby"],"a":1,"e":""},{"t":"mcq","n":38,"q":"Blank (38)","o":["He doesn't work on Saturdays or Sundays","He is teaching in a school in London","Then he leaves for work","He has lunch at a restaurant nearby"],"a":2,"e":""},{"t":"mcq","n":39,"q":"Blank (39)","o":["He doesn't work on Saturdays or Sundays","He is teaching in a school in London","Then he leaves for work","He has lunch at a restaurant nearby"],"a":3,"e":""},{"t":"mcq","n":40,"q":"Blank (40)","o":["He doesn't work on Saturdays or Sundays","He is teaching in a school in London","Then he leaves for work","He has lunch at a restaurant nearby"],"a":0,"e":""}]}]}]}];
const DC4=[{"id":"d4_lang","name":"Tiết 51 · Language","short":"Từ vựng, ngữ pháp","tag":"Đề cương 4","intro":"Nội dung theo giáo án ôn tập tiết 51–52 (Unit 1–6). Làm hết rồi bấm \"Nộp bài\" để máy chấm, kèm đáp án.","groups":[{"h":"Exercise 1. Choose the best answer.","items":[{"t":"mcq","n":1,"q":"My sister usually ______ to school by bike.","o":["go","goes","going","is go"],"a":1,"e":"Chủ ngữ ngôi thứ ba số ít (My sister) + <i>usually</i> → hiện tại đơn: V-s/es."},{"t":"mcq","n":2,"q":"There ______ a big table in the kitchen.","o":["am","are","is","be"],"a":2,"e":"<i>a big table</i> là danh từ số ít → <i>There is</i>."},{"t":"mcq","n":3,"q":"Look! The boys ______ football in the playground.","o":["play","plays","are playing","is playing"],"a":2,"e":"<i>Look!</i> báo hiệu việc đang xảy ra; <i>The boys</i> số nhiều → <i>are playing</i>."},{"t":"mcq","n":4,"q":"This building is ______ than that one.","o":["tall","taller","tallest","more tall"],"a":1,"e":"Tính từ ngắn so sánh hơn: adj + er + than."},{"t":"mcq","n":5,"q":"You ______ make noise in the library.","o":["must","mustn't","should","can"],"a":1,"e":"Thư viện cần yên tĩnh: điều bị cấm → <i>mustn't</i>."},{"t":"mcq","n":6,"q":"We ______ visit our grandparents at Tet.","o":["should","shouldn't","mustn't","aren't"],"a":0,"e":"Lời khuyên nên làm → <i>should</i>."},{"t":"mcq","n":7,"q":"My bedroom is ______ the bathroom and the kitchen.","o":["next","between","opposite","behind of"],"a":1,"e":"<i>between A and B</i>: ở giữa A và B."},{"t":"mcq","n":8,"q":"Ho Chi Minh City is ______ than my hometown.","o":["big","bigger","biggest","more big"],"a":1,"e":"<i>big</i> là tính từ ngắn → <i>bigger than</i> (gấp đôi phụ âm cuối)."}]},{"h":"Exercise 2. Give the correct form of the verbs.","items":[{"t":"fill","n":1,"q":"My mother (cook) ___ dinner every evening.","a":[["cooks"]],"e":"<i>every evening</i> → hiện tại đơn, ngôi thứ ba số ít."},{"t":"fill","n":2,"q":"Listen! Someone (sing) ___ in the next room.","a":[["is singing"]],"e":"<i>Listen!</i> → hiện tại tiếp diễn: is + V-ing."},{"t":"fill","n":3,"q":"There (be) ___ two pictures on the wall.","a":[["are"]],"e":"<i>two pictures</i> số nhiều → <i>There are</i>."},{"t":"fill","n":4,"q":"We (not/go) ___ to school on Sundays.","a":[["don't go","do not go"]],"e":"Phủ định hiện tại đơn: don't + V."},{"t":"fill","n":5,"q":"My friends (play) ___ basketball at the moment.","a":[["are playing"]],"e":"<i>at the moment</i> → hiện tại tiếp diễn."},{"t":"fill","n":6,"q":"You should (help) ___ your parents with the housework.","a":[["help"]],"e":"<i>should</i> + V nguyên mẫu."},{"t":"fill","n":7,"q":"He (visit) ___ his grandparents every weekend.","a":[["visits"]],"e":"<i>every weekend</i> → hiện tại đơn, thêm -s."},{"t":"fill","n":8,"q":"They mustn't (make) ___ noise in class.","a":[["make"]],"e":"<i>mustn't</i> + V nguyên mẫu."}]}]},{"id":"d4_listen","name":"Tiết 52 · Listening","short":"Nghe (T/F)","tag":"Đề cương 4","intro":"Nội dung theo giáo án ôn tập tiết 51–52 (Unit 1–6). Làm hết rồi bấm \"Nộp bài\" để máy chấm, kèm đáp án. Cô đọc bài nghe hai lần; em có thể đọc bản chữ bên dưới để tự luyện.","groups":[{"h":"Exercise 1. Listen and decide whether the statements are True (T) or False (F).","passage":"<b>Hello! My name is Minh.</b> I live in a small house in the countryside. There are five rooms in my house: a living room, two bedrooms, a kitchen and a bathroom. My school is not far from my house, so I usually walk to school. My favourite subject is English. At Tet, my family usually decorates our house with flowers. We visit our grandparents and enjoy traditional food. I love Tet very much.","items":[{"t":"tf","n":1,"q":"Minh lives in a big house in the city.","a":false,"e":"Minh sống trong <i>a small house in the countryside</i>."},{"t":"tf","n":2,"q":"There are five rooms in his house.","a":true,"e":"Phòng khách, hai phòng ngủ, bếp và phòng tắm: 1 + 2 + 1 + 1 = 5."},{"t":"tf","n":3,"q":"He goes to school by bus.","a":false,"e":"Bạn ấy <i>usually walk to school</i> (đi bộ)."},{"t":"tf","n":4,"q":"His favourite subject is English.","a":true,"e":"<i>My favourite subject is English.</i>"},{"t":"tf","n":5,"q":"His family visits their grandparents at Tet.","a":true,"e":"<i>We visit our grandparents</i> vào dịp Tết."}]}]},{"id":"d4_order","name":"Tiết 52 · Sắp xếp từ","short":"Sắp xếp câu","tag":"Đề cương 4","intro":"Nội dung theo giáo án ôn tập tiết 51–52 (Unit 1–6). Làm hết rồi bấm \"Nộp bài\" để máy chấm, kèm đáp án.","groups":[{"h":"Exercise 3. Rearrange the words to make correct sentences.","items":[{"t":"text","n":1,"q":"usually / I / my homework / do / evening / in the","acc":["I usually do my homework in the evening.","In the evening, I usually do my homework."],"e":"Trạng từ tần suất <i>usually</i> đứng trước động từ thường."},{"t":"text","n":2,"q":"there / my house / rooms / are / four / in","acc":["There are four rooms in my house."],"e":"<i>There are</i> + danh từ số nhiều + nơi chốn."},{"t":"text","n":3,"q":"is / than / my school / bigger / your school","acc":["My school is bigger than your school."],"e":"So sánh hơn tính từ ngắn: S + is + adj-er + than + ..."},{"t":"text","n":4,"q":"should / we / our parents / help","acc":["We should help our parents."],"e":"S + should + V."},{"t":"text","n":5,"q":"mustn't / in class / students / talk","acc":["Students mustn't talk in class."],"e":"S + mustn't + V."}]}]},{"id":"d4_rewrite","name":"Tiết 51 · Viết lại câu","short":"Viết lại câu (tự luyện)","tag":"Đề cương 4","intro":"Nội dung theo giáo án ôn tập tiết 51–52 (Unit 1–6). Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Một ý có thể diễn đạt đúng bằng nhiều cách, nhờ cô xem thêm nhé.","groups":[{"h":"Exercise 3. Rewrite the sentences without changing their meanings.","items":[{"t":"self","n":1,"q":"My house is smaller than your house.<br>→ Your house ___","model":"Your house is bigger than my house."},{"t":"self","n":2,"q":"The garden is behind the house.<br>→ The house ___","model":"The house is in front of the garden."},{"t":"self","n":3,"q":"It is important for us to keep our classroom clean.<br>→ We should ___","model":"We should keep our classroom clean."},{"t":"self","n":4,"q":"There are four people in my family.<br>→ My family ___","model":"My family has four people."}]}],"selfCheck":true},{"id":"d4_read","name":"Tiết 52 · Reading","short":"Đọc hiểu (tự luyện)","tag":"Đề cương 4","intro":"Nội dung theo giáo án ôn tập tiết 51–52 (Unit 1–6). Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Một ý có thể diễn đạt đúng bằng nhiều cách, nhờ cô xem thêm nhé.","groups":[{"h":"Exercise 2. Read the passage and answer the questions.","passage":"<b>Da Nang</b><br>Da Nang is one of the most beautiful cities in Viet Nam. It has many beautiful beaches, modern buildings and interesting places. The people are friendly and helpful. The weather is often hot in summer and cool in winter. Tourists can visit My Khe Beach, Marble Mountains and Ba Na Hills. They can also enjoy delicious local food. I think Da Nang is a wonderful place to live and visit.","items":[{"t":"self","n":1,"q":"Which city is the passage about?","model":"It is about Da Nang."},{"t":"self","n":2,"q":"What are the people like?","model":"They are friendly and helpful."},{"t":"self","n":3,"q":"How is the weather in summer?","model":"It is often hot."},{"t":"self","n":4,"q":"What places can tourists visit?","model":"They can visit My Khe Beach, Marble Mountains and Ba Na Hills."},{"t":"self","n":5,"q":"Can tourists enjoy local food there?","model":"Yes, they can."}]}],"selfCheck":true},{"id":"d4_write","name":"Tiết 52 · Writing & Speaking","short":"Viết đoạn, nói (tự luyện)","tag":"Đề cương 4","intro":"Nội dung theo giáo án ôn tập tiết 51–52 (Unit 1–6). Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Một ý có thể diễn đạt đúng bằng nhiều cách, nhờ cô xem thêm nhé.","groups":[{"h":"Exercise 4. Write a short paragraph (about 50–60 words) about one topic. Câu mẫu bên dưới là gợi ý tham khảo.","items":[{"t":"self","n":1,"q":"<b>Topic 1: My best friend</b> (50–60 từ). Gợi ý: name, age, appearance, personality, why you like him/her.","model":"My best friend is Lan. She is twelve years old. She has long black hair and brown eyes. She is kind, funny and very hard-working. She always helps me with my homework. We often play badminton together after school. I like her because she is friendly and honest."},{"t":"self","n":2,"q":"<b>Topic 2: My house</b> (50–60 từ). Gợi ý: where, how many rooms, favourite room, what is in it, why you like it.","model":"My house is in a small town near Da Nang. There are five rooms: a living room, a kitchen, a bathroom and two bedrooms. My favourite room is my bedroom. There is a bed, a desk and a bookshelf in it. I like my house because it is warm and comfortable."},{"t":"self","n":3,"q":"<b>Topic 3: My Tet holiday</b> (50–60 từ). Gợi ý: when is Tet, before Tet, at Tet, should/shouldn't.","model":"Tet is in January or February. Before Tet, my family cleans the house and buys flowers. At Tet, we visit our grandparents and get lucky money. We eat banh chung and watch fireworks. People should be polite and happy at Tet. They shouldn't quarrel or break things."}]},{"h":"Exercise 5. Work in pairs. Ask and answer questions about the topics.","items":[{"t":"self","n":1,"q":"<b>School:</b> What do you like about your school? What is your favourite subject?","model":"I like my school because the teachers are kind. My favourite subject is English."},{"t":"self","n":2,"q":"<b>House:</b> Where do you live? What is your favourite room?","model":"I live in a small house in the city. My favourite room is the living room."},{"t":"self","n":3,"q":"<b>Friends:</b> Who is your best friend? What is he/she like?","model":"My best friend is Nam. He is tall, funny and friendly."},{"t":"self","n":4,"q":"<b>Neighbourhood:</b> Is your neighbourhood quiet or noisy? What places are there in it?","model":"It is quiet. There is a market, a park and a post office."},{"t":"self","n":5,"q":"<b>Natural wonders:</b> What is your favourite natural wonder? What can visitors do there?","model":"My favourite natural wonder is Ha Long Bay. Visitors can take a boat tour and swim."},{"t":"self","n":6,"q":"<b>Tet:</b> What do you usually do before Tet? What should children do at Tet?","model":"We clean the house and buy flowers. Children should say nice wishes and be polite."}]}],"selfCheck":true}];
const DC5=[{"id":"d5_listen","name":"A. Listening","short":"Nghe (tự luyện)","tag":"Đề tham khảo","intro":"Phần nghe cô mở file riêng, đề không có bản ghi âm hay đáp án. Em ghi câu trả lời khi nghe rồi đối chiếu với đáp án của cô.","groups":[{"h":"I. Listen and write T (True) or F (False).","items":[{"t":"self","n":1,"q":"Lucy studies at a school near her home. (T/F)","model":"Đáp án theo file nghe của cô."},{"t":"self","n":2,"q":"Her classroom is on the second floor. (T/F)","model":"Đáp án theo file nghe của cô."},{"t":"self","n":3,"q":"She has science lessons on Mondays. (T/F)","model":"Đáp án theo file nghe của cô."},{"t":"self","n":4,"q":"Lucy usually plays badminton after school. (T/F)","model":"Đáp án theo file nghe của cô."}]},{"h":"II. Listen and complete each blank with ONE word.","items":[{"t":"self","n":5,"q":"Ben's new house is next to a __________.","model":"Đáp án theo file nghe của cô."},{"t":"self","n":6,"q":"His bedroom is __________ the kitchen.","model":"Đáp án theo file nghe của cô."},{"t":"self","n":7,"q":"There is a __________ on his desk.","model":"Đáp án theo file nghe của cô."},{"t":"self","n":8,"q":"Ben likes his room because it is __________.","model":"Đáp án theo file nghe của cô."}]}],"selfCheck":true},{"id":"d5_lang","name":"B. Language Focus","short":"Từ vựng, ngữ pháp","tag":"Đề tham khảo","intro":"Đề tham khảo giữa HK1, Tiếng Anh 6 (Đề 05, Units 1–3). File gốc không có đáp án nên đáp án do máy soạn thêm, nhờ cô đối chiếu lại. Làm hết rồi bấm \"Nộp bài\".","groups":[{"h":"I. Choose the best answer A, B, C or D.","items":[{"t":"mcq","n":9,"q":"The school library is ______ the computer room and the science lab.","o":["between","on","under","behind"],"a":0,"e":"<i>between A and B</i>: ở giữa."},{"t":"mcq","n":10,"q":"We use a ______ to draw straight lines in maths.","o":["compass","ruler","calculator","notebook"],"a":1,"e":"Thước kẻ (ruler) dùng để kẻ đường thẳng."},{"t":"mcq","n":11,"q":"Our teacher asks us to ______ notes during the lesson.","o":["do","play","take","make"],"a":2,"e":"<i>take notes</i>: ghi chép."},{"t":"mcq","n":12,"q":"There is a ______ in the kitchen to keep food cold.","o":["fridge","wardrobe","pillow","sofa"],"a":0,"e":"Tủ lạnh (fridge)."},{"t":"mcq","n":13,"q":"You can find the plates and cups in the kitchen ______.","o":["cupboard","bookshelf","bed","lamp"],"a":0,"e":"Tủ bếp (cupboard)."},{"t":"mcq","n":14,"q":"Mai always shares her snacks with friends. She is very ______.","o":["kind","confident","lazy","shy"],"a":0,"e":"Chia sẻ đồ ăn → tốt bụng (kind)."},{"t":"mcq","n":15,"q":"Nam is ______: he always thinks of new ideas for class projects.","o":["creative","careful","boring","quiet"],"a":0,"e":"Luôn có ý tưởng mới → sáng tạo (creative)."},{"t":"mcq","n":16,"q":"Choose the word whose underlined vowel sound is different:","o":["c<u>a</u>r","p<u>a</u>rk","c<u>u</u>p","f<u>a</u>ther"],"a":2,"e":"car, park, father có âm /ɑː/; cup có âm /ʌ/."},{"t":"mcq","n":17,"q":"“Would you like to come to my house after school?” – “______”","o":["Yes, I'd love to.","Yes, I do.","No, I am not.","It's on the table."],"a":0,"e":"Đáp lại lời mời: <i>Yes, I'd love to.</i>"},{"t":"mcq","n":18,"q":"These are ______ schoolbags, not ours.","o":["the boys","the boys'","the boy","boys"],"a":1,"e":"Sở hữu cách của danh từ số nhiều tận cùng -s: <i>the boys'</i>."}]},{"h":"II–III. Give the correct form of the words / verbs.","items":[{"t":"fill","n":19,"q":"My sister is very ___; she can make beautiful drawings. (CREATE)","a":[["creative"]],"e":"Tính từ: creative."},{"t":"fill","n":20,"q":"Good ___ is important when working in groups. (COMMUNICATE)","a":[["communication"]],"e":"Danh từ: communication."},{"t":"fill","n":21,"q":"My brother usually ___ (walk) to school with his friends.","a":[["walks"]],"e":"<i>usually</i> → hiện tại đơn, thêm -s."},{"t":"fill","n":22,"q":"Look! The children ___ (decorate) their classroom for the school festival.","a":[["are decorating"]],"e":"<i>Look!</i> → hiện tại tiếp diễn."}]}]},{"id":"d5_read","name":"C. Reading (I–II)","short":"Điền từ, T/F","tag":"Đề tham khảo","intro":"Đề tham khảo giữa HK1, Tiếng Anh 6 (Đề 05, Units 1–3). File gốc không có đáp án nên đáp án do máy soạn thêm, nhờ cô đối chiếu lại. Làm hết rồi bấm \"Nộp bài\".","groups":[{"h":"I. Complete the passage using the words in the box.","passage":"My name is Anna. I have a new bedroom in our house. It is [[1]] to my parents' room. There is a small [[2]] near the window, so I can study there. My room is not very large, but I love it [[3]] it is bright and tidy. My best friend often visits me. She is kind and [[4]].<br><i>(Chỗ trống (1)–(4) ứng với câu 23–26.)</i>","box":["friendly","next","because","desk"],"items":[{"t":"gap","a":"next","e":"<i>next to</i>: bên cạnh."},{"t":"gap","a":"desk","e":"Bàn học (desk) để học bài."},{"t":"gap","a":"because","e":"Chỉ lí do."},{"t":"gap","a":"friendly","e":"<i>kind and friendly</i>."}]},{"h":"II. Read the passage. Write T or F.","passage":"Minh is a new student in class 6A. He is tall and has short black hair. At first, he is quiet because he does not know anyone. His classmate Phong invites him to join the school football club. Minh enjoys football, but he also likes drawing. On Fridays, he stays after school for the art club. Phong is talkative and funny, while Minh is thoughtful and creative. They are different, but they work well together. When Phong forgets his pencil case, Minh lends him a pen. When Minh finds a maths problem difficult, Phong helps him solve it.","items":[{"t":"tf","n":27,"q":"Minh is new to class 6A.","a":true,"e":"<i>Minh is a new student in class 6A.</i>"},{"t":"tf","n":28,"q":"Minh joins the art club on Mondays.","a":false,"e":"Câu gốc: <i>On Fridays</i>, he stays after school for the art club."},{"t":"tf","n":29,"q":"Phong and Minh have exactly the same personality.","a":false,"e":"Phong talkative and funny, Minh thoughtful and creative: <i>They are different</i>."},{"t":"tf","n":30,"q":"The boys help each other at school.","a":true,"e":"Minh lends Phong a pen; Phong helps Minh with maths."}]}]},{"id":"d5_write","name":"C–D. Trả lời câu hỏi, Writing","short":"Viết (tự luyện)","tag":"Đề tham khảo","intro":"Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem đáp án mẫu và tự đối chiếu. File gốc không có đáp án nên đáp án mẫu do máy soạn thêm, nhờ cô xem lại.","groups":[{"h":"C-III & D. Answer the questions (31–32) and Writing (33–38).","items":[{"t":"self","n":31,"q":"Why do you think Minh and Phong become good friends?","model":"Because they help each other and work well together. (Có thể trả lời cách khác, miễn đủ ý.)"},{"t":"self","n":32,"q":"Does Minh enjoy football?","model":"Yes, he does."},{"t":"self","n":33,"q":"The classroom of my sister is on the first floor. (Use the possessive form)","model":"My sister's classroom is on the first floor."},{"t":"self","n":34,"q":"There is a beautiful flower garden in our house. (Rewrite with HAS)","model":"Our house has a beautiful flower garden."},{"t":"self","n":35,"q":"My friend is late for school. (never) (Put the adverb in the correct position)","model":"My friend is never late for school."},{"t":"self","n":36,"q":"The cat is in front of the sofa. (Rewrite using BEHIND without changing the meaning)","model":"The sofa is behind the cat."},{"t":"self","n":37,"q":"Look! / my classmates / prepare / a surprise party / for our teacher / now. (Complete the sentence; 2 required verb/structure elements)","model":"Look! My classmates are preparing a surprise party for our teacher now."},{"t":"self","n":38,"q":"What makes a good friend? Give TWO ideas in English.","model":"A good friend is kind and helpful. A good friend always shares and listens to you."}]}],"selfCheck":true}];
