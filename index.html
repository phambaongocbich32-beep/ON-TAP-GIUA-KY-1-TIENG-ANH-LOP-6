, clocks, helps); sau âm hữu thanh đọc /z/ (beds)."},{"t":"mcq","n":11,"q":"Underlined sound:","o":["s<u>ch</u>ool","<u>ch</u>ess","kit<u>ch</u>en","tea<u>ch</u>ing"],"a":0,"e":"school đọc /k/; chess, kitchen, teaching đọc /tʃ/."},{"t":"mcq","n":12,"q":"Underlined sound:","o":["st<u>u</u>dent","s<u>u</u>bject","<u>u</u>niform","comp<u>u</u>ter"],"a":1,"e":"subject có /ʌ/; các từ còn lại có /juː/."}]},{"h":"Choose the best answer A, B, C or D.","items":[{"t":"mcq","n":13,"q":"Huy is very lazy. He __________ does his homework at home.","o":["always","never","usually","often"],"a":1,"e":"Lazy (lười) → <i>never</i> (không bao giờ)."},{"t":"mcq","n":14,"q":"We always look smart in __________ new uniforms.","o":["your","their","our","my"],"a":2,"e":"Chủ ngữ <i>We</i> → tính từ sở hữu <i>our</i>."},{"t":"mcq","n":15,"q":"How __________ are there in the picture?","o":["very cars","many car","many cars","much cars"],"a":2,"e":"<i>How many + danh từ số nhiều</i>."},{"t":"mcq","n":16,"q":"My mother always makes dinner in the __________.","o":["kitchen","living room","bedroom","bathroom"],"a":0,"e":"Nấu bữa tối ở phòng bếp (kitchen)."},{"t":"mcq","n":17,"q":"Chúc: Is there a big yard in __________ your house? – Phương: Yes, there is.","o":["behind","front of","under","next to"],"a":1,"e":"<i>in front of</i>: ở phía trước."},{"t":"mcq","n":18,"q":"Tom is very ___________. He is very nice to his parents and friends.","o":["funny","clever","hard working","kind"],"a":3,"e":"Tốt với mọi người → <i>kind</i> (tốt bụng)."},{"t":"mcq","n":19,"q":"I like computers. That’s why I like _________.","o":["I.T","history","P.E","math"],"a":0,"e":"I.T (Tin học) liên quan đến máy tính."},{"t":"mcq","n":20,"q":"I have two tests tomorrow, but I don’t have much time to __________.","o":["make","have","do","study"],"a":3,"e":"<i>study</i>: học bài."}]}]},{"id":"g6_read","name":"C. Reading","short":"Đọc hiểu","tag":"Đề GHK I lớp 6","intro":"Đọc hai đoạn văn rồi chọn đáp án. Bấm \"Nộp bài\" để chấm.","groups":[{"h":"Read the passage and choose the word or phrase that best fits each gap.","passage":"My new school is in a quiet place not far (21) ______ the city centre. It has three buildings and a large yard. This year there (22) ______ 26 classes with more than 500 students in my school. Most students are hard-working and friendly. The school (23) ______ about 40 teachers. They are helpful and kind. At school, we study many (24) ______: English, arts, maths, literature. I like English, so I join the English speaking club. I really love my school because it is a good school.","sub":[{"h":"Questions 21–24","items":[{"t":"mcq","n":21,"q":"(21)","o":["from","to","of","x"],"a":0,"e":"<i>far from</i>: xa khỏi."},{"t":"mcq","n":22,"q":"(22)","o":["is","are","am","be"],"a":1,"e":"<i>there are + 26 classes</i> (số nhiều)."},{"t":"mcq","n":23,"q":"(23)","o":["is","have","are","has"],"a":3,"e":"<i>The school has…</i>: trường có."},{"t":"mcq","n":24,"q":"(24)","o":["clubs","lessons","subjects","activities"],"a":2,"e":"English, arts, maths, literature là các môn học (subjects)."}]}]},{"h":"Read the passage and choose the option that best answers each question.","passage":"My name’s Quan. One of my best friends is Phong. He is my classmate and we always go to school together. Phong is twelve. He’s tall and thin. He has short curly black hair and brown eyes. Phong is funny and friendly. He is also very sporty and plays football very well. We often play football at the weekend. He loves listening to music and playing the guitar. Phong doesn’t like computer games. Phong is a very good student. His favourite subject is Math. He’s not good at science but he studies hard (chăm chỉ) to pass (vượt qua) it.","sub":[{"h":"Questions 25–28","items":[{"t":"mcq","n":25,"q":"What is the passage about?","o":["Quan’s teacher","Quan’s brother","Quan’s father","Quan’s friend"],"a":3,"e":"<i>One of my best friends is Phong.</i>"},{"t":"mcq","n":26,"q":"How old is Phong?","o":["ten","eleven","twelve","thirteen"],"a":2,"e":"<i>Phong is twelve.</i>"},{"t":"mcq","n":27,"q":"What does Phong look like?","o":["tall and thin","short and thin","tall and fat","tall and slim"],"a":0,"e":"<i>He’s tall and thin.</i>"},{"t":"mcq","n":28,"q":"Which is NOT true about Phong?","o":["Phong is Quan’s classmate.","Phong is good at science.","Phong loves playing the guitar.","Phong has short curly black hair and brown eyes."],"a":1,"e":"Bài viết: <i>He’s not good at science.</i>"}]}]}]},{"id":"g6_write","name":"D. Tự luận (động từ, sắp xếp câu)","short":"Động từ, sắp xếp câu","tag":"Đề GHK I lớp 6","intro":"Gõ đáp án vào ô rồi bấm \"Nộp bài\". Máy bỏ qua chữ hoa, chữ thường và dấu câu.","groups":[{"h":"I. Write the correct form of the verbs in brackets.","items":[{"t":"fill","n":1,"q":"Loan (go) ___ home at 4 pm every day.","a":[["goes"]],"e":"Chủ ngữ ngôi thứ ba số ít, thì hiện tại đơn: <i>goes</i>."},{"t":"fill","n":2,"q":"I (not have) ___ English on Wednesday.","a":[["don't have","do not have"]],"e":"Thì hiện tại đơn, chủ ngữ <i>I</i>: <i>don’t have</i>."},{"t":"fill","n":3,"q":"___ they (talk) ___ about their new friends now?","a":[["Are"],["talking"]],"e":"Có <i>now</i> → hiện tại tiếp diễn: <i>Are they talking</i>."},{"t":"fill","n":4,"q":"Nam (play) ___ football at the moment.","a":[["is playing"]],"e":"<i>at the moment</i> → hiện tại tiếp diễn: <i>is playing</i>."}]},{"h":"II. Reorder the following words to make meaningful sentences.","items":[{"t":"text","n":1,"q":"likes / She / her friends. / helping /","acc":["She likes helping her friends."],"e":""},{"t":"text","n":2,"q":"grandfather’s / is in / My / the / house / countryside. /","acc":["My grandfather's house is in the countryside."],"e":""},{"t":"text","n":3,"q":"She / a round face / black hair. / and long / has /","acc":["She has a round face and long black hair."],"e":""},{"t":"text","n":4,"q":"rooms / in / How many / are there / house? / your /","acc":["How many rooms are there in your house?"],"e":""}]}]},{"id" const V={unit:'all',topic:'all',only:false,mode:'cards',quiz:null,dir:'en2vi'};
function vFiltered(){return FLAT.filter(w=>(V.unit==='all'||w.unit===+V.unit)&&(V.topic==='all'||w.topic===V.topic)&&(!V.only||!isKnown(w.en)))}
function topicsOf(u){const s=[];FLAT.forEach(w=>{if((u==='all'||w.unit===+u)&&s.indexOf(w.topic)<0)s.push(w.topic)});return s}
const ICON='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function tileHTML(w){
  const k=isKnown(w.en);
  const en=w.en.replace(/"/g,'&quot;');
  return `<article class="wcard u${w.unit}${k?' known':''}">
    <div class="wtop"><span class="wunit">Unit ${w.unit}</span><span class="pos">${w.pos}</span></div>
    <div class="wmain"><div class="wword"><div class="en">${w.en}</div><div class="ipa">${w.ipa}</div></div>
    <button type="button" class="spk" data-act="speak" data-t="${en}" aria-label="Nghe phát âm ${en}">${ICON}</button></div>
    <div class="vi">${w.vi}</div>
    <div class="wex"><div class="exen">${w.ex}</div><div class="exvi">${w.exvi}</div></div>
    <button type="button" class="kn${k?' on':''}" data-act="known" data-en="${en}" aria-pressed="${k}">${k?'✓ Đã thuộc':'Đánh dấu đã thuộc'}</button></article>`;
}
function listHTML(list){
  const tp=[];list.forEach(w=>{if(tp.indexOf(w.unit+'|'+w.topic)<0)tp.push(w.unit+'|'+w.topic)});
  return tp.map(key=>{const [u,t]=key.split('|');const ws=list.filter(w=>w.unit===+u&&w.topic===t);
    return `<h3 class="topic">Unit ${u} · ${t}</h3><div class="tbl card" style="padding:0"><table class="vt"><tr><th>Từ</th><th>Phiên âm</th><th>Loại</th><th>Nghĩa</th><th class="n">Nghe</th></tr>${ws.map(w=>`<tr><td><b>${w.en}</b></td><td class="ipa">${w.ipa}</td><td>${w.pos}</td><td>${w.vi}</td><td class="n"><button type="button" class="spk sm" data-act="speak" data-t="${w.en.replace(/"/g,'&quot;')}" aria-label="Nghe ${w.en.replace(/"/g,'')}">${ICON}</button></td></tr>`).join('')}</table></div>`}).join('');
}
function renderVocab(){
  const el=$('#tab-tu-vung');
  const list=vFiltered();
  const done=FLAT.filter(w=>isKnown(w.en)).length;
  let body='';
  if(V.mode==='list'){body=list.length?listHTML(list):'<div class="card"><p><b>Không có từ nào ở bộ lọc này.</b></p></div>'}
  else if(V.mode==='cards'){
    if(!list.length)body='<div class="card"><p><b>Không có từ nào ở bộ lọc này.</b> Em đã thuộc hết rồi, hoặc hãy đổi bộ lọc.</p></div>';
    else{
      const tp=[];list.forEach(w=>{if(tp.indexOf(w.unit+'|'+w.topic)<0)tp.push(w.unit+'|'+w.topic)});
      body=tp.map(key=>{const [u,t]=key.split('|');const ws=list.filter(w=>w.unit===+u&&w.topic===t);
        return `<h3 class="topic">Unit ${u} · ${t}</h3><div class="vgrid">${ws.map(tileHTML).join('')}</div>`}).join('');
    }
  }else body=quizHTML();
  const units=[['all','Tất cả'],['1','Unit 1'],['2','Unit 2'],['3','Unit 3'],['4','Unit 4'],['5','Unit 5'],['6','Unit 6']];
  el.innerHTML=`
  <h2 class="sec">Từ vựng Unit 1–6</h2>
  <p class="sub">Nghĩa và ví dụ hiện sẵn trên mỗi thẻ. Bấm nút loa để nghe phát âm, bấm "Đánh dấu đã thuộc" khi đã nhớ từ.</p>
  <div class="card filters">
    <div class="row" role="group" aria-label="Chọn Unit">${units.map(u=>`<button type="button" class="chip" data-act="unit" data-v="${u[0]}" aria-pressed="${V.unit===u[0]}">${u[1]}</button>`).join('')}</div>
    <div class="row" role="group" aria-label="Chọn chủ đề"><button type="button" class="chip" data-act="topic" data-v="all" aria-pressed="${V.topic==='all'}">Mọi chủ đề</button>${topicsOf(V.unit).map(t=>`<button type="button" class="chip" data-act="topic" data-v="${t}" aria-pressed="${V.topic===t}">${t}</button>`).join('')}</div>
    <div class="row">
      <button type="button" class="chip" data-act="mode" data-v="cards" aria-pressed="${V.mode==='cards'}">Thẻ từ</button>
      <button type="button" class="chip" data-act="mode" data-v="list" aria-pressed="${V.mode==='list'}">Bảng từ</button>
      <button type="button" class="chip" data-act="mode" data-v="quiz" aria-pressed="${V.mode==='quiz'}">Đố nhanh</button>

      <span class="sub">Đã thuộc ${done}/${FLAT.length} từ · đang hiển thị ${list.length} từ</span>
    </div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(done/FLAT.length*100)}%"></i></div>
  </div>
  ${body}`;
}
function startQuiz(){
  let pool=vFiltered();if(pool.length<4)pool=FLAT.filter(w=>V.unit==='all'||w.unit===+V.unit);if(pool.length<4)pool=FLAT;
  const list=shuffle(pool).slice(0,10);
  V.quiz={list:list.map(w=>{
    const others=shuffle(FLAT.filter(x=>x.en!==w.en&&x.vi!==w.vi)).slice(0,3);
    return {w:w,opts:shuffle([w].concat(others)),picked:-1};
  }),i:0,score:0,wrong:[],done:false};
}
function quizHTML(){
  if(!V.quiz)startQuiz();
  const q=V.quiz;
  const dirBtns=`<div class="row"><button type="button" class="chip" data-act="dir" data-v="en2vi" aria-pressed="${V.dir==='en2vi'}">Anh → Việt</button><button type="button" class="chip" data-act="dir" data-v="vi2en" aria-pressed="${V.dir==='vi2en'}">Việt → Anh</button></div>`;
  if(q.done){
    const pct=Math.round(q.score/q.list.length*100);
    return `<div class="card"><h3>Kết quả đố nhanh</h3><p class="score" style="font-family:var(--f-display);font-size:36.5px;margin:6px 0">${q.score}/${q.list.length}</p>
    <p>${pct>=80?'Rất tốt! Em nhớ từ khá chắc rồi.':pct>=50?'Khá ổn. Ôn lại các từ sai bên dưới nhé.':'Đừng lo, lật thẻ ôn thêm rồi đố lại nhé.'}</p>
    ${q.wrong.length?`<h4>Các từ cần ôn lại</h4><ul class="exs">${q.wrong.map(w=>`<li><b>${w.en}</b> ${w.ipa} = ${w.vi}</li>`).join('')}</ul>`:''}
    <div class="actions"><button type="button" class="btn" data-act="qrestart">Đố lại</button>${q.wrong.length?'<button type="button" class="btn ghost" data-act="qreview">Xem lại thẻ các từ sai</button>':''}</div></div>`;
  }
  const cur=q.list[q.i];const w=cur.w;
  const prompt=V.dir==='en2vi'?`<div class="en">${w.en}</div><div class="ipa">${w.ipa}</div>`:`<div class="vi">${w.vi}</div><div class="hint">Chọn từ tiếng Anh đúng</div>`;
  const opts=cur.opts.map((o,k)=>{
    const label=V.dir==='en2vi'?o.vi:o.en;
    let cls='qz-opt';if(cur.picked>=0){if(o.en===w.en)cls+=' ok';else if(cur.picked===k)cls+=' no'}
    return `<button type="button" class="${cls}" data-act="qpick" data-k="${k}" ${cur.picked>=0?'disabled':''}>${label}</button>`;
  }).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">Câu ${q.i+1}/${q.list.length} · Đúng ${q.score}</span>${dirBtns}</div>
  <div style="text-align:center;margin:14px 0">${prompt}</div><div class="qz-opts">${opts}</div>
  ${cur.picked>=0?`<div class="actions"><button type="button" class="btn" data-act="qnext">${q.i+1<q.list.length?'Câu tiếp':'Xem kết quả'}</button><button type="button" class="btn ghost" data-act="speak" data-t="${w.en}">Nghe</button></div><p class="exen" style="margin-top:8px">${w.ex}</p>`:''}</div>`;
}

function norm(s){

}

  }else if(it.t==='tf'){
    body=`<div class="q-text">${it.q}</div><div class="tfs"><label class="choice"><input type="radio" name="${key}" value="T"><span><b>T</b> (True)</span></label><label class="choice"><input type="radio" name="${key}" value="F"><span><b>F</b> (False)</span></label></div>`;
  }else if(it.t==='ltf'){
    body=`<div class="q-text">${it.q}</div><div class="tfs"><label class="choice"><input type="radio" name="${key}" value="T"><span><b>T</b> (True)</span></label><label class="choice"><input type="radio" name="${key}" value="F"><span><b>F</b> (False)</span></label></div>`;
  }else if(it.t==='lfill'){
    body=`<div class="q-text">${fillBlanks(it.q)}</div>`;
  }else if(it.t==='fill'){
    body=`<div class="q-text">${fillBlanks(it.q)}</div>`;
  }else if(it.t==='open'||it.t==='self'){
    body=`<div class="q-text">${it.q}</div><textarea class="txt" id="${key}" rows="2" autocomplete="off" spellcheck="false" aria-label="Câu trả lời"></textarea>`;
  }else{
    body=`<div class="q-text">${it.q}</div><input type="text" class="txt" id="${key}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu trả lời">`;
  }
  return `<div class="q" id="q-${key}" data-key="${key}"><span class="num">${num}</span><div class="q-body">${body}<div class="fb" hidden></div></div></div>`;
}
function passageHTML(key,g){
  let html=g.passage.replace(/\[\[(\d)\]\]/g,(m,n)=>{
    const opts=['<option value="">...</option>'].concat((g.box||[]).map(w=>`<option value="${w}">${w}</option>`));
    return `<select class="gap" id="${key}_${+n-1}" aria-label="chỗ trống ${n}">${opts.join('')}</select><sup>(${n})</sup>`;
  });
  return `<div class="passage">${html}</div>`;
}
function groupHTML(sec,gi,g){
  const key0=`${sec.id}_${gi}`;
  let out=`<div class="group"><h3>${g.h}</h3>`;
  if(g.box)out+=`<div class="box" aria-label="Từ cho sẵn">${shuffle(g.box).map(w=>`<span>${w}</span>`).join('')}</div>`;
  if(g.passage&&!g.sub)out+=passageHTML(key0,g);
  if(g.passage&&g.sub)out+=`<div class="passage">${g.passage}</div>`;
  if(g.sub){
    g.sub.forEach((sg,si)=>{
      out+=`<h3 style="margin-top:18px">${sg.h}</h3>`+sg.items.map((it,ii)=>itemHTML(sec,`${key0}_${si}_${ii}`,it,it.n!==undefined?it.n:ii+1)).join('');
    });
  }else if(g.items&&g.items[0].t==='gap'){
    out+=`<div id="gapfb-${key0}"></div>`;
  }else if(g.items){
    out+=g.items.map((it,ii)=>itemHTML(sec,`${key0}_${ii}`,it,it.n!==undefined?it.n:ii+1)).join('');
  }
  return out+'</div>';
}
function secHTML(sec){
  const graded=!sec.selfCheck;
  return `<div class="card"><span class="tag">${sec.tag}</span><h3>${sec.name}</h3><p class="sub">${sec.intro}</p>${sec.audio?`<div class="audio-box"><b>File nghe</b><audio controls preload="none" src="${sec.audio}"></audio><small>Nếu không phát được, kiểm tra file ${sec.audio} đã được tải lên cùng thư mục với index.html.</small></div>`:''}</div>
  <div class="summary" data-summary hidden></div>
  ${sec.groups.map((g,gi)=>groupHTML(sec,gi,g)).join('')}
  <div class="actions">${sec.id==='listen'?'':`<button type="button" class="btn" data-act="check" data-sec="${sec.id}">${graded?'Nộp bài':'Kiểm tra'}</button>`}<button type="button" class="btn ghost" data-act="reset" data-sec="${sec.id}">Làm lại</button></div>`;
}
function renderSet(k){
  const S=SETS[k];const el=$(S.el);
  el.innerHTML=`<h2 class="sec">${S.title}</h2>
  <p class="sub">${S.desc}</p>
  <div class="card"><div class="row" style="justify-content:space-between"><div><b>Tiến độ</b> <span class="sub" id="overall-${k}"></span></div></div><div class="bar" style="margin-top:8px" aria-hidden="true"><i id="overallbar-${k}" style="width:0%"></i></div></div>
  <div class="pnav" role="group" aria-label="Chọn phần bài tập" id="pnav-${k}"></div>
  ${S.ex.map(x=>`<div class="sec-pane" data-pane="${x.id}" ${x.id===S.cur?'':'hidden'}>${secHTML(x)}</div>`).join('')}`;
  updatePnav(k);
}
function renderPractice(){Object.keys(SETS).forEach(renderSet)}
function updatePnav(k){
  const S=SETS[k];const nav=$('#pnav-'+k);if(!nav)return;
  nav.innerHTML=S.ex.map(x=>{
    const b=best[x.id];
    const sub=x.selfCheck?'tự luyện':(b?`tốt nhất ${b.s}/${b.t}`:'chưa làm');
    return `<button type="button" class="${b?'done':''}" data-act="sec" data-sec="${x.id}" aria-current="${x.id===S.cur}">${x.name}<small>${x.short} · ${sub}</small></button>`;
  }).join('');
  const T=countGraded(S.ex);let sc=0;S.ex.forEach(x=>{if(x.selfCheck)return;const b=best[x.id];if(b)sc+=b.s;});
  $('#overall-'+k).textContent=`· điểm tốt nhất mỗi phần: ${String(sc).replace('.',',')}/${T} câu`;
  $('#overallbar-'+k).style.width=Math.round(sc/T*100)+'%';
}
function setSec(id){
  const k=SETOF[id];const S=SETS[k];
  S.cur=id;sset(S.sk,id);
  $$('.sec-pane',$(S.el)).forEach(p=>{p.hidden=(p.dataset.pane!==id)});
  updatePnav(k);
}

function gradeText(it,val){
  const v=norm(val);
  if(!v)return {s:0,blank:true};
  const acc=it.acc.map(norm);
  if(acc.indexOf(v)>=0)return {s:1};
  if(it.kw&&it.kw.every(g=>g.some(k=>v.indexOf(norm(k))>=0)))return {s:.5};
  return {s:0};
}
function feedback(box,res,it,ansText){
  const st=res.blank?['b','Chưa trả lời']:res.s===1?['g','Chính xác!']:res.s>0?['p','Gần đúng (được 0,5 điểm)']:['b','Chưa đúng'];
  let h=`<div class="st ${st[0]}">${res.s===1?'✓':res.s>0?'~':'✗'} ${st[1]}</div>`;
  if(res.s<1&&ansText)h+=`<div class="ans"><b>Đáp án:</b> ${ansText}</div>`;
  if(res.s>0&&res.s<1)h+=`<div class="ans">Đúng ý rồi, nhưng chưa đủ câu hoặc chưa đúng dạng đáp án mẫu.</div>`;
  if(it.e)h+=`<div class="why"><b>Giải thích:</b> ${it.e}</div>`;
  if(it.g&&res.s<1){const gg=GRAMMAR.find(x=>x.id===it.g);if(gg)h+=`<div><button type="button" class="lnk" data-act="gopick" data-id="${gg.id}">Xem lại bài: ${gg.title}</button></div>`}
  box.innerHTML=h;box.hidden=false;
}
function markQ(q,res){q.classList.remove('ok2','bad2','part2');q.classList.add(res.s===1?'ok2':res.s>0?'part2':'bad2')}
function lockPane(pane){$$('input,select,textarea',pane).forEach(x=>{x.disabled=true})}

function checkSec(id){
  const sec=SECBY[id];const pane=$(`.sec-pane[data-pane="${id}"]`);
  if(pane.dataset.locked)return;
  let score=0,total=0;const wrongG={};
  const tally=(res,it)=>{total++;score+=res.s;if(res.s<1&&it.g)wrongG[it.g]=1};
  const doItem=(key,it)=>{
    const q=$('#q-'+key,pane);if(!q)return;const box=$('.fb',q);let res,ans='';
    if(it.t==='mcq'){
      const r=$(`input[name="${key}"]:checked`,q);const v=r?+r.value:-1;
      res={s:v===it.a?1:0,blank:v<0};ans=`${'ABCD'[it.a]}. ${strip(it.o[it.a])}`;
    }else if(it.t==='tf'){
      const r=$(`input[name="${key}"]:checked`,q);const v=r?r.value:'';
      res={s:(v==='T')===it.a&&v?1:0,blank:!v};ans=it.a?'T (True)':'F (False)';
    }else if(it.t==='fill'){
      const ins=$$('input[data-b]',q);let ok=0,any=false;
      ins.forEach((inp,i)=>{const v=norm(inp.value);if(v)any=true;const good=it.a[i].map(norm).indexOf(v)>=0;if(good)ok++;inp.style.borderColor=good?'var(--good)':'var(--bad)';inp.style.background=good?'var(--good-bg)':'var(--bad-bg)'});
      res={s:ok/ins.length,blank:!any};ans=esc(it.a.map(x=>x[0]).join(' · ').replace(/'/g,'’'));
    }else if(it.t==='text'){
      res=gradeText(it,$('#'+key,q).value);
      ans=esc(sec.id==='write'?pretty(it.acc[0]):it.acc[0]);
    }
    markQ(q,res);feedback(box,res,it,ans);tally(res,it);
  };
  sec.groups.forEach((g,gi)=>{
    const key0=`${sec.id}_${gi}`;
    if(g.sub){g.sub.forEach((sg,si)=>sg.items.forEach((it,ii)=>doItem(`${key0}_${si}_${ii}`,it)))}
    else if(g.items[0].t==='gap'){
      const wrap=$('#gapfb-'+key0,pane);let html='<ul class="exs">';
      g.items.forEach((it,ii)=>{
        const sel=$('#'+key0+'_'+ii,pane);const v=sel?sel.value:'';const ok=v===it.a;
        const res={s:ok?1:0,blank:!v};tally(res,it);
        if(sel){sel.style.borderColor=ok?'var(--good)':'var(--bad)';sel.style.background=ok?'var(--good-bg)':'var(--bad-bg)'}
        html+=`<li><span class="${ok?'ok':'no'}">(${ii+1}) ${ok?'✓ Chính xác':(v?'✗ Chưa đúng':'✗ Chưa trả lời')}</span>${ok?'':` · Đáp án: <b>${it.a}</b>`} · ${it.e}</li>`;
      });
      wrap.innerHTML=html+'</ul>';
    }else g.items.forEach((it,ii)=>doItem(`${key0}_${ii}`,it));
  });
  lockPane(pane);pane.dataset.locked='1';
  const pct=total?Math.round(score/total*100):0;
  const msg=pct>=90?'Xuất sắc! Em nắm rất chắc phần này.':pct>=70?'Khá tốt! Xem lại vài câu sai là hoàn hảo.':pct>=50?'Tạm ổn. Đọc lại bài giảng rồi làm lại nhé.':'Đừng nản. Xem bài giảng bên dưới rồi bấm "Làm lại".';
  const links=Object.keys(wrongG).map(k=>{const gg=GRAMMAR.find(x=>x.id===k);return gg?`<button type="button" class="chip" data-act="gopick" data-id="${gg.id}">Ôn lại: ${gg.title}</button>`:''}).join('');
  const sm=$('[data-summary]',pane);
  sm.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="score">${String(score).replace('.',',')}/${total}</div><div class="sub">${pct}% · quy đổi ${(Math.round(score/total*100)/10).toFixed(1).replace('.',',')} điểm</div></div><div style="max-width:40ch"><b>${msg}</b></div></div>${links?`<div class="row" style="margin-top:10px">${links}</div>`:''}`;
  sm.hidden=false;
  if(!best[id]||score>best[id].s)best[id]={s:score,t:total};
  sset('best',best);updatePnav();
  try{sm.scrollIntoView({behavior:reduce()?'auto':'smooth',block:'start'})}catch(e){}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function pretty(s){
  s=s.replace(/\b(nam|lan|linh|mai)\b/g,m=>m[0].toUpperCase()+m.slice(1)).replace(/\btv\b/g,'TV');
  s=s.replace(/^look /,'Look! ');
  s=s.replace(/^./,c=>c.toUpperCase()).replace(/^(Look! )(.)/,(m,a,b)=>a+b.toUpperCase());
  return s+(/^how many/i.test(s)?'?':'.');
}
function checkOpen(){
  const sec=SECBY.open;const pane=$('.sec-pane[data-pane="open"]');
  sec.groups[0].items.forEach((it,ii)=>{
    const key=`open_0_${ii}`;const q=$('#q-'+key,pane);const v=$('#'+key,q).value.trim();const box=$('.fb',q);
    const words=v.split(/\s+/).filter(Boolean).length;
    const checks=[
      [words>=3,'viết câu đầy đủ (từ 3 từ trở lên)'],
      [/^[A-Z]/.test(v),'viết hoa chữ cái đầu câu'],
      [/[.!?]$/.test(v),'có dấu chấm hoặc dấu hỏi ở cuối câu'],
      [it.re.test(v),it.reHint]
    ];
    const okAll=v&&checks.every(c=>c[0]);
    q.classList.remove('ok2','bad2','part2');q.classList.add(!v?'bad2':okAll?'ok2':'part2');
    box.innerHTML=(v?`<ul class="chk">${checks.map(c=>`<li class="${c[0]?'':'x'}">${c[1]}</li>`).join('')}</ul>`:'<div class="st b">✗ Chưa trả lời</div>')+`<div class="ans"><b>Câu mẫu:</b> ${it.model}</div>`;
    box.hidden=false;
  });
  const sm=$('[data-summary]',pane);sm.innerHTML='<b>Đã kiểm tra các lỗi cơ bản.</b> Câu trả lời về bản thân có thể khác câu mẫu mà vẫn đúng, miễn là đủ câu và đúng ngữ pháp. Nhờ cô giáo xem thêm nhé.';sm.hidden=false;
}
function checkSelf(id){
  const sec=SECBY[id];const pane=$(`.sec-pane[data-pane="${id}"]`);let n=0,filled=0;
  sec.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const key=`${id}_${gi}_${ii}`;const q=$('#q-'+key,pane);if(!q)return;
    const v=$('#'+key,q).value.trim();const box=$('.fb',q);n++;if(v)filled++;
    q.classList.remove('ok2','bad2','part2');q.classList.add(v?'part2':'bad2');
    box.innerHTML=(v?'':'<div class="st b">✗ Chưa trả lời</div>')+`<div class="ans"><b>Câu mẫu:</b> ${it.model}</div>`;box.hidden=false;
  }));
  const sm=$('[data-summary]',pane);
  sm.innerHTML=`<b>Em đã viết ${filled}/${n} câu.</b> So câu của em với câu mẫu. Một ý có thể diễn đạt đúng bằng nhiều cách, nên nhờ cô giáo xem thêm nhé.`;sm.hidden=false;
  try{sm.scrollIntoView({behavior:reduce()?'auto':'smooth',block:'start'})}catch(e){}
}
function resetSec(id){
  const pane=$(`.sec-pane[data-pane="${id}"]`);const sec=SECBY[id];
  pane.innerHTML=secHTML(sec);delete pane.dataset.locked;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go]');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  const a=t.dataset.act;
  if(a==='speak'){e.stopPropagation();speak(t.dataset.t);return}
  if(a==='flip'){const on=t.classList.toggle('flipped');t.setAttribute('aria-pressed',on);return}
  if(a==='known'){e.stopPropagation();const en=t.dataset.en;setKnown(en,!isKnown(en));
    if(V.only&&isKnown(en)){renderVocab();return}
    const card=t.closest('.wcard');const k=isKnown(en);
    t.classList.toggle('on',k);t.textContent=k?'✓ Đã thuộc':'Đánh dấu đã thuộc';t.setAttribute('aria-pressed',k);
    if(card)card.classList.toggle('known',k);
    const done=FLAT.filter(w=>isKnown(w.en)).length;const sp=$('#tab-tu-vung .filters .sub');if(sp)sp.textContent=`Đã thuộc ${done}/${FLAT.length} từ`;const bar=$('#tab-tu-vung .filters .bar>i');if(bar)bar.style.width=Math.round(done/FLAT.length*100)+'%';
    return}
  if(a==='unit'){V.unit=t.dataset.v;V.topic='all';V.quiz=null;renderVocab();return}
  if(a==='topic'){V.topic=t.dataset.v;V.quiz=null;renderVocab();return}
  if(a==='only'){V.only=!V.only;V.quiz=null;renderVocab();return}
  if(a==='mode'){V.mode=t.dataset.v;V.quiz=null;renderVocab();return}
  if(a==='dir'){V.dir=t.dataset.v;renderVocab();return}
  if(a==='qpick'){const cur=V.quiz.list[V.quiz.i];if(cur.picked>=0)return;cur.picked=+t.dataset.k;
    const ok=cur.opts[cur.picked].en===cur.w.en;if(ok)V.quiz.score++;else{V.quiz.wrong.push(cur.w);setKnown(cur.w.en,false)}
    renderVocab();return}
  if(a==='qnext'){if(V.quiz.i+1<V.quiz.list.length)V.quiz.i++;else V.quiz.done=true;renderVocab();return}
  if(a==='qrestart'){V.quiz=null;renderVocab();return}
  if(a==='qreview'){V.mode='cards';V.only=true;V.quiz=null;renderVocab();return}
  if(a==='gpick'){curG=t.dataset.id;sset('gcur',curG);renderGrammar();try{window.scrollTo(0,0)}catch(x){}return}
  if(a==='gopick'){curG=t.dataset.id;sset('gcur',curG);renderGrammar();go('ngu-phap');return}
  if(a==='gopractice'){const id=t.dataset.sec;if(SECBY[id])setSec(id);go(SETOF[id]||'lam-bai');return}
  if(a==='sec'){setSec(t.dataset.sec);return}
  if(a==='check'){const id=t.dataset.sec;const sc=SECBY[id];if(id==='open')checkOpen();else if(sc.groups[0].items&&sc.groups[0].items[0].t==='self')checkSelf(id);else checkSec(id);return}
  if(a==='reset'){resetSec(t.dataset.sec);return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.tile[data-act="flip"]')){e.preventDefault();e.target.click()}
});
window.addEventListener('hashchange',route);

renderStart();renderVocab();renderGrammar();renderPractice();route();
})();
</script>
