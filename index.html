]],"e":"Đáp án: <b>rough</b>."},{"t":"fill","n":8,"q":"The houses with ___ numbers are on this side. (odd)","a":[["even"]],"e":"Đáp án: <b>even</b>."},{"t":"fill","n":9,"q":"The food in that restaurant is very ___. (cheap)","a":[["expensive"]],"e":"Đáp án: <b>expensive</b>."},{"t":"fill","n":10,"q":"They live in a ___ house in the country. (big)","a":[["small"]],"e":"Đáp án: <b>small</b>."}]},{"h":"II. Choose the correct answers A, B, C, or D to finish the sentences.","items":[{"t":"mcq","n":1,"q":"I love my neighbour hood because it is _____ . There are not many cars.","o":["peaceful","crowded","expensive","noisy"],"a":0,"e":"Đáp án đúng: <b>A</b>. peaceful"},{"t":"mcq","n":2,"q":"The food here is more _____ and cheaper than the food in my hometown.","o":["convenient","delicious","modern","boring"],"a":1,"e":"Đáp án đúng: <b>B</b>. delicious"},{"t":"mcq","n":3,"q":"The Red river is one of the longest _____ in Viet Nam.","o":["lakes","cities","countries","rivers"],"a":3,"e":"Đáp án đúng: <b>D</b>. rivers"},{"t":"mcq","n":4,"q":"Life in the country is _____ . There aren’t many things to do there.","o":["boring","peaceful","quiet","busy"],"a":0,"e":"Đáp án đúng: <b>A</b>. boring"},{"t":"mcq","n":5,"q":"Ha Noi is_____ than Hoi An.","o":["noisier","more noisy","noisy","more noisily"],"a":0,"e":"Đáp án đúng: <b>A</b>. noisier"},{"t":"mcq","n":6,"q":"Things at a supermarket are more _____ than things at a village market.","o":["busy","expensive","crowded","sleepy"],"a":1,"e":"Đáp án đúng: <b>B</b>. expensive"},{"t":"mcq","n":7,"q":"This book is _____ I don't like it.","o":["interesting","cheap","boring","busy"],"a":2,"e":"Đáp án đúng: <b>C</b>. boring"},{"t":"mcq","n":8,"q":"The town has many motorbikes. It’s very _____ .","o":["boring","peaceful","quiet","busy"],"a":3,"e":"Đáp án đúng: <b>D</b>. busy"},{"t":"mcq","n":9,"q":"_____ is bigger, London or Rome?","o":["Where","Which","What","When"],"a":1,"e":"Đáp án đúng: <b>B</b>. Which"},{"t":"mcq","n":10,"q":"Their _____ makes me happy.","o":["friendly","friendliness","unfriendliness","friendship"],"a":1,"e":"Đáp án đúng: <b>B</b>. friendliness"},{"t":"mcq","n":11,"q":"Ha Noi is not _____ from Kuala Lumpur","o":["difference","different","differently","differ"],"a":1,"e":"Đáp án đúng: <b>B</b>. different"},{"t":"mcq","n":12,"q":"The _____ language in Malaysia is Bahasa Malaysia.","o":["nation","national","nationally","nationwide"],"a":1,"e":"Đáp án đúng: <b>B</b>. national"},{"t":"mcq","n":13,"q":"What time do you go _____ school?","o":["to","for","against","at"],"a":0,"e":"Đáp án đúng: <b>A</b>. to"},{"t":"mcq","n":14,"q":"I am going to take part _____ English speaking club.","o":["in","for","off","on"],"a":0,"e":"Đáp án đúng: <b>A</b>. in"},{"t":"mcq","n":15,"q":"My neighbourhood is much  _____  than his.","o":["more exciting","exciting","most exciting","excitingly"],"a":0,"e":"Đáp án đúng: <b>A</b>. more exciting"},{"t":"mcq","n":16,"q":"Travelling  by train is _____ than travelling by air.","o":["more cheap","cheaper","cheapest","most cheap"],"a":1,"e":"Đáp án đúng: <b>B</b>. cheaper"},{"t":"mcq","n":17,"q":"Can you tell us the _____ to Tan Ky house?","o":["road","street","way","instruction"],"a":2,"e":"Đáp án đúng: <b>C</b>. way"},{"t":"mcq","n":18,"q":"Bill is _____ than you.","o":["good","well","better","best"],"a":2,"e":"Đáp án đúng: <b>C</b>. better"},{"t":"mcq","n":19,"q":"Nam is the most _____ student in his class.","o":["friend","friendly","friendliness","friendship"],"a":1,"e":"Đáp án đúng: <b>B</b>. friendly"},{"t":"mcq","n":20,"q":"Going by taxi is more  _____ than going by bus.","o":["cheaper","faster","inconvenient","expensive"],"a":3,"e":"Đáp án đúng: <b>D</b>. expensive"},{"t":"mcq","n":21,"q":"The roads in this town are  _____ than the roads in the city.","o":["more narrow","narrower","more narrower","most narrow"],"a":1,"e":"Đáp án đúng: <b>B</b>. narrower"},{"t":"mcq","n":22,"q":"Air quality in the area is much  _____ than it used to be a few years ago.","o":["badder","more bad","most bad","worse"],"a":3,"e":"Đáp án đúng: <b>D</b>. worse"},{"t":"mcq","n":23,"q":"Life in a big city is  _____ than that in the countryside.","o":["most expensive","more better","better","more expensive"],"a":3,"e":"Đáp án đúng: <b>D</b>. more expensive"},{"t":"mcq","n":24,"q":"Staying in a hotel is often  _____ than in a guest house.","o":["more good","more better","better","best"],"a":2,"e":"Đáp án đúng: <b>C</b>. better"},{"t":"mcq","n":25,"q":"\"Is there a square in your neighbour hood?\" _____ ”","o":["The square is beautiful.","No, there isn't.","My neighbour hood is big.","The square is in the neighbour hood."],"a":1,"e":"Đáp án đúng: <b>B</b>. No, there isn't."},{"t":"mcq","n":26,"q":"“Excuse me. Could you tell us the way to the cinema?\" _____”","o":["Don't do that.","I'm sorry I don't like films.","Sure. Go straight ahead. Then turn right.","I have a class."],"a":2,"e":"Đáp án đúng: <b>C</b>. Sure. Go straight ahead. Then turn right."},{"t":"mcq","n":27,"q":"“Let's go to Chua Cau!” “_____”","o":["Go straight and turn right.","That's a great idea.","I think we're lost.","There's a girl. Let's ask her."],"a":1,"e":"Đáp án đúng: <b>B</b>. That's a great idea."},{"t":"mcq","n":28,"q":"\"Excuse me. Where is the nearest gym, please?\"_____ ”","o":["Yes, there's one next to the supermarket.","Cross the road. Then go straight. It's right on your left.","Oh, I am sorry. I can't go to the gym.","So if there is, what will you do?"],"a":1,"e":"Đáp án đúng: <b>B</b>. Cross the road. Then go straight. It's right on your left."},{"t":"mcq","n":29,"q":"\"Is your city green?\" _____”","o":["Yes, it is. It has a lot of trees.","No, our city is blue.","I don't talk to you.","I am colouring it."],"a":0,"e":"Đáp án đúng: <b>A</b>. Yes, it is. It has a lot of trees."},{"t":"mcq","n":30,"q":"Lan: \"Why don’t we take a trip to my home town?\" Nam: \"_____ ”","o":["Yes, we do.","That’s a good idea.","Not at all.","You’re welcome."],"a":1,"e":"Đáp án đúng: <b>B</b>. That’s a good idea."}]},{"h":"III. Choose the word(s) CLOSEST in meaning to the underlined words in each of the following questions.","items":[{"t":"mcq","n":1,"q":"This park is more <u>beautiful</u> than that park.","o":["kind","nice","big","small"],"a":1,"e":"Đáp án đúng: <b>B</b>. nice"},{"t":"mcq","n":2,"q":"This city is very <u>historic</u>.","o":["old","quiet","peaceful","boring"],"a":0,"e":"Đáp án đúng: <b>A</b>. old"},{"t":"mcq","n":3,"q":"The streets are very <u>busy</u> with a lot of traffic.","o":["modern","peaceful","noisy","crowded"],"a":3,"e":"Đáp án đúng: <b>D</b>. crowded"},{"t":"mcq","n":4,"q":"I think living in the countryside is <u>peaceful.</u>","o":["old","quiet","fresh","boring"],"a":1,"e":"Đáp án đúng: <b>B</b>. quiet"},{"t":"mcq","n":5,"q":"I like my bedroom very much because it’s a <u>wide</u> room.","o":["large","big","great","convenient"],"a":0,"e":"Đáp án đúng: <b>A</b>. large"}]},{"h":"IV. Choose the word(s) OPPOSITE in meaning to the underlined words in each of the following questions.","items":[{"t":"mcq","n":1,"q":"Is a house in the city more <u>expensive</u> than a house in the countryside?","o":["cheap","convenient","beautiful","interesting"],"a":0,"e":"Đáp án đúng: <b>A</b>. cheap"},{"t":"mcq","n":2,"q":"The weather here in very <u>hot</u> in the summer.","o":["cool","warm","cold","fresh"],"a":2,"e":"Đáp án đúng: <b>C</b>. cold"},{"t":"mcq","n":3,"q":"She likes travelling to the <u>historic</u> places.","o":["quiet","noisy","beautiful","modern"],"a":3,"e":"Đáp án đúng: <b>D</b>. modern"},{"t":"mcq","n":4,"q":"Living in the city is more <u>interesting</u> than living in the country.","o":["boring","happy","exciting","inconvenient"],"a":0,"e":"Đáp án đúng: <b>A</b>. boring"},{"t":"mcq","n":5,"q":"It’s too <u>polluted</u> for me to live in this area.","o":["interesting","fresh","convenient","comfortable"],"a":1,"e":"Đáp án đúng: <b>B</b>. fresh"}]},{"h":"V. Choose ONE suitable word / phrase to fill in each blank. Từ cho sẵn: station, gallery, temple, turning, cross.","items":[{"t":"fill","n":1,"q":"The boy showed the tourists the way to Ngoc Son ___ .","a":[["temple"]],"e":"Đáp án: <b>temple</b>."},{"t":"fill","n":2,"q":"My brother told me to take the second ___ on the left","a":[["turning"]],"e":"Đáp án: <b>turning</b>."},{"t":"fill","n":3,"q":"Nick and Nam decided to go to Sen art ___ .","a":[["gallery"]],"e":"Đáp án: <b>gallery</b>."},{"t":"fill","n":4,"q":"To go to the cathedral, ___ the road and turn right.","a":[["cross"]],"e":"Đáp án: <b>cross</b>."},{"t":"fill","n":5,"q":"Tom asked the locals how to get to Giap Bat railway ___ .","a":[["station"]],"e":"Đáp án: <b>station</b>."}]}]},{"id":"u4_g","name":"C. Ngữ pháp (so sánh hơn)","short":"Ngữ pháp, hội thoại","tag":"Unit 4","intro":"Làm hết rồi bấm \"Nộp bài\", máy chấm ngay và hiện đáp án. Đáp án theo file GV của cô.","groups":[{"h":"VI. Complete the following sentences with the comparative form of the adjectives (… in brackets)","items":[{"t":"fill","n":1,"q":"This book is ___ than the one I bought last week. (interesting)","a":[["more interesting"]],"e":"Đáp án: <b>more interesting</b>."},{"t":"fill","n":2,"q":"My father's new office is ___ than his old one. (modern)","a":[["more modern"]],"e":"Đáp án: <b>more modern</b>."},{"t":"fill","n":3,"q":"Eating at home is ___ than eating out. (healthy)","a":[["healthier"]],"e":"Đáp án: <b>healthier</b>."},{"t":"fill","n":4,"q":"My neigh bour hood is ___ than Nam's. (crowded)","a":[["more crowded"]],"e":"Đáp án: <b>more crowded</b>."},{"t":"fill","n":5,"q":"The weather in Da Lat is ___ than that in Hanoi. (cool)","a":[["cooler"]],"e":"Đáp án: <b>cooler</b>."},{"t":"fill","n":6,"q":"David’s car is ___ than Peter’s car. (new)","a":[["newer"]],"e":"Đáp án: <b>newer</b>."},{"t":"fill","n":7,"q":"The first calculation is ___ than the second calculation. (easy)","a":[["easier"]],"e":"Đáp án: <b>easier</b>."},{"t":"fill","n":8,"q":"Our neighbourhood is ___ than yours (peaceful)","a":[["more peaceful"]],"e":"Đáp án: <b>more peaceful</b>."},{"t":"fill","n":9,"q":"It is ___ in Ha Noi than in Lai Chau. (hot)","a":[["hotter"]],"e":"Đáp án: <b>hotter</b>."},{"t":"fill","n":10,"q":"The service in shop 1 is ___ than in shop 2. (good)","a":[["better"]],"e":"Đáp án: <b>better</b>."},{"t":"fill","n":11,"q":"Street food in your neighbourhood is ___ than that in my neighbourhood. (good)","a":[["better"]],"e":"Đáp án: <b>better</b>."},{"t":"fill","n":12,"q":"The countryside is ___ than the city. (peaceful)","a":[["more peaceful"]],"e":"Đáp án: <b>more peaceful</b>."},{"t":"fill","n":13,"q":"The weather in Cua Lo, Nghe An is ___ and ___ than that in Ha Noi. (hot/dry)","a":[["hotter"],["drier"]],"e":"Đáp án: <b>hotter</b> và <b>drier</b>."},{"t":"fill","n":14,"q":"The people in Hoi An are ___ than those in many other places I’ve ever been to. (friendly)","a":[["friendlier","more friendly"]],"e":"Đáp án: <b>friendlier</b>."},{"t":"fill","n":15,"q":"The museum is much ___ than we expected. (far)","a":[["farther","further"]],"e":"Đáp án: <b>farther</b>."}]},{"h":"Conversation A: dòng chữ cái nào đứng ở vị trí 1, 2, 3, 4?","passage":"  \ta. A lot of shops, a cinema, a library and a big park with a lake.<br>b. It’s in the suburbs of the capital city.<br>c. What are there in the area?<br>d. Where is your neighbourhood?<br>The correct order is:","items":[{"t":"fill","n":1,"q":"Câu thứ 1 của hội thoại là câu nào? (gõ chữ cái a/b/c/d): ___","a":[["d"]],"e":"Đáp án: <b>d</b>."},{"t":"fill","n":2,"q":"Câu thứ 2 của hội thoại là câu nào? (gõ chữ cái a/b/c/d): ___","a":[["b"]],"e":"Đáp án: <b>b</b>."},{"t":"fill","n":3,"q":"Câu thứ 3 của hội thoại là câu nào? (gõ chữ cái a/b/c/d): ___","a":[["c"]],"e":"Đáp án: <b>c</b>."},{"t":"fill","n":4,"q":"Câu thứ 4 của hội thoại là câu nào? (gõ chữ cái a/b/c/d): ___","a":[["a"]],"e":"Đáp án: <b>a</b>."}]},{"h":"Conversation B: dòng chữ cái nào đứng ở vị trí 1–6?","passage":"  \ta. What are your favorite places in your neighbourhood?<br>b. The air is quite polluted because there are some factories around.<br>c. Is it a nice place to live in?<br>d. The park and the library, definitely! I really enjoy spending my free time reading in the library or jogging round the lake.<br>e. What don’t you like about the area?<br>f. Yes. Though the air is not very fresh, my neighbourhoood is very convenient and exciting. I love it here.<br>The correct order is:","items":[{"t":"fill","n":1,"q":"Câu thứ 1 của hội thoại là câu nào? (gõ chữ cái a–f): ___","a":[["a"]],"e":"Đáp án: <b>a</b>."},{"t":"fill","n":2,"q":"Câu thứ 2 của hội thoại là câu nào? (gõ chữ cái a–f): ___","a":[["d"]],"e":"Đáp án: <b>d</b>."},{"t":"fill","n":3,"q":"Câu thứ 3 của hội thoại là câu nào? (gõ chữ cái a–f): ___","a":[["e"]],"e":"Đáp án: <b>e</b>."},{"t":"fill","n":4,"q":"Câu thứ 4 của hội thoại là câu nào? (gõ chữ cái a–f): ___","a":[["b"]],"e":"Đáp án: <b>b</b>."},{"t":"fill","n":5,"q":"Câu thứ 5 của hội thoại là câu nào? (gõ chữ cái a–f): ___","a":[["c"]],"e":"Đáp án: <b>c</b>."},{"t":"fill","n":6,"q":"Câu thứ 6 của hội thoại là câu nào? (gõ chữ cái a–f): ___","a":[["f"]],"e":"Đáp án: <b>f</b>."}]}]},{"id":"u4_d","name":"D. Đọc hiểu","short":"Đọc hiểu","tag":"Unit 4","intro":"Làm hết rồi bấm \"Nộp bài\", máy chấm ngay và hiện đáp án. Đáp án theo file GV của cô.","groups":[{"h":"D I.1 Read the passage and choose the correct answer","items":[{"t":"mcq","n":1,"q":"You should live in the city if _____.","o":["you have asthma","you have problems with breathing diseases","you want to meet people from different social status","you want your children to run around in open environments"],"a":2,"e":"Đáp án đúng: <b>C</b>. you want to meet people from different social status"},{"t":"mcq","n":2,"q":"The country life is better for you if _____.","o":["you love to meet people from different cultures","you want a busy social life","you would like to work for international companies","you are really sensitive to pollution"],"a":3,"e":"Đáp án đúng: <b>D</b>. you are really sensitive to pollution"},{"t":"mcq","n":3,"q":"There is much less pollution in the country than in the city because","o":["everything is so centralized in the city","there are not as many cars in the country as in the city","the distance between other people is harder","there are much more trees in the city"],"a":1,"e":"Đáp án đúng: <b>B</b>. there are not as many cars in the country as in the city"},{"t":"mcq","n":4,"q":"The word \"<u>plants</u>\" in the passage means","o":["factories","trees","buildings","restaurants"],"a":0,"e":"Đáp án đúng: <b>A</b>. factories"},{"t":"mcq","n":5,"q":"Which of the following statements is NOT true?","o":["The population in the city is concentrated.","You have higher opportunities of meeting people in the city.","There is more traffic in the country than in the city.","The environment in the country is safer than in the city."],"a":2,"e":"Đáp án đúng: <b>C</b>. There is more traffic in the country than in the city."}],"passage":"If you are the type of person who loves to meet many different people from different cultures and social status, then the city is better for you. The city is  where people from all different background and status come to work and live because everything so centralized in the city. The city's population is also more concentrated, so you also have a higher chance of meeting people. In the country, the distance between other people is harder, so it is less convenient to meet other people. Hence, if you want a busy social life, the city is better.<br>If you have asthma or you are really sensitive to population , then the country lifestyle is best for you. In the country there is much less population because there are fewer cars, traffic and industrial <u>plants</u> in the country. There are also more trees, rivers and other natural scenery. If you want your kids to run around in open safe environments, then the country is also much better."},{"h":"D I.2 Read the passage and choose the correct answer","items":[{"t":"mcq","n":1,"q":"What happened in  Pilton, Somerset every summer ?","o":["The villagers litter the streets.","There is a pop music festival","There are many villagers.","The neighbors are noisy"],"a":1,"e":"Đáp án đúng: <b>B</b>. There is a pop music festival"},{"t":"mcq","n":2,"q":"Visitors litter the streets with_____.","o":["cans and papers","caravans","motorhomes","tents"],"a":0,"e":"Đáp án đúng: <b>A</b>. cans and papers"},{"t":"mcq","n":3,"q":"How long is the pop music festival every year ?","o":["The whole summer","One night","Three or four days","The whole year"],"a":2,"e":"Đáp án đúng: <b>C</b>. Three or four days"},{"t":"mcq","n":4,"q":"What is Pilton like during the rest of the year ?","o":["noisy place","A quiet village","A nightmare","A music concert"],"a":1,"e":"Đáp án đúng: <b>B</b>. A quiet village"},{"t":"mcq","n":5,"q":"The villagers just want to_____.","o":["put an end to the festival","stop the fans enjoying the festival","move far away","have a normal life as usual"],"a":3,"e":"Đáp án đúng: <b>D</b>. have a normal life as usual"}],"passage":"NOISY NEIGHBOURS<br>Do you sometimes have problems with your neighbors such as noise or littering ? Well, the people of Pilton in Somerset, England have such problems every summer , For three or four days every year, the village is full of people of all ages who comes here for the annual Glastonbury pop music festival. They usually stay in tents. Caravans and motorhomes. They leave  drink cans and papers all over the streets. The music plays until the early hours of the morning ,and you can hear people talking and singing all night, The quiet country village becomes a nightmare to live in and some villagers are even thinking of moving to another village. A villager said last year «  I don’t want to stop the Glastonbury Festival. I just want the fans to enjoy the festival during disturbing nomal village life. »"},{"h":"D I.3 Read the passage and choose the correct answer","items":[{"t":"mcq","n":1,"q":"How is the traffic in London?","o":["Traffic in the city centre is better than before.","Traffic in the suburbs is better than before.","Traffic in the city centre is heavier than that in the suburbs.","Traffic in the suburbs is heavier than that in the city centre."],"a":2,"e":"Đáp án đúng: <b>C</b>. Traffic in the city centre is heavier than that in the suburbs."},{"t":"mcq","n":2,"q":"People in London prefer to go around _____.","o":["by their own cars","by public means of transport","by both their own cars and public means of transport","by any vehicles"],"a":0,"e":"Đáp án đúng: <b>A</b>. by their own cars"},{"t":"mcq","n":3,"q":"How are the streets in London at weekends?","o":["There is less traffic.","The streets are noisier.","Traffic jams are better.","The traffic is not heavier."],"a":1,"e":"Đáp án đúng: <b>B</b>. The streets are noisier."},{"t":"mcq","n":4,"q":"The living cost in the city centre is _____.","o":["cheaper than that in the suburbs and the countryside","not expensive but people like to live in the suburbs and the countryside","not cheap so more people want to leave there now","more expensive than that in the suburbs and the countryside"],"a":3,"e":"Đáp án đúng: <b>D</b>. more expensive than that in the suburbs and the countryside"},{"t":"mcq","n":5,"q":"According to the passage, what is NOT true about London?","o":["London's public means of transport is more expensive than cars.","There are a lot of people in the city centre, especially at weekends.","More and more people come to London for sightseeing.","London is richer than other cities in the United Kingdom."],"a":0,"e":"Đáp án đúng: <b>A</b>. London's public means of transport is more expensive than cars."}],"passage":"London is the capital city of the United Kingdom. There are a lot of cars in the city. People go everywhere by car, so traffic in the city centre is heavier than that in the suburbs. It is harder to find a place to park a car than to do it in other areas. The public means of transport is cheaper than cars but the Londoners prefer their own cars. Moreover, there are more and more tourists and visitors coming to London for sightseeing or shopping. At weekends, the streets are noisier and busier than they are on weekdays. Now, traffic jams are worse than ever before.<br>Although the living cost in the suburbs and the countryside is cheaper than that in the city centre, most young people prefer living in the city centre. London is richer than other cities in the United Kingdom, but it is more polluted because of the city industry, vehicles, and plenty of people."},{"h":"D II.1 True or False","passage":"I live in Newquay. It's a small town on the Atlantic coast in the south of England. It has got great beaches and it is the best place to surf in the UK. There are lots of surf schools where you can learn how to surf. I go surfing with my friends every weekend. My favourite place is Fistral Beach.<br>I love Newquay because there are lots of other things to do as well as surfing. If you like water sports, you can go kayaking or water-skiing. If you like animals, you can visit the Blue Reef Aquarium and see lots of different fish and even sharks. You can also go horse riding on the beach or visit Newquay Zoo. There are lots of other attractions too like mini golf and bowling. Come and see for yourself! GA","items":[{"t":"tf","n":1,"q":"Newquay is in the south of England.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":2,"q":"You cannot go surfing in Newquay.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":3,"q":"Alex doesn't like to do outdoor activities.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":4,"q":"You can also go horse riding on the beach in Newquay.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":5,"q":"There is a zoo in Newquay.","a":true,"e":"Đáp án: <b>True</b>."}]},{"h":"D II.2 True or False","passage":"My neighbourhood<br>My name is Nick. My neighbourhood is not in the city. It’s in the suburbs. It is very peaceful and quiet. It is a new neighbourhood, and there are a lot of big houses and some apartment buildings. There are a lot of big trees and there aren’t many cars so the streets are very clean.<br>There’s a park in my neighbourhood, which has a small playground for children, I like to play baseball there with my friends  after school.<br>There aren’t any restaurants, bars or cinemas on my road. But, if you go to Main Street, you can find a lot of things  to do.<br>I like my neighbourhood because it is very safe. There is no crime, and all of my neighbours take care of each other. I think I am lucky to live in my neighbourhood.","items":[{"t":"tf","n":1,"q":"Nick’s neighbourhood is old but peaceful and quiet","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":2,"q":"The streets are clean because there aren’t many cars and the neighbourhood is green.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":3,"q":"Nick likes to play baseball with his friends after school.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":4,"q":"There are more things to do on Nick’s road than on Main Street.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":5,"q":"Nick is happy about his neighbourhood.","a":true,"e":"Đáp án: <b>True</b>."}]},{"h":"III. Read the text and circle the letter A, B, C, or D to indicate the correct answer to each of the questions.","items":[{"t":"mcq","n":1,"q":"Chỗ trống (1)","o":["with","of","for","at"],"a":0,"e":"Đáp án đúng: <b>A</b>. with"},{"t":"mcq","n":2,"q":"Chỗ trống (2)","o":["him","they","them","her"],"a":2,"e":"Đáp án đúng: <b>C</b>. them"},{"t":"mcq","n":3,"q":"Chỗ trống (3)","o":["are","be","is","has"],"a":2,"e":"Đáp án đúng: <b>C</b>. is"},{"t":"mcq","n":4,"q":"Chỗ trống (4)","o":["study","studied","is studying","will study"],"a":2,"e":"Đáp án đúng: <b>C</b>. is studying"},{"t":"mcq","n":5,"q":"Chỗ trống (5)","o":["or","because","but","and"],"a":1,"e":"Đáp án đúng: <b>B</b>. because"}],"passage":"My neighbour is John. He is from Australia. We have been friends for over a year. We both live in the countryside (1) _________ our family. John's parents are farmers. He often helps (2) _________ to look after vegetables in the garden in his free time. He likes growing vegetables and flowers. He'd like to be a farmer in the future and to work on a farm. He thinks farming (3) _________ exciting and interesting. Now he (4) _________ biology hard at school. He wants to be good at biology (5) _________ it's important for his future job."},{"h":"IV. Read the text. Match the paragraph headings 1-4 with the paragraphs A – D.","passage":"A  ___________<br>London’s parks are beautiful. Hyde Park has a famous lake, the Serpentine – and from May to September, you can swim there. And Regent’s Park is the home of London Zoo. But most visitors to the parks just go for a walk, or sit and relax with some food.<br>B  ___________<br>Many visitors come to London to buy souvenirs or the latest fashions. Oxford Street is very popular with young tourists. Harrods, the famous department store, is near Hyde Park, and Convent Garden Market has lots of different shops.<br>C  ___________<br>The West End of London is famous for its theatres. There are about forty different theatres in this part of the city and you can usually get tickets on the day. Musicals are very popular with tourists, but you can see every kind of show from comedy to classics.<br>D  ___________<br>Like all big cities, there is a lot of traffic in London and driving a car there for the first time is not easy. But there are other ways to travel. Take an underground train from one of 274 stations in London. Or you can stop a’black cab’ (a London taxi) in the street.","items":[{"t":"mcq","n":1,"q":"Đoạn A phù hợp với tiêu đề nào?","o":["Great places for picnics","Transport options","Shopping in central London","Evening entertainment"],"a":0,"e":"Đáp án: <b>Great places for picnics</b>."},{"t":"mcq","n":2,"q":"Đoạn B phù hợp với tiêu đề nào?","o":["Great places for picnics","Transport options","Shopping in central London","Evening entertainment"],"a":2,"e":"Đáp án: <b>Shopping in central London</b>."},{"t":"mcq","n":3,"q":"Đoạn C phù hợp với tiêu đề nào?","o":["Great places for picnics","Transport options","Shopping in central London","Evening entertainment"],"a":3,"e":"Đáp án: <b>Evening entertainment</b>."},{"t":"mcq","n":4,"q":"Đoạn D phù hợp với tiêu đề nào?","o":["Great places for picnics","Transport options","Shopping in central London","Evening entertainment"],"a":1,"e":"Đáp án: <b>Transport options</b>."}]}]},{"id":"u4_e","name":"E. Viết","short":"Viết (tự luyện)","tag":"Unit 4","intro":"Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Câu mẫu do máy soạn, có thể có cách viết khác đúng.","groups":[{"h":"I. Rearrange the words and phrases to make meaningful sentences.","items":[{"t":"self","n":1,"q":"the food / friendlier, / here / are / The people / better than/ other places/ in / and / is /.","model":"The people here are friendlier, and the food is better than in other places."},{"t":"self","n":2,"q":"two things / my neighbourhood / However, / dislike / I / there are / about /.","model":"However, there are two things I dislike about my neighbourhood."},{"t":"self","n":3,"q":"like / many things / about / neighbourhood / There are/ I / my/.","model":"There are many things I like about my neighbourhood."},{"t":"self","n":4,"q":"in Ha Noi/ less delicious / The seafood / more expensive / is / that in Nha Trang/ and / than /.","model":"The seafood in Ha Noi is more expensive and less delicious than that in Nha Trang."},{"t":"self","n":5,"q":"busy and crowded, / / and / The streets / quite polluted / are / is /.","model":"The streets are busy and crowded, and quite polluted."},{"t":"self","n":6,"q":"Da Nang / noisier / The streets / than those in Hue / are / crowded / in / and / more /.","model":"The streets in Da Nang are noisier and more crowded than those in Hue."},{"t":"self","n":7,"q":"going/ going/ by/ by/ car/ bicycle/ than/ is/ faster","model":"Going by car is faster than going by bicycle."},{"t":"self","n":8,"q":"street/ there/ is/ post office/ at/ corner/ a/ the/ of/ the","model":"There is a post office at the corner of the street."},{"t":"self","n":9,"q":"this/ we/ shall/ what/ do/ Saturday evening?","model":"What shall we do this Saturday evening?"},{"t":"self","n":10,"q":"in/ is/ suburbs/ Da Nang City/ my neighbourhood/ the/ of","model":"My neighbourhood is in the suburbs of Da Nang City."},{"t":"self","n":11,"q":"me/ you/ can/ the/ to/ tell/ way/ Ben Thanh Market?","model":"Can you tell me the way to Ben Thanh Market?"},{"t":"self","n":12,"q":"The / very / friendly / are / here / and / helpful / people / .","model":"The people here are very friendly and helpful."},{"t":"self","n":13,"q":"dinner?/ we/ go/ shall/ to/ the/ after/ cinema","model":"Shall we go to the cinema after dinner?"},{"t":"self","n":14,"q":"is/ Ho Chi Minh City/ busy and crowded/ for/ too/ me","model":"Ho Chi Minh City is too busy and crowded for me."},{"t":"self","n":15,"q":"It’s / because / big supermarket / very convenient / there is a / near my house /.","model":"It's very convenient because there is a big supermarket near my house."}]},{"h":"II. Write the full sentences use the words given.","items":[{"t":"self","n":1,"q":"people/ your/ city/ friendly/ and/ open/ than/ many/ other/ place.","model":"People in your city are friendlier and more open than in many other places."},{"t":"self","n":2,"q":"one/ thing/ not like/ new neighbourhood/ that/ it/ very/ noisy/.","model":"One thing I do not like about my new neighbourhood is that it is very noisy."},{"t":"self","n":3,"q":"weather/ here/ hot/ and/ dry/ than/ your/ country/.","model":"The weather here is hotter and drier than in your country."},{"t":"self","n":4,"q":"one/ good/ things/ live/ neighbourhood/ that/ food/ cheap/.","model":"One of the good things about living in my neighbourhood is that the food is cheap."},{"t":"self","n":5,"q":"there/ be/ many/ new/ shop/ near/ here/ so/ streets/ busy/ day/.","model":"There are many new shops near here, so the streets are busy every day."}]},{"h":"III. For each question, complete the second sentence so that it means the same as the first. Use the word in brackets. You may need to change the word. Write no more than THREE words.","items":[{"t":"self","n":1,"q":"Life is more convenient in the city centre than in the suburbs. (less)","model":"Life is less convenient in the suburbs than in the city centre."},{"t":"self","n":2,"q":"Their neighbourhood is not as clean as my neighbourhood. (polluted)","model":"Their neighbourhood is more polluted than my neighbourhood."},{"t":"self","n":3,"q":"There are more high-rise buildings in Shanghai than in Ha Noi. (modern)","model":"Shanghai is more modern than Ha Noi."},{"t":"self","n":4,"q":"I like my neighbourhood most because other places are not as peaceful. (as)","model":"I like my neighbourhood most because no other place is as peaceful as it."},{"t":"self","n":5,"q":"Cua Lo is closer to Ha Noi than Hue. (far)","model":"Hue is farther from Ha Noi than Cua Lo."}]},{"h":"IV. Combine the two sentences using comparative adjective in brackets","items":[{"t":"self","n":1,"q":"The road systems in developed countries are much bettr than those in developing countries. (bad)","model":"The road systems in developing countries are much worse than those in developed countries."},{"t":"self","n":2,"q":"A hotel room costs $20 a night. A guesthouse room costs $15 a night. (cheap)","model":"A guesthouse room is cheaper than a hotel room."},{"t":"self","n":3,"q":"Martin's house is $100,000. Henry's house is $150,000. (expensive)","model":"Henry's house is more expensive than Martin's house."},{"t":"self","n":4,"q":"This valley is about 300m deep. That valley is about 310m deep. (deep)","model":"That valley is deeper than this valley."},{"t":"self","n":5,"q":"This square is about 7,500m2. That square is about 7,000m2. (big)","model":"This square is bigger than that square."},{"t":"self","n":6,"q":"Her mother is 37 years old. Her father is 38 years old. (old)","model":"Her mother is younger than her father."},{"t":"self","n":7,"q":"Our building has 33 floors. Their building has 15 floors. (tall)","model":"Our building is taller than their building."},{"t":"self","n":8,"q":"My house is 3km from school. His house is 5km from school. (far)","model":"His house is farther from school than my house."}]},{"h":"V. Rewrite each sentence so that it is closest in meaning to the original one.","items":[{"t":"self","n":1,"q":"Hoa is taller than Chau. Chau is","model":"Chau is shorter than Hoa."},{"t":"self","n":2,"q":"The museum is bigger than the art gallery. The Art gallery","model":"The art gallery is smaller than the museum."},{"t":"self","n":3,"q":"The market is older than the shopping centre. The shopping centre","model":"The shopping centre is newer than the market."},{"t":"self","n":4,"q":"The food here is worse than my cooking. My cooking","model":"My cooking is better than the food here."},{"t":"self","n":5,"q":"My computer is newer than my mobile phone. My mobile phone","model":"My mobile phone is older than my computer."},{"t":"self","n":6,"q":"A town house is more modern than a country house. A country house","model":"A country house is less modern than a town house."},{"t":"self","n":7,"q":"The streets in Ha Noi are noisier than those in Hoi An. The streets in Hoi An","model":"The streets in Hoi An are quieter than those in Ha Noi."},{"t":"self","n":8,"q":"Could you show me the way to the post office? Could you tell me how","model":"Could you tell me how to get to the post office?"},{"t":"self","n":9,"q":"The cathedral is in front of the art gallery. The art gallery","model":"The art gallery is behind the cathedral."},{"t":"self","n":10,"q":"Is there a square in your neighbourhood? Does your neighbourhood","model":"Does your neighbourhood have a square?"},{"t":"self","n":11,"q":"The Blue hotel is cheaper than the Green Hotel. The Green Hotel","model":"The Green Hotel is more expensive than the Blue Hotel."},{"t":"self","n":12,"q":"The square in Hoi An is smaller than the square in Ha Noi. The square in Ha Noi","model":"The square in Ha Noi is bigger than the square in Hoi An."},{"t":"self","n":13,"q":"Let's go out and have an ice-cream! Shall","model":"Shall we go out and have an ice-cream?"},{"t":"self","n":14,"q":"Can you tell us the way to the bus stop? How","model":"How can we get to the bus stop?"},{"t":"self","n":15,"q":"Our neighbourhood is quieter than your neighbourhood. Your neighbourhood","model":"Your neighbourhood is noisier than our neighbourhood."}]},{"h":"VI. Write a paragraph about your neighbourhood (about 60 words), using the cues below:","items":[{"t":"self","n":1,"q":"1. Where is your neighbourhood? (in the city, near a city, in the country, in the mountains, etc.)<br>2. What can you see in your neighbourhood? (streets, houses, trees, hills, shopping centres, schools, cinemas, etc.)<br>3. What are the streets / the houses / the shops, etc. in your neighbourhood like?<br>4. Do you like living in your neighbourhood? Why / Why not?","model":"My neighbourhood is in the suburbs of a big city. There are many houses, trees and a small park. The streets are quiet and clean. The people are friendly. I like living here because it is peaceful and convenient."}]}],"selfCheck":true}];

any","few"],"a":1,"e":"Đáp án đúng: <b>B</b>. much"},{"t":"mcq","n":5,"q":"Chỗ trống (5)","o":["few","Some","Any","little"],"a":2,"e":"Đáp án đúng: <b>C</b>. Any"}],"passage":"There are deserts all around the world. They can be found (1) ________ China, South America, and North America. In some places, deserts are growing. This is a (2)________ problem because deserts destroy farmland. When people cannot but also people can grow food, they have to leave their homes. Not only (3)________ cause deserts to grow. People can cause too (4)________ the weather hotter. Large numbers of people can damage the land. Also, cutting down too (5)________ air pollution, and it makes trees can make the sol lose water. People must take better care of the land if they want to stop desert growth."},{"h":"D II.1 True or False","passage":"Phu Quoc Island<br>Fly to Phu Quoc Island, off the coast of southern Viet Nam, you can see some of Viet Nam’s prettiest beaches with white sands and tropical rainforests. One of the most popular beaches here is Long Beach, which is on the west coast of the island. This is an excellent place to enjoy fresh seafood.<br>Sa Pa<br>Terraced rice paddies line the mountainsides of northern Viet Nam. Take a bus through the winding hills to Sa Pa, and book a stay at a hotel with a fantastic view of the mountains. Many visitors report that it’s best to visit Sa Pa during the rainy season when the fields are green and lush. Around September, when it’s time to harvest, the fields turn bright gold.","items":[{"t":"tf","n":1,"q":"Both Phu Quoc Island and Sa Pa are in the south of Viet Nam.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":2,"q":"Visitors can eat good seafood at Long Beach.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":3,"q":"Phu Quoc Island is on the west coast of Viet Nam.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":4,"q":"The rice paddies in Sa Pa are green and lush all year round.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":5,"q":"September is the best time to visit Sa Pa.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":6,"q":"Sa Pa is hilly and mountainous.","a":true,"e":"Đáp án: <b>True</b>."}]},{"h":"D II.2 True or False","passage":"RAINFOREST ECOSYSTEMS<br>Rainforest ecosystems are found near the equator, the center imaginary line of latitude that runs east and west around Earth. Tropical rainforests have more rain than other areas. The weather is warm and humid all year long. There is lots of sunlight.<br>Living things are plenty in the rainforests. There are thousands of species of animals and even more kinds of plants. Their needs for sun, water and warmth are all met by the conditions of the rainforest. The excellent conditions allow them to grow up. There is an amazing amount and variety of plants in that one location. This variety makes the rainforests a major source of Earth's overall oxygen supply.","items":[{"t":"tf","n":1,"q":"Equator is a real line that runs around Earth.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":2,"q":"Rainforest can be found everywhere on Earth.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":3,"q":"There are a lot of types of animals and plants in the rainforests.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":4,"q":"Plants don't have enough water to grow in the rainforests.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":5,"q":"Rainforests produce most of oxygen on Earth.","a":true,"e":"Đáp án: <b>True</b>."}]},{"h":"D III.1 Choose the correct answer","items":[{"t":"mcq","n":1,"q":"Why is Nha Trang one of the mostimportant tourist hubs of Vietnam?","o":["Because it has many beautiful islands and fine sand.","Because it has mild temperatures in the summer.","Because it has beautiful beaches and clear, clean water.","Because it has fine clean sand and mild temperatures."],"a":2,"e":"Đáp án đúng: <b>C</b>. Because it has beautiful beaches and clear, clean water."},{"t":"mcq","n":2,"q":"Diamond Bay is the name of a / an","o":["resort","amusement park","island","water park"],"a":0,"e":"Đáp án đúng: <b>A</b>. resort"},{"t":"mcq","n":3,"q":"Where are resorts and parks?","o":["in the city only","in the city and on islands","on islands only","on islands and off the coast"],"a":1,"e":"Đáp án đúng: <b>B</b>. in the city and on islands"},{"t":"mcq","n":4,"q":"The Pacific Coast Highway of Viet Nam refers to in Nha Trang","o":["Hon Tre Island","Vinpearl Group","Ana Mandara Resort","Tran Phu Street"],"a":3,"e":"Đáp án đúng: <b>D</b>. Tran Phu Street"},{"t":"mcq","n":5,"q":"The Vinpearl Cable Car is a","o":["five-star resort","gondola ift system","theme park","mainland link"],"a":1,"e":"Đáp án đúng: <b>B</b>. gondola ift system"}],"passage":"Nha Trang is one of the most important tourist hubs of Viet Nam, thanks its beautiful beaches with fine and clean sand and clear ocean water with mild temperatures all year round. There are several resorts - such as Vinpearl,  Diamond Bay and Ana Mandara - and amusement and water parks, both in the city and on islands off the coast. The possibly most beautiful street of Nha Trang is Tran Phu along the seaside, sometimes referred to as the Pacific Coast Highway of Vietnam.<br>Lying off Nha Trang is Hon Tre  island ( Bamboo island), with a major resort operated by the Vin Group. The Vin Per Cable Car, a gondola  lift system, links the mainland to the five-star resort and theme park on Hon Tre island."},{"h":"D III.2 Choose the correct answer","items":[{"t":"mcq","n":1,"q":"Nha Trang is _____.","o":["famous for its fresh and delicious seafood.","located in Khanh Hoa Province.","a paradise for swimmers.","not a resort."],"a":1,"e":"Đáp án đúng: <b>B</b>. located in Khanh Hoa Province."},{"t":"mcq","n":2,"q":"Tourists can take part in some outdoor activities such as_____.","o":["visiting Nha Trang Pasteur Institute.","eating the local seafood.","visiting Tri Nguyen Aquarium.","scuba diving."],"a":3,"e":"Đáp án đúng: <b>D</b>. scuba diving."},{"t":"mcq","n":3,"q":"At Tri Nguyen Aquarium, visitors can enjoy_____.","o":["watching a few sharks only.","a taste of the local seafood.","watching sharks and various kinds of colorful fish.","feeding the fish."],"a":2,"e":"Đáp án đúng: <b>C</b>. watching sharks and various kinds of colorful fish."},{"t":"mcq","n":4,"q":"At a fishing village, tourist can_____.","o":["get a taste of the local seafood","catch the fish and cook them","choose crabs, shrimps","enjoy fishing"],"a":0,"e":"Đáp án đúng: <b>A</b>. get a taste of the local seafood"},{"t":"mcq","n":5,"q":"Which of the following sentences is NOT mentioned in the passage?","o":["Nha Trang is a nice seaside resort.","Tri Nguyen Aquarium is on an island.","Most tourists are interested in snorkeling and scuba diving.","The local seafood is fresh and delicious."],"a":2,"e":"Đáp án đúng: <b>C</b>. Most tourists are interested in snorkeling and scuba diving."}],"passage":"When people talk about Nha Trang, the biggest city in Khanh Hoa Province, they often think of a tropical paradise. Nha Trang is a famous seaside resort. It has a long coastline with beautiful white sandy beaches.<br>In the morning and afternoon, tourists can take part in various fascinating outdoor activities such as mud bathing, swimming, snorkeling or scuba diving. Snorkeling and scuba diving are both interesting sports, as swimmers may swim underwater and admire the lives at the bottom of the sea. Besides, tourist can also take boat trips to the islands. One of the most enjoyable trips is the trip to Mieu Island, where Tri Nguyen Aquarium was built in 1999. This aquarium is now home to different kinds of colorful fish and even a few sharks.<br>In addition, tourists can spend an evening visiting a fishing village, where they could get a taste of the local seafood. There are crabs, shrimps, lobsters, clams, oysters, and several other kind of fish - all are fresh and delicious."},{"h":"IV. Read the text about the Grand Canyon and complete the table. Fill in the each blank with no more than THREE words.","passage":"The Grand Canyon is one of the seven famous natural wonders of the world. It is in Arizona. It is a UNESCO World Heritage Site and a National Park in the U.S.<br>The Grand Canyon is 466 km long, up to 29 km wide and 1.83 km deep in places. Many annimals live in and around the canyon, including elk, bison, desert bighorn sheep, and Kaibab squirrels. People have lived in and around the Grand Canyon for at least 12,000 years. About five million tourists a year also visit the park to hike the canyon trails. They also ride mules along the ridges, climb the steep rocks, and stand on the canyon’s edge to look down.","items":[{"t":"fill","n":1,"q":"Status: a UNESCO (1) ___ ","a":[["world heritage site"]],"e":"Đáp án: <b>World Heritage Site</b>."},{"t":"fill","n":2,"q":"Status: and a (2) ___ in the U.S.","a":[["national park"]],"e":"Đáp án: <b>National Park</b>."},{"t":"fill","n":3,"q":"Location: (3) ___","a":[["arizona"]],"e":"Đáp án: <b>Arizona</b>."},{"t":"fill","n":4,"q":"Width: (4) ___","a":[["29 km","up to 29 km","29km"]],"e":"Đáp án: <b>29 km</b>."},{"t":"fill","n":5,"q":"Animals: (5) ___, desert bighorn sheep and squirrels","a":[["elk, bison","elk and bison","elk bison","bison, elk"]],"e":"Đáp án: <b>elk, bison</b>."},{"t":"fill","n":6,"q":"Activities: hiking - riding (6) ___ - climbing - standing on the edge","a":[["mules","mule"]],"e":"Đáp án: <b>mules</b>."}]}]},{"id":"u5_e","name":"E. Viết","short":"Viết (tự luyện)","tag":"Unit 5","intro":"Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Câu mẫu do máy soạn, có thể có cách viết khác đúng.","groups":[{"h":"I. Reorder the words and phrases to make meaningful sentences.","items":[{"t":"self","n":1,"q":"Viet Nam / beautiful / a / Phu Quoc / very / is / island / in /.","model":"Phu Quoc is a very beautiful island in Viet Nam."},{"t":"self","n":2,"q":"with white sands / You can see / Viet Nam’s prettiest beaches / tropical rainforests / some of / and /.","model":"You can see some of Viet Nam's prettiest beaches with white sands and tropical rainforests."},{"t":"self","n":3,"q":"Sa Pa / It’s best / Many visitors / during the rainy season / report that / to visit /.","model":"Many visitors report that it's best to visit Sa Pa during the rainy season."},{"t":"self","n":4,"q":"excellent / fresh seafood / an / place / This is / to enjoy /.","model":"This is an excellent place to enjoy fresh seafood."},{"t":"self","n":5,"q":"a camera / You mustn’t forget / rice paddies / to take / of the / wonderful pictures /.","model":"You mustn't forget to take a camera to take wonderful pictures of the rice paddies."},{"t":"self","n":6,"q":"and / there / Tourists / fishing villages / can visit / national parks /.","model":"Tourists can visit national parks and fishing villages."}]},{"h":"II. Use the following sets of words / phrases to write complete sentences.","items":[{"t":"self","n":1,"q":"I/ think /Trang An Complex / a wonderful / tourist attraction / Viet Nam.","model":"I think Trang An Complex is a wonderful tourist attraction in Viet Nam."},{"t":"self","n":2,"q":"How / money / you / need / a tour / to Mui Ne?","model":"How much money do you need for a tour to Mui Ne?"},{"t":"self","n":3,"q":"You / mustn’t / forget / take / necessary things / your trip.","model":"You mustn't forget to take necessary things on your trip."},{"t":"self","n":4,"q":"I need / some / information / train times.","model":"I need some information about train times."},{"t":"self","n":5,"q":"You / must / careful / when / cut / food / with a knife.","model":"You must be careful when you cut food with a knife."},{"t":"self","n":6,"q":"I / often / get home / quickly / because / there / little traffic / on the road.","model":"I often get home quickly because there is little traffic on the road."},{"t":"self","n":7,"q":"the test/ we/ talk/ during/ mustn’t","model":"We mustn't talk during the test."},{"t":"self","n":8,"q":"brush/ you/ your teeth/ must/ three times a day","model":"You must brush your teeth three times a day."}]},{"h":"III. Use the words given to complete the following paragraph.","items":[{"t":"self","n":1,"q":"Great Barrier Reef / be / largest / coral reef / world //<br>It/ be / close / coast / Queensland / Australia //.<br>It/ be /2,600 / kilometre / long .<br>It/ make up / nearly 3000 / coral reef / and / over 600 / island //.<br>It/ list/ important/ World Heritage Site / UNESCO //.<br>Great Barrier Reef / be / largest / structure / make / living things .<br>It/ can / see /outer space /.","model":"The Great Barrier Reef is the largest coral reef in the world. It is close to the coast of Queensland, Australia. It is 2,600 kilometres long. It is made up of nearly 3,000 coral reefs and over 600 islands. It is listed as an important World Heritage Site by UNESCO. The Great Barrier Reef is the largest structure made by living things. It can be seen from outer space."}]},{"h":"IV. Rewrite the following sentences, beginning as shown, so that the meaning stays the same.","items":[{"t":"self","n":1,"q":"It is wrong of us to pick up flowers. We","model":"We mustn't pick up flowers."},{"t":"self","n":2,"q":"It is necessary for us to review the lessons for the test. We","model":"We must review the lessons for the test."},{"t":"self","n":3,"q":"There are some chairs and a table in the kitchen. We have","model":"We have some chairs and a table in the kitchen."},{"t":"self","n":4,"q":"Not many people can understand his lecture Only","model":"Only a few people can understand his lecture."},{"t":"self","n":5,"q":"It is wrong of us to throw rubbish. We","model":"We mustn't throw rubbish."},{"t":"self","n":6,"q":"It is necessary for us to be present at the class discussion on Saturday. We","model":"We must be present at the class discussion on Saturday."},{"t":"self","n":7,"q":"The tour guide tells us not to throw rubbish. The tour guide says that we","model":"The tour guide says that we mustn't throw rubbish."},{"t":"self","n":8,"q":"Don't drop litter. You","model":"You mustn't drop litter."},{"t":"self","n":9,"q":"They don't allow children to travel alone. Children","model":"Children mustn't travel alone."},{"t":"self","n":10,"q":"Their rule is wearing a swimsuit in the pool. You","model":"You must wear a swimsuit in the pool."}]},{"h":"V. Finish each of the following sentences in such a way that it is as similarly as possible in meaning to the original sentence. Use the word given and other words if necessary. Do not change the form of the given words.","items":[{"t":"self","n":1,"q":"It’s important that you follow all the rules at the national park. (must)","model":"You must follow all the rules at the national park."},{"t":"self","n":2,"q":"Ha Long Bay has many islands and caves. (there)","model":"There are many islands and caves in Ha Long Bay."},{"t":"self","n":3,"q":"Remember to wear suncream and bring water. (forget)","model":"Don't forget to wear suncream and bring water."},{"t":"self","n":4,"q":"When you want to visit Hue, you must remember to take your umbrella. (important)","model":"It's important to remember to take your umbrella when you want to visit Hue."},{"t":"self","n":5,"q":"It can be quite cold at night in Da Lat, so take some warm clothes with you. (because)","model":"You should take some warm clothes with you because it can be quite cold at night in Da Lat."},{"t":"self","n":6,"q":"No lake in the world is deeper than Lake Baikal. (deepest )","model":"Lake Baikal is the deepest lake in the world."},{"t":"self","n":7,"q":"Traveling to the beach is more interesting than traveling to the mountain (boring)","model":"Traveling to the mountain is more boring than traveling to the beach."},{"t":"self","n":8,"q":"It's very important for you to arrive on time. (must )","model":"You must arrive on time."}]},{"h":"VI. Write a short paragraph (40-60 words) about a natural wonder of the Viet Nam you want to visit.","items":[{"t":"self","n":1,"q":"","model":"I want to visit Ha Long Bay. It is in Quang Ninh Province and it is a UNESCO World Heritage Site. There are thousands of islands and caves in the bay. I want to take a boat trip and swim in the clear water. I think it is a wonderful place."}]}],"selfCheck":true}];

s rainy. You ___ take an umbrella","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":7,"q":"Tom ___ eat so many lollipops. It's bad for his teeth.","a":[["shouldn't"]],"e":"Đáp án: <b>shouldn't</b>."},{"t":"fill","n":8,"q":"Anna doesn't feel well. She ___ see a doctor","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":9,"q":"They have a test tomorrow. They ___ stay at home and study.","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":10,"q":"\"Vinh is always tired in the morning - \"He ___ stay up so late.\"","a":[["shouldn't"]],"e":"Đáp án: <b>shouldn't</b>."},{"t":"fill","n":11,"q":"If you want to lose weight, you ___ do some exercise","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":12,"q":"Your room is really messy, you ___ leave without tidy it immediately","a":[["shouldn't"]],"e":"Đáp án: <b>shouldn't</b>."},{"t":"fill","n":13,"q":"We ___ leave too late tomorrow if we want to reach the beach before lunch.","a":[["shouldn't"]],"e":"Đáp án: <b>shouldn't</b>."},{"t":"fill","n":14,"q":"You ___ always knock on the door before entering. This is a private office.","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":15,"q":"The doctor told him that he ___ eat less. He’s too fat.","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":16,"q":"I think you ___ spend less money on clothes. They’re too expensive.","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":17,"q":"That’s a fantastic book. You ___ read it.","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":18,"q":"He is often late for work. He ___ get up earlier.","a":[["should"]],"e":"Đáp án: <b>should</b>."},{"t":"fill","n":19,"q":"She ___ tell lies.","a":[["shouldn't"]],"e":"Đáp án: <b>shouldn't</b>."},{"t":"fill","n":20,"q":"He’s fifteen. He ___ drive a car.","a":[["shouldn't"]],"e":"Đáp án: <b>shouldn't</b>."}]},{"h":"VII. Complete the conversation with the questions from the box.","passage":"<b>Khung câu:</b><br>A. What do you do during Tet?<br>B. Do you go home at Tet?<br>C. I wish you a happy new year!<br>D. What should you do at Tet?<br>E. What do you do to prepare for Tet?<br><br>Tom\t: (1) ____________________________________<br>Phong\t: Yes. Tet is a time for family gathering.<br>Tom\t: (2) ____________________________________<br>Phong\t: We clean and decorate our house with peach flowers and plants. We cook some special food such as banh chung and Tet cakes.<br>Tom\t: (3) ____________________________________<br>Phong\t: We dress beautiful and visit our ralatives and friends. We also go to the temples and pagodas to pray for a happy year.<br>Tom\t: (4) ____________________________________<br>Phong\t: We should say “Happy new year” when we meet people and shouldn’t break anything.<br>Tom\t: (5) ____________________________________<br>Phong\t: Thank you. May all your wishes in the new year come true!","items":[{"t":"fill","n":1,"q":"Chỗ trống (1): gõ chữ cái A–E: ___","a":[["B"]],"e":"Đáp án: <b>B</b>."},{"t":"fill","n":2,"q":"Chỗ trống (2): gõ chữ cái A–E: ___","a":[["E"]],"e":"Đáp án: <b>E</b>."},{"t":"fill","n":3,"q":"Chỗ trống (3): gõ chữ cái A–E: ___","a":[["A"]],"e":"Đáp án: <b>A</b>."},{"t":"fill","n":4,"q":"Chỗ trống (4): gõ chữ cái A–E: ___","a":[["D"]],"e":"Đáp án: <b>D</b>."},{"t":"fill","n":5,"q":"Chỗ trống (5): gõ chữ cái A–E: ___","a":[["C"]],"e":"Đáp án: <b>C</b>."}]}]},{"id":"u6_d","name":"D. Đọc hiểu","short":"Đọc hiểu","tag":"Unit 6","intro":"Làm hết rồi bấm \"Nộp bài\", máy chấm ngay và hiện đáp án. Đáp án theo file GV của cô.","groups":[{"h":"D I.1 Fill each blank with one word from the box.","passage":"Tet or lunar New Year is the most important [[1]] in Viet Nam. It usually happens in late January or early February. Tet holiday is the best occasion for family [[2]] . Before Tet, Vietnamese people often go [[3]] . The items of shopping are: food, new clothes, peach flowers and household [[4]] . People often make banh Chung, the main food for Tet and other [[5]] foods. During Tet, they always smile and behave nicely. They [[6]] family member, relatives and friends good luck and give lucky money to children. The Vietnamese believe that Tet is an occasion to enjoy life after a hard-working year.","box":["holiday","gatherings","shopping","decorations","special","wish"],"items":[{"t":"gap","a":"holiday","e":"Đáp án: <b>holiday</b>."},{"t":"gap","a":"gatherings","e":"Đáp án: <b>gatherings</b>."},{"t":"gap","a":"shopping","e":"Đáp án: <b>shopping</b>."},{"t":"gap","a":"decorations","e":"Đáp án: <b>decorations</b>."},{"t":"gap","a":"special","e":"Đáp án: <b>special</b>."},{"t":"gap","a":"wish","e":"Đáp án: <b>wish</b>."}]},{"h":"D I.2 Fill each blank with one word from the box (chỗ trống 1–5).","passage":"In Canada and the United States, [[1]] of the most popular days in the year is Halloween. Halloween is on October 31st. It is a day [[2]] some people dress up in [[3]] or unusual costumes. For example, they may dress up to look [[4]] an animal, a person from a book or a movie or a famous person from history. In some places, children go to school in their Halloween costumes. After [[5]] ","box":["one","when","strange","like","dark","put","candy","next","parties","prize"],"items":[{"t":"gap","a":"one","e":"Đáp án: <b>one</b>."},{"t":"gap","a":"when","e":"Đáp án: <b>when</b>."},{"t":"gap","a":"strange","e":"Đáp án: <b>strange</b>."},{"t":"gap","a":"like","e":"Đáp án: <b>like</b>."},{"t":"gap","a":"dark","e":"Đáp án: <b>dark</b>."}]},{"h":"D I.2 Fill each blank with one word from the box (chỗ trống 6–10, đánh số lại 1–5).","passage":"many young children [[1]] on their costumes and visit their neighbors. They knock on the door and shout \"Trick or Treat!\" Then the neighbors give them some [[2]] , and the children go on to the [[3]] house. Adults also enjoy dressing up for Halloween. There are usually Halloween [[4]] in the evening and usually there is a [[5]] for the best or most unusual costumes.","box":["one","when","strange","like","dark","put","candy","next","parties","prize"],"items":[{"t":"gap","a":"put","e":"Đáp án: <b>put</b>."},{"t":"gap","a":"candy","e":"Đáp án: <b>candy</b>."},{"t":"gap","a":"next","e":"Đáp án: <b>next</b>."},{"t":"gap","a":"parties","e":"Đáp án: <b>parties</b>."},{"t":"gap","a":"prize","e":"Đáp án: <b>prize</b>."}]},{"h":"D II.1 True or False","passage":"In some Asia contries, people celebrate the New Year in four of five day. In other countries, they celebrate Christmas and the New Year together. For example, in the UK there is a long holiday from 24th of December to the 2nd. On New Year’s Eve, British people often eat, drink and go to parties. Many people go to Trafalgar Square in London or a street party in their city. Others visit friends or go to pubs and restaurants. These places are very crowded on that night. There is a great atmosphere when everyone waits for Big Ben to strike midnight. Then people kiss and hold hands to sing the traditional Scotish song Auld Lang Syne happily.","items":[{"t":"tf","n":1,"q":"New Year celebration in the UK is longer than in some Asian countries.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":2,"q":"The New Year holiday in the UK ends in December.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":3,"q":"The British often stay at home on New Year’s Eve.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":4,"q":"Restaurants and pubs are full on people on that night.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":5,"q":"Everyone feels happy after hearing the Big Ben strike midnight.","a":true,"e":"Đáp án: <b>True</b>."}]},{"h":"D II.2 True or False","passage":"New Year’s Day is celebrated on January 1st. New Year’s Day is a bank holiday. A bank holiday is a public holiday. Most shops and businesses close for the day. New Year’s Day is a holiday for nearly everyone in the UK. Very few trains and buses run on New Year’s Day. Most people stay at home and relax with their families.<br>There is an old tradition in Scotland and some others parts of the UK that the first person to enter someone’s home on New Year’s Day will bring all the luck for the coming year with them. This tradition is called first footing.<br>The first person to enter a house on New Year’s Day is known as the first footer. Dark-haired people are thought to be the luckiest first footers, and it is traditional to carry a lump of coal when going first footing.<br>People often make New Year’s resolutions at the start of the New Year. Resolutions are things that people have decided (or resolved) to do to make their lives better, such as stopping smoking or losing weight. Not everybody manages to keep their New Year’s resolutions, though!","items":[{"t":"tf","n":1,"q":"New Year’s Eve is a bank holiday in England.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":2,"q":"Most buses in England don’t run on New Year’s Day.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":3,"q":"First footing is a tradition in Scotland.","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":4,"q":"People with dark hair are not welcome as first footers.","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":5,"q":"English people always keep their New Year’s resolutions.","a":false,"e":"Đáp án: <b>False</b>."}]},{"h":"D II.3 True or False","passage":"Things You Should And Should Not Do During Tet Holiday In Vietnam.<br>Tet is the biggest and most important holiday in Vietnam. It is a great occasion for families to gather together and enjoy relaxing times off. The days from December 30 to January 3 Lunar calendar are the main days of festival: There are many customs in Vietnam dictating what to do and what not to do during these days. Being a travellers, it is extremely necessary to understand traditional customs and values of the festival while you join it, especially if you are invited to a Vietnamese family during Tet.<br>What should do<br>Pay all the debts before Tet: The Vietnamese people believe that it is bad luck to keep the debts and borrowed things of the old year. Also, it means they can be stuck in debts in the new year as they did in old year. Thus, they should pay all debts before Tet.<br>Clean and decorate house: On the few last days of the old year, the Vietnamese will clean the houses, gardens and altars. They also decorate their house with peach trees, ballons, couplets. People in the South of Vietnam often store their brooms because they think that their asset will be stolen if their brooms are lost in Tet.<br>Shopping new clothes: The conception of getting more luck in the New Year, the Vietnamese often buy and wear new, bright colorful clothes in the New Year. Red, yellow, blue are color symbolizing good luck and prosperity. On the other hand, traditional customs like colorful áo dài and áo gấm overwhelming in all Vietnamese streets.<br>Lucky money- “Lì xì”: A special custom of the Vietnamese is to give “lì xì” in the first day of Tet holiday. Adults will prepare some lucky money to give children and kids who visit their home. This is considered as a symbol of luck for the New Year. Besides, the adults say best wishes together, which expresses their expectation of taking and giving luck, prosperity and happiness to all their family and neighbors.<br>Take and give presents: Giving gifts in Tet festivals is also traditional custom in Vietnam. Gifts are often cookie boxes, fruits, wine, tea, coffee, or other drinks. This is to connect and enhance the relationship of neighbors and business partners.<br>What should not do?<br>Say bad words: The Vietnamese people do not say bad things during Tet holiday. They also avoid debating to others. When there are any conflicts, keep calm, a happy mind and solve it peacefully.<br>Sweep house: Sweep house in the first day of Tet holiday is considered to sweep all luck and money out of their house. When visting to the Vietnamese house in Tet, you should avoid throwing trashes onto the floor.<br>Wear black or white clothes: black and white are mainly used in Vietnamese funeral, thus it is an unlucky sign if you wear these color clothes in Tet holiday.<br>Ask for fire or water: Many hosts do not like those who ask fire and water when coming to their house in the New Year because they believe that symbolize for a blessing. Keep it in your mind to have a joyful Tet in Vietnam.","items":[{"t":"tf","n":1,"q":"People should pay all debts before Tet","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":2,"q":"The Vietnamese people will sweep their houses in Tet holiday","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":3,"q":"People should wear black or white clothes in Tet holiday","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":4,"q":"People shouldn’t take and give presents in Tet holiday","a":false,"e":"Đáp án: <b>False</b>."},{"t":"tf","n":5,"q":"They shouldn’t also say bad things during Tet holiday","a":true,"e":"Đáp án: <b>True</b>."},{"t":"tf","n":6,"q":"Lucky money is considered as a symbol of luck for the New Year","a":true,"e":"Đáp án: <b>True</b>."}]},{"h":"D III. Read the text and choose the correct answer.","items":[{"t":"mcq","n":1,"q":"Hari Raya Puasa is celebrated by the Muslims so as to _____.","o":["fast for a month","mark the end of fasting for a month","welcome the Muslim New Year","wait for the sunrise"],"a":1,"e":"Đáp án đúng: <b>B</b>. mark the end of fasting for a month"},{"t":"mcq","n":2,"q":"Muslims eat _____ during Ramadam.","o":["when they are hungry","after sunrise and before sunset","before sunrise and after sunset","only one meal"],"a":2,"e":"Đáp án đúng: <b>C</b>. before sunrise and after sunset"},{"t":"mcq","n":3,"q":"Only _____ are excused from fasting.","o":["ill people","elderly people","young children","pregnant women"],"a":0,"e":"Đáp án đúng: <b>A</b>. ill people"},{"t":"mcq","n":4,"q":"Muslims go to the mosque to _____ on the morning of Hari Raya Puasa before visiting their relatives and friends.","o":["pray to their parents","purchase food and drinks","buy clothes for themselves and family members","pray and offer thanks to their God"],"a":3,"e":"Đáp án đúng: <b>D</b>. pray and offer thanks to their God"},{"t":"mcq","n":5,"q":"The children are the happiest lot during Hari Raya Puasa probably because they _____.","o":["can seek forgiveness for being naughty","have food to eat","get a new home","receive money from their elders"],"a":3,"e":"Đáp án đúng: <b>D</b>. receive money from their elders"}],"passage":"Hari Raya Puasa is an important celebration in the Muslim calendar. The word “Hari Raya” means “a day of celebration”. Many people mistake Hari Raya Puasa for the Muslim New Year but it is not. In actual fact, Hari Raya Puasa is a festival celebrated by the Muslims to mark the end of the one- month fasting.<br>Prior to Hari Raya Puasa, the Muslims fast for a one-month period. This is known as Ramadan. The fasting time begins at sunrise and ends at sunset. Everyone, including young children, has to fast. Only the sick are excused from fasting.<br>For this special occasion, the Muslims buy new clothes, give their homes a new coat of paint and buy new furniture. On the morning of Hari Raya Puasa, the Muslims wear their new clothes to the mosque to pray and offer thanks to their God. Then they will seek forgiveness from their elders before visiting friends and relatives.<br>Unmarried children will receive money placed in green packets from their elders. Many delicious dishes will also be served for this special occasion."},{"h":"D IV.A In which country does this happen on New Year's Eve?","passage":"New Year’s celebrations around the world<br>In the USA, people count down from 10 to 0. After that they kiss the person who is next to them. The most famous place to do this is Times Square, in Manhattan, New York.<br>In Spain, people have a big family dinner. At midnight, they eat 12 grapes. They also wear something red to welcome the New Year.<br>In Brazil, people go to the beach. They sing and dance they throw flowers into the water to honor lemanja, an African goddess. One of the most famous places to do this is in Copacabana beach. There is a big firework.<br>In the Philippines, people open all doors and windows in the house in order to allow negative energy to leave and good energy to enter.<br>In Italy, people eat lentils at their dinner. They also have to throw away old things. This tradition means bringing about good luck for the New Year.","items":[{"t":"mcq","n":1,"q":"They throw flowers into the water.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":0,"e":"Đáp án: <b>Brazil</b>."},{"t":"mcq","n":2,"q":"They open doors and windows.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":1,"e":"Đáp án: <b>The Philippines</b>."},{"t":"mcq","n":3,"q":"They have a big dinner.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":2,"e":"Đáp án: <b>Spain</b>."},{"t":"mcq","n":4,"q":"They eat grapes.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":2,"e":"Đáp án: <b>Spain</b>."},{"t":"mcq","n":5,"q":"They kiss the person next to them.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":4,"e":"Đáp án: <b>The USA</b>."},{"t":"mcq","n":6,"q":"They wear something red.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":2,"e":"Đáp án: <b>Spain</b>."},{"t":"mcq","n":7,"q":"They go to Copacabana beach to watch the firework.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":0,"e":"Đáp án: <b>Brazil</b>."},{"t":"mcq","n":8,"q":"They throw away old things.","o":["Brazil","The Philippines","Spain","Italy","The USA"],"a":3,"e":"Đáp án: <b>Italy</b>."}]},{"h":"D IV.B Use no more than TWO words from the text to complete the sentences.","items":[{"t":"fill","n":1,"q":"People in the Philippines open the doors to let ___ in.","a":[["good energy"]],"e":"Đáp án: <b>good energy</b>."},{"t":"fill","n":2,"q":"For the Italians, throwing old things means bringing about ___ .","a":[["good luck"]],"e":"Đáp án: <b>good luck</b>."},{"t":"fill","n":3,"q":"An ___ is honored in Brazil.","a":[["african goddess"]],"e":"Đáp án: <b>African goddess</b>."},{"t":"fill","n":4,"q":"People ___ in Times Square in New York.","a":[["count down"]],"e":"Đáp án: <b>count down</b>."},{"t":"fill","n":5,"q":"Spanish people often put on something ___ to welcome the New Year.","a":[["red"]],"e":"Đáp án: <b>red</b>."}]}]},{"id":"u6_e","name":"E. Viết","short":"Viết (tự luyện)","tag":"Unit 6","intro":"Em viết câu trả lời rồi bấm \"Kiểm tra\" để xem câu mẫu và tự đối chiếu. Câu mẫu do máy soạn, có thể có cách viết khác đúng.","groups":[{"h":"I. Use the given words/ phrases to make complete sentences, make any change if necessary.","items":[{"t":"self","n":1,"q":"My mother/ usually/ cook. Special food/ Tet.","model":"My mother usually cooks special food for Tet."},{"t":"self","n":2,"q":"Children/ should/ not/ eat/ lots/ sweets/.","model":"Children shouldn't eat lots of sweets."},{"t":"self","n":3,"q":"There/ be/ not/ interesting activity/ Tet/ here/.","model":"There aren't any interesting activities at Tet here."},{"t":"self","n":4,"q":"They/ go/ Times Square/ watch/ New Year’s Eve Ball/ drop/.","model":"They go to Times Square to watch the New Year's Eve Ball drop."},{"t":"self","n":5,"q":"Viet Nam/ people/ give/ lucky/ money/ old people/ children/.","model":"In Viet Nam, people give lucky money to old people and children."}]},{"h":"II. Reorder the words and phrases to make meaningful sentences.","items":[{"t":"self","n":1,"q":"climb/ shouldn’t/children/ trees","model":"Children shouldn't climb trees."},{"t":"self","n":2,"q":"from my parents / some customs / I / about Tet / learn /.","model":"I learn some customs about Tet from my parents."},{"t":"self","n":3,"q":"Happy New Year / them / lucky money / us We / give / and / wish / they /.","model":"We give them lucky money and they wish us Happy New Year."},{"t":"self","n":4,"q":"on other people / wash away / In Thailand, / throw water / they bad luck / to /.","mod ouses before Tet."}]},{"h":"IV. Use the words given and other words, complete the second sentence that it has similar meaning to the first sentence. Do not change the words given. (Use 2 - 5 words in total).","items":[{"t":"self","n":1,"q":"It would be a good idea for you to go to a pagoda. (should)","model":"You should go to a pagoda."},{"t":"self","n":2,"q":"You can trust me to finish the exercise on time. (will)","model":"I will finish the exercise on time."},{"t":"self","n":3,"q":"It's unlikely that we'll do the shopping next week. (probably)","model":"We will probably not do the shopping next week."},{"t":"self","n":4,"q":"I'm never going to break things again. things. (will)","model":"I will never break things again."},{"t":"self","n":5,"q":"I advise you not to eat lots of sweets. (should)","model":"You shouldn't eat lots of sweets."}]},{"h":"V. Complete the second sentence so that it has the same meaning as the first one, using SHOULD or SHOULDN’T.","items":[{"t":"self","n":1,"q":"It’s good if children help their parents decorate the house. Children","model":"Children should help their parents decorate the house."},{"t":"self","n":2,"q":"It’s not a good idea for children to ask for lucky money. Children","model":"Children shouldn't ask for lucky money."},{"t":"self","n":3,"q":"People think that breaking things at Tet is bad luck. You","model":"You shouldn't break things at Tet."},{"t":"self","n":4,"q":"It’s a good idea to dress beautifully during New Year’s Day. People","model":"People should dress beautifully during New Year's Day."},{"t":"self","n":5,"q":"Playing games all night is not good for small children. Small children","model":"Small children shouldn't play games all night."}]},{"h":"VI. Rewrite the following sentences without changing their original meanings.","items":[{"t":"self","n":1,"q":"I am not happy when children lie to their parents. Children","model":"Children shouldn't lie to their parents."},{"t":"self","n":2,"q":"It’s good if you say “Thank you ” to a person who has helped you. You","model":"You should say \"Thank you\" to a person who has helped you."},{"t":"self","n":3,"q":"Why don’t you go out with your friends? You","model":"You should go out with your friends."},{"t":"self","n":4,"q":"Shhh! Don't talk too loud. My sister is sleeping. We","model":"We shouldn't talk too loud. My sister is sleeping."},{"t":"self","n":5,"q":"Drinking so much wine is not good for your father. Your father","model":"Your father shouldn't drink so much wine."},{"t":"self","n":6,"q":"Getting up early every day is good for your health. You","model":"You should get up early every day."},{"t":"self","n":7,"q":"It’s good if children go to bed early. Children","model":"Children should go to bed early."},{"t":"self","n":8,"q":"It’s not a good idea when students copy other students’ work. Students","model":"Students shouldn't copy other students' work."},{"t":"self","n":9,"q":"It’s a good for you to take exercise every day. You","model":"You should take exercise every day."},{"t":"self","n":10,"q":"It’s very important not to drink the water there. It will make you ill. You","model":"You shouldn't drink the water there."}]},{"h":"VII. Read the Dos and Don’ts in Chinese New Year Celebrations, then complete the email from Wu to Tim.","items":[{"t":"self","n":1,"q":"From: Wu<br>To: Tim<br>Dear Tim,<br>I will tell you more about our New Year celebrations.<br>On New Year’s Day, we should <u>__________________</u>. We should <u>__________________,</u>too.<br>But we shouldn’t <u>__________________</u>. We shouldn’t <u>__________________</u>, either.<br>Please write and tell me about your New Year celebrations.<br>Yours,<br>Wu","model":"On New Year's Day, we should sweep the house carefully before the New Year. We should decorate our home with red objects, too. But we shouldn't sweep or clean the house for several days after the New Year. We shouldn't knit or do any needle work, either."}]},{"h":"VIII. Write a short paragraph (40-60 words) about your family’s preparation for Tet holiday.","items":[{"t":"self","n":1,"q":"You can use the following questions as cues:<br>When do your family start to prepare?<br>What do your family buy?<br>How do your family decorate the house?","model":"My family starts to prepare for Tet about two weeks before. We buy new clothes, food and peach flowers. My mother cooks banh chung and my father decorates the house with flowers. We clean the house together. I love this time because the whole family is happy."}]}],"selfCheck":true}];
